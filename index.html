<!DOCTYPE html>
<html lang="en" data-font="dos-vga">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Tab</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* True 1980s IBM PC DOS VGA 437 (8x16) & Pixelated Bitmap Fonts (Zero Google Fonts, Not VT323) */
    @font-face {
      font-family: 'Perfect_DOS_VGA';
      src:
        url('https://cdn.jsdelivr.net/npm/tuicss@2.1.2/dist/fonts/Perfect%20DOS%20VGA%20437%20Win.ttf') format('truetype'),
        url('https://cdn.jsdelivr.net/npm/tuicss@2.1.2/dist/fonts/Perfect%20DOS%20VGA%20437.ttf') format('truetype'),
        url('https://cdn.jsdelivr.net/gh/kaixinol/linux-bsod/Web437_IBM_VGA_8x16.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Pixel_MS_Sans';
      src:
        url('https://cdn.jsdelivr.net/npm/98.css@0.1.20/dist/ms_sans_serif.woff2') format('woff2'),
        url('https://cdn.jsdelivr.net/npm/98.css@0.1.20/dist/ms_sans_serif.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Pixel_MS_Sans_Bold';
      src:
        url('https://cdn.jsdelivr.net/npm/98.css@0.1.20/dist/ms_sans_serif_bold.woff2') format('woff2'),
        url('https://cdn.jsdelivr.net/npm/98.css@0.1.20/dist/ms_sans_serif_bold.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      /* 1987 Windows Executive Teal & Warm Archival Putty */
      --bg-desktop: #285869;
      --bg-pattern: rgba(8, 22, 30, 0.24);
      --win-bg: #efece4;
      --win-surface: #faf8f4;
      --win-muted: #e2ddd3;
      --win-border: #181c22;
      --btn-shadow: #181c22;
      --win-shadow: rgba(10, 22, 30, 0.45);
      --title-active-bg: #0f3566;
      --title-active-text: #faf8f4;
      --title-inactive-bg: #79828a;
      --title-inactive-text: #efece4;
      --text-primary: #15191f;
      --text-secondary: #505862;
      --accent: #164e96;
      --accent-hover: #0f3b75;
      --accent-text: #ffffff;
      --accent-soft: #d6e4f7;
      --btn-hover-bg: #e5e0d4;
      --danger-bg: #c62828;
      --danger-hover: #df3232;
      --font-main: 'Perfect_DOS_VGA', 'Courier New', monospace;

      /* Theme-adaptive yellow sticky palette (Warm Archival Canary) */
      --sticky-bg: #f8eb7d;
      --sticky-header: #ecda53;
      --sticky-rule: #bfa924;
      --sticky-border: #181c22;
      --sticky-text: #15191f;
      --sticky-placeholder: #6b5d14;
      --sticky-btn-bg: #fcf3a4;
      --sticky-btn-hover: #ecda53;

      /* Smooth curves for windows/drawers + stepped low-FPS curve for button hovers */
      --ease-out-smooth: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-btn-step: steps(2, end);
    }

    [data-font="dos-vga"] {
      --font-main: 'Perfect_DOS_VGA', 'Courier New', monospace;
    }

    [data-font="pixel-sans"] {
      --font-main: 'Pixel_MS_Sans', 'Tahoma', sans-serif;
    }

    [data-font="pixel-sans-bold"] {
      --font-main: 'Pixel_MS_Sans_Bold', 'Pixel_MS_Sans', sans-serif;
    }

    [data-font="courier-bios"] {
      --font-main: 'Courier New', 'Courier', monospace;
    }

    [data-theme="ega-dark"] {
      --bg-desktop: #0d121d;
      --bg-pattern: rgba(148, 169, 201, 0.11);
      --win-bg: #171f30;
      --win-surface: #202a40;
      --win-muted: #111724;
      --win-border: #4a5d7e;
      --btn-shadow: #060910;
      --win-shadow: rgba(3, 6, 12, 0.78);
      --title-active-bg: #1b528a;
      --title-active-text: #f4f7fb;
      --title-inactive-bg: #253046;
      --title-inactive-text: #94a6c4;
      --text-primary: #e8eef7;
      --text-secondary: #8ea2c2;
      --accent: #4ba3dc;
      --accent-hover: #67b8ed;
      --accent-text: #0a101b;
      --accent-soft: #1d3556;
      --btn-hover-bg: #293652;
      --danger-bg: #b83232;
      --danger-hover: #d13d3d;

      /* EGA Dark: Warm Ochre Gold */
      --sticky-bg: #dfc256;
      --sticky-header: #ccb03f;
      --sticky-rule: #967c19;
      --sticky-border: #4a5d7e;
      --sticky-text: #111622;
      --sticky-placeholder: #54450d;
      --sticky-btn-bg: #ead172;
      --sticky-btn-hover: #ccb03f;
    }

    [data-theme="dos-classic"] {
      --bg-desktop: #060c08;
      --bg-pattern: rgba(51, 217, 112, 0.14);
      --win-bg: #0b150f;
      --win-surface: #112117;
      --win-muted: #070e0a;
      --win-border: #208c4c;
      --btn-shadow: #020503;
      --win-shadow: rgba(0, 0, 0, 0.85);
      --title-active-bg: #1fa656;
      --title-active-text: #050c07;
      --title-inactive-bg: #13281c;
      --title-inactive-text: #62cf8d;
      --text-primary: #52ff97;
      --text-secondary: #2eb865;
      --accent: #28c969;
      --accent-hover: #4ae087;
      --accent-text: #050b07;
      --accent-soft: #143220;
      --btn-hover-bg: #182f21;
      --danger-bg: #b32d2d;
      --danger-hover: #cc3737;

      /* MS-DOS Green: Phosphor Citron */
      --sticky-bg: #c6d959;
      --sticky-header: #b1c443;
      --sticky-rule: #798a1f;
      --sticky-border: #208c4c;
      --sticky-text: #08120b;
      --sticky-placeholder: #424d0b;
      --sticky-btn-bg: #d6e673;
      --sticky-btn-hover: #b1c443;
    }

    [data-theme="amber-crt"] {
      --bg-desktop: #110c06;
      --bg-pattern: rgba(245, 166, 35, 0.13);
      --win-bg: #1b1309;
      --win-surface: #251a0d;
      --win-muted: #130d06;
      --win-border: #9e6816;
      --btn-shadow: #070402;
      --win-shadow: rgba(0, 0, 0, 0.86);
      --title-active-bg: #d98914;
      --title-active-text: #130d05;
      --title-inactive-bg: #322311;
      --title-inactive-text: #cf9438;
      --text-primary: #ffbf47;
      --text-secondary: #ba8025;
      --accent: #ed9b16;
      --accent-hover: #ffb136;
      --accent-text: #130d05;
      --accent-soft: #38250e;
      --btn-hover-bg: #312210;
      --danger-bg: #b83228;
      --danger-hover: #d13e32;

      /* Amber CRT: Warm Honey Amber */
      --sticky-bg: #e3af42;
      --sticky-header: #cc982b;
      --sticky-rule: #8f650f;
      --sticky-border: #9e6816;
      --sticky-text: #140d06;
      --sticky-placeholder: #573b05;
      --sticky-btn-bg: #edc05f;
      --sticky-btn-hover: #cc982b;
    }

    [data-theme="warm-putty"] {
      --bg-desktop: #635349;
      --bg-pattern: rgba(24, 16, 12, 0.22);
      --win-bg: #f3ede2;
      --win-surface: #fbf8f3;
      --win-muted: #e4dccf;
      --win-border: #261e1a;
      --btn-shadow: #261e1a;
      --win-shadow: rgba(24, 16, 12, 0.45);
      --title-active-bg: #8c3828;
      --title-active-text: #fbf8f3;
      --title-inactive-bg: #877b72;
      --title-inactive-text: #f3ede2;
      --text-primary: #211a16;
      --text-secondary: #63564e;
      --accent: #9e412f;
      --accent-hover: #7d3122;
      --accent-text: #ffffff;
      --accent-soft: #f2dcd7;
      --btn-hover-bg: #e8dfd2;
      --danger-bg: #b82828;
      --danger-hover: #d13232;

      --sticky-bg: #f7e683;
      --sticky-header: #ebd663;
      --sticky-rule: #bfa630;
      --sticky-border: #261e1a;
      --sticky-text: #211a16;
      --sticky-placeholder: #6e5c18;
      --sticky-btn-bg: #fbf0a7;
      --sticky-btn-hover: #ebd663;
    }

    [data-theme="borland-blue"] {
      --bg-desktop: #061838;
      --bg-pattern: rgba(103, 184, 255, 0.14);
      --win-bg: #0c2654;
      --win-surface: #12326b;
      --win-muted: #081c40;
      --win-border: #5299e0;
      --btn-shadow: #030b1c;
      --win-shadow: rgba(2, 8, 22, 0.82);
      --title-active-bg: #d9a414;
      --title-active-text: #061838;
      --title-inactive-bg: #193c78;
      --title-inactive-text: #99c4f2;
      --text-primary: #f2f7ff;
      --text-secondary: #8db8e8;
      --accent: #ebb41e;
      --accent-hover: #ffd647;
      --accent-text: #061838;
      --accent-soft: #1a4387;
      --btn-hover-bg: #183d80;
      --danger-bg: #c23030;
      --danger-hover: #db3b3b;

      --sticky-bg: #ebd060;
      --sticky-header: #d6b942;
      --sticky-rule: #998018;
      --sticky-border: #5299e0;
      --sticky-text: #061838;
      --sticky-placeholder: #54450b;
      --sticky-btn-bg: #f5df82;
      --sticky-btn-hover: #d6b942;
    }

    /* Force strict 1-bit pixelation: no anti-aliasing and no synthetic bold smearing */
    * {
      box-sizing: border-box;
      font-family: var(--font-main);
      font-synthesis: none;
      -webkit-font-smoothing: none;
      -moz-osx-font-smoothing: unset;
      font-smooth: never;
      text-rendering: optimizeSpeed;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-size: 16px;
      line-height: 1.25;
      background-color: var(--bg-desktop);
      color: var(--text-primary);
      overflow-x: hidden;
      user-select: none;
      transition: background-color 220ms var(--ease-out-smooth), color 180ms var(--ease-out-smooth);
    }

    @keyframes winPopIn {
      0% {
        opacity: 0;
        transform: translate3d(0, 6px, 0) scale(0.975);
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }
    }

    @keyframes dropdownSlideIn {
      0% {
        opacity: 0;
        transform: translate3d(0, -6px, 0) scaleY(0.96);
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0) scaleY(1);
      }
    }

    @keyframes drawerReveal {
      0% {
        opacity: 0;
        transform: translate3d(0, -4px, 0);
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }

    .animate-drawer {
      animation: drawerReveal 180ms var(--ease-out-smooth) both;
    }

    /* Alignment grid dots when Grid Snap is active */
    #desktop-canvas {
      position: relative;
      z-index: 1;
    }

    #desktop-canvas.snap-grid-overlay {
      background-image: radial-gradient(var(--bg-pattern) 2px, transparent 0);
      background-size: var(--grid-size, 24px) var(--grid-size, 24px);
    }

    /* Dashed preview box while dragging a window */
    #grid-snap-ghost {
      position: absolute;
      border: 2px dashed var(--accent);
      background-color: var(--accent-soft);
      opacity: 0.45;
      pointer-events: none;
      z-index: 10;
      transition:
        transform 130ms var(--ease-out-smooth),
        width 130ms var(--ease-out-smooth),
        height 130ms var(--ease-out-smooth),
        opacity 150ms ease;
    }

    /* Clean 1980s Window Frame */
    .win80-window {
      background-color: var(--win-bg);
      border: 2px solid var(--win-border);
      box-shadow: 4px 4px 0px var(--win-shadow);
      display: flex;
      flex-direction: column;
      contain: layout style;
      animation: winPopIn 210ms var(--ease-out-smooth);
      transition:
        background-color 220ms var(--ease-out-smooth),
        border-color 220ms var(--ease-out-smooth),
        box-shadow 180ms var(--ease-out-smooth);
    }

    .win80-window.is-active {
      box-shadow: 5px 5px 0px var(--win-shadow);
    }

    .win80-window.is-dragging,
    .sticky-widget.is-dragging {
      will-change: transform;
      user-select: none;
      box-shadow: 9px 9px 0px var(--win-shadow) !important;
      transition: box-shadow 140ms var(--ease-out-smooth) !important;
    }

    .win80-window.is-settling,
    .sticky-widget.is-settling {
      transition:
        left 240ms var(--ease-out-smooth),
        top 240ms var(--ease-out-smooth),
        transform 180ms var(--ease-out-smooth),
        box-shadow 180ms var(--ease-out-smooth) !important;
    }

    .win80-titlebar {
      background-color: var(--title-inactive-bg);
      color: var(--title-inactive-text);
      border-bottom: 2px solid var(--win-border);
      padding: 5px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: nowrap;
      overflow: hidden;
      cursor: grab;
      font-size: 16px;
      line-height: 1;
      touch-action: none;
      transition:
        background-color 180ms var(--ease-out-smooth),
        color 180ms var(--ease-out-smooth);
    }

    .win80-window.is-active .win80-titlebar {
      background-color: var(--title-active-bg);
      color: var(--title-active-text);
    }

    .win80-titlebar:active {
      cursor: grabbing;
    }

    .titlebar-lines {
      flex: 1 1 8px;
      min-width: 4px;
      height: 8px;
      margin: 0 4px;
      opacity: 0.4;
      background: repeating-linear-gradient(
        to bottom,
        currentColor,
        currentColor 1px,
        transparent 1px,
        transparent 3px
      );
    }

    .win80-btn {
      background-color: var(--win-surface);
      color: var(--text-primary);
      border: 2px solid var(--win-border);
      box-shadow: 2px 2px 0px var(--btn-shadow);
      font-size: 16px;
      line-height: 1;
      padding: 5px 9px;
      white-space: nowrap;
      flex-shrink: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition:
        background-color 90ms var(--ease-btn-step),
        color 90ms var(--ease-btn-step),
        transform 90ms var(--ease-btn-step),
        box-shadow 90ms var(--ease-btn-step);
    }

    .win80-btn:hover {
      background-color: var(--btn-hover-bg);
      color: var(--text-primary);
      transform: translate3d(-1px, -1px, 0);
      box-shadow: 3px 3px 0px var(--btn-shadow);
    }

    .win80-btn:active {
      transform: translate3d(1px, 1px, 0);
      box-shadow: 1px 1px 0px var(--btn-shadow);
    }

    .win80-btn-primary {
      background-color: var(--accent);
      color: var(--accent-text);
    }

    .win80-btn-primary:hover {
      background-color: var(--accent-hover);
      color: var(--accent-text);
    }

    /* Compact Titlebar Action Buttons (Theme-Aware) */
    .win80-bar-btn {
      background-color: var(--win-surface);
      color: var(--text-primary);
      border: 2px solid var(--win-border);
      padding: 2px 6px;
      font-size: 16px;
      line-height: 1.1;
      white-space: nowrap;
      flex-shrink: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition:
        background-color 90ms var(--ease-btn-step),
        color 90ms var(--ease-btn-step),
        transform 90ms var(--ease-btn-step);
    }

    .win80-bar-btn:hover {
      background-color: var(--btn-hover-bg);
      color: var(--text-primary);
      transform: translate3d(-1px, -1px, 0);
    }

    .win80-bar-btn:active {
      transform: translate3d(1px, 1px, 0);
    }

    .win80-bar-btn.is-active {
      background-color: var(--accent);
      color: var(--accent-text);
    }

    .win80-bar-btn.is-active:hover {
      background-color: var(--accent-hover);
      color: var(--accent-text);
    }

    /* Yellow Done Button in Quicklinks Edit Mode */
    .win80-btn-yellow,
    .win80-bar-btn.win80-btn-yellow {
      background-color: #facc15 !important;
      color: #111418 !important;
      border-color: #111418 !important;
    }

    .win80-btn-yellow:hover,
    .win80-bar-btn.win80-btn-yellow:hover {
      background-color: #eab308 !important;
      color: #111418 !important;
    }

    .win80-input {
      background-color: var(--win-surface);
      color: var(--text-primary);
      border: 2px solid var(--win-border);
      padding: 8px 10px;
      font-size: 16px;
      line-height: 1.2;
      outline: none;
      user-select: text;
      transition:
        box-shadow 150ms var(--ease-out-smooth),
        background-color 180ms var(--ease-out-smooth),
        border-color 180ms var(--ease-out-smooth);
    }

    .win80-input:focus {
      box-shadow: inset 0 0 0 2px var(--accent);
    }

    /* Quicklink Tile & + Button Tile */
    .quicklink-tile {
      background-color: var(--win-surface);
      color: var(--text-primary);
      border: 2px solid var(--win-border);
      box-shadow: 2px 2px 0px var(--btn-shadow);
      font-size: 16px;
      transition:
        background-color 90ms var(--ease-btn-step),
        transform 90ms var(--ease-btn-step),
        box-shadow 90ms var(--ease-btn-step);
    }

    .quicklink-tile:hover {
      background-color: var(--btn-hover-bg);
      color: var(--text-primary);
      transform: translate3d(-1px, -1px, 0);
      box-shadow: 3px 3px 0px var(--btn-shadow);
    }

    .quicklink-tile:active {
      transform: translate3d(1px, 1px, 0);
      box-shadow: 1px 1px 0px var(--btn-shadow);
    }

    /* Compact Quicklinks Mode & Scrollable/Resizable Quicklinks Body */
    .quicklinks-scroll-body {
      max-height: var(--ql-max-h, 480px);
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: thin;
      scrollbar-color: var(--win-border) var(--win-muted);
    }

    .quicklinks-compact .group-box {
      padding: 6px 8px;
    }

    .quicklinks-compact .quicklink-tile,
    .quicklinks-compact .quicklink-add-tile {
      padding: 4px 8px !important;
      font-size: 16px;
    }

    .group-filter-tab {
      background-color: var(--win-muted);
      color: var(--text-secondary);
      border: 2px solid var(--win-border);
      padding: 2px 8px;
      cursor: pointer;
      line-height: 1.1;
      transition:
        background-color 90ms var(--ease-btn-step),
        color 90ms var(--ease-btn-step);
    }

    .group-filter-tab:hover {
      background-color: var(--btn-hover-bg);
      color: var(--text-primary);
    }

    .group-filter-tab.is-active {
      background-color: var(--accent);
      color: var(--accent-text);
    }

    .group-filter-tab.is-active:hover {
      background-color: var(--accent-hover);
      color: var(--accent-text);
    }

    .win80-resize-grip {
      width: 16px;
      height: 16px;
      cursor: nwse-resize;
      display: inline-flex;
      align-items: flex-end;
      justify-content: flex-end;
      opacity: 0.65;
      touch-action: none;
      user-select: none;
    }

    .win80-resize-grip:hover {
      opacity: 1;
    }

    .quicklink-add-tile {
      background-color: var(--win-muted);
      color: var(--text-primary);
      border: 2px dashed var(--win-border);
      font-size: 16px;
      transition:
        background-color 90ms var(--ease-btn-step),
        transform 90ms var(--ease-btn-step),
        box-shadow 90ms var(--ease-btn-step);
    }

    .quicklink-add-tile:hover {
      background-color: var(--btn-hover-bg);
      color: var(--text-primary);
      border-style: solid;
      transform: translate3d(-1px, -1px, 0);
      box-shadow: 2px 2px 0px var(--btn-shadow);
    }

    .quicklink-add-tile:active {
      transform: translate3d(1px, 1px, 0);
      box-shadow: none;
    }

    .group-box {
      background-color: var(--group-bg, var(--win-muted));
      border: 2px solid var(--group-border, var(--win-border));
      padding: 10px;
      transition:
        background-color 200ms var(--ease-out-smooth),
        border-color 200ms var(--ease-out-smooth),
        box-shadow 160ms var(--ease-out-smooth);
    }

    .group-box.is-group-drop-target {
      outline: 2px dashed var(--accent);
      outline-offset: -4px;
      box-shadow: inset 0 0 0 2px var(--accent-soft);
    }

    .quicklink-tile[draggable="true"] {
      cursor: grab;
    }

    .quicklink-tile[draggable="true"]:active {
      cursor: grabbing;
    }

    .quicklink-tile.is-being-dragged {
      opacity: 0.45;
      border-style: dashed;
    }

    .quicklink-tile.is-drop-target {
      outline: 2px dashed var(--accent);
      outline-offset: 2px;
      transform: translate3d(-2px, -2px, 0);
    }

    .group-color-swatch {
      width: 16px;
      height: 16px;
      border: 2px solid var(--win-border);
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
      transition: transform 120ms steps(2, end);
    }

    .group-color-swatch:hover {
      transform: scale(1.15);
    }

    .group-color-swatch.is-selected {
      outline: 2px solid var(--text-primary);
      outline-offset: 1px;
    }

    .top-menubar {
      position: sticky;
      top: 0;
      z-index: 9999;
      background-color: var(--win-bg);
      border-bottom: 2px solid var(--win-border);
      transition: background-color 220ms var(--ease-out-smooth), border-color 220ms var(--ease-out-smooth);
    }

    .dropdown-panel {
      background-color: var(--win-bg);
      border: 2px solid var(--win-border);
      box-shadow: 4px 4px 0px var(--win-shadow);
      transform-origin: top center;
      animation: dropdownSlideIn 160ms var(--ease-out-smooth);
    }

    .suggestion-row {
      transition: background-color 80ms var(--ease-out-smooth);
    }

    .suggestion-row:hover,
    .suggestion-row.is-highlighted {
      background-color: var(--accent-soft);
    }

    .suggestion-row.is-highlighted {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    .suggestion-completion {
      color: var(--accent);
      letter-spacing: 0.02em;
    }

    .suggestion-icon {
      width: 18px;
      text-align: center;
      color: var(--text-secondary);
      flex-shrink: 0;
      user-select: none;
    }

    .search-ghost-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      align-items: center;
      padding: 8px 36px 8px 10px;
      font-size: 16px;
      line-height: 1.2;
      white-space: pre;
      overflow: hidden;
      border: 2px solid transparent;
    }

    .suggestion-mini-btn {
      padding: 1px 6px;
      border: 1px solid transparent;
      color: var(--text-secondary);
      line-height: 1.1;
      cursor: pointer;
      opacity: 0.65;
    }

    .suggestion-row:hover .suggestion-mini-btn,
    .suggestion-row.is-highlighted .suggestion-mini-btn {
      opacity: 1;
    }

    .suggestion-mini-btn:hover {
      border-color: var(--win-border);
      background-color: var(--win-surface);
      color: var(--text-primary);
    }

    @keyframes stickySpawnIn {
      0% {
        opacity: 0;
        transform: scale(0.92);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes stickyCloseOut {
      0% {
        opacity: 1;
        transform: scale(1);
      }
      100% {
        opacity: 0;
        transform: scale(0.92);
      }
    }

    /* Theme-Adaptive Yellow Sticky Widget */
    .sticky-widget {
      background-color: var(--sticky-bg);
      color: var(--sticky-text);
      border: 2px solid var(--sticky-border);
      box-shadow: 4px 4px 0px var(--win-shadow);
      display: flex;
      flex-direction: column;
      width: 240px;
      min-height: 216px;
      contain: layout style;
      transition:
        background-color 220ms var(--ease-out-smooth),
        border-color 220ms var(--ease-out-smooth),
        box-shadow 180ms var(--ease-out-smooth);
    }

    .sticky-widget.is-entering {
      animation: stickySpawnIn 160ms var(--ease-out-smooth);
    }

    .sticky-widget.is-closing {
      animation: stickyCloseOut 130ms var(--ease-out-smooth) forwards;
      pointer-events: none;
    }

    .sticky-widget.is-active {
      box-shadow: 6px 6px 0px var(--win-shadow);
    }

    .sticky-pinbar {
      background-color: var(--sticky-header);
      border-bottom: 2px dashed var(--sticky-rule);
      padding: 6px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: grab;
      color: var(--sticky-text);
      touch-action: none;
      transition: background-color 220ms var(--ease-out-smooth), border-color 220ms var(--ease-out-smooth);
    }

    .sticky-pinbar:active {
      cursor: grabbing;
    }

    .sticky-note-btn {
      width: 22px;
      height: 22px;
      background-color: var(--sticky-btn-bg);
      color: var(--sticky-text);
      border: 2px solid var(--sticky-border);
      box-shadow: 1px 1px 0px var(--btn-shadow);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      line-height: 1;
      transition:
        background-color 90ms var(--ease-btn-step),
        transform 90ms var(--ease-btn-step),
        box-shadow 90ms var(--ease-btn-step);
    }

    .sticky-note-btn:hover {
      background-color: var(--sticky-btn-hover);
      transform: translate3d(-1px, -1px, 0);
      box-shadow: 2px 2px 0px var(--btn-shadow);
    }

    .sticky-note-btn:active {
      transform: translate3d(1px, 1px, 0);
      box-shadow: none;
    }

    .sticky-paper-input {
      background: transparent;
      color: var(--sticky-text);
      border: none;
      outline: none;
      resize: none;
      width: 100%;
      flex: 1;
      min-height: 172px;
      padding: 10px;
      font-size: 16px;
      line-height: 1.25;
      user-select: text;
    }

    .sticky-paper-input::placeholder {
      color: var(--sticky-placeholder);
    }

    /* Interactive Calendar Day Cells & Full-Box Light Marker Fills */
    .cal-cell {
      position: relative;
      min-height: 28px;
      padding: 2px;
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      line-height: 1;
      background-color: transparent;
      color: var(--text-primary);
      transition:
        background-color 90ms var(--ease-btn-step),
        border-color 90ms var(--ease-btn-step),
        transform 90ms var(--ease-btn-step);
    }

    .cal-cell:hover {
      background-color: var(--btn-hover-bg);
      border-color: var(--win-border);
      transform: scale(1.06);
      z-index: 2;
    }

    .cal-cell:active {
      transform: scale(0.96);
    }

    .cal-cell.is-today {
      background-color: var(--accent);
      color: var(--accent-text);
    }

    .cal-cell.is-today:hover {
      background-color: var(--accent-hover);
      color: var(--accent-text);
    }

    .cal-cell.has-marker {
      color: #111418 !important;
      border-color: var(--win-border);
    }

    .cal-cell.is-selected {
      outline: 2px solid var(--win-border);
      outline-offset: -2px;
      background-color: var(--accent-soft);
    }

    .cal-cell.is-today.is-selected {
      background-color: var(--accent);
      outline: 2px dashed #ffffff;
    }

    .marker-stamp-btn {
      border: 2px solid var(--win-border);
      background-color: var(--win-surface);
      padding: 3px 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      line-height: 1;
      transition:
        background-color 90ms var(--ease-btn-step),
        transform 90ms var(--ease-btn-step),
        box-shadow 90ms var(--ease-btn-step);
    }

    .marker-stamp-btn:hover,
    .marker-stamp-btn.is-selected {
      background-color: var(--btn-hover-bg);
      box-shadow: inset 0 0 0 1px var(--accent);
    }

    .marker-stamp-btn:hover {
      transform: translate3d(0, -1px, 0);
    }

    .marker-stamp-btn:active {
      transform: translate3d(0, 1px, 0);
    }

    /* Rolled-up / Shaded Window State */
    .win80-window.is-shaded > :not(.win80-titlebar) {
      display: none !important;
    }

    .win80-window.is-shaded .win80-titlebar {
      border-bottom: none;
    }

    /* Uniform Red X Close / Delete Button */
    .win80-close-btn {
      width: 22px;
      height: 22px;
      background-color: var(--danger-bg);
      color: #ffffff;
      border: 2px solid #111418;
      box-shadow: 1px 1px 0px var(--btn-shadow);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
      transition:
        background-color 90ms var(--ease-btn-step),
        transform 90ms var(--ease-btn-step),
        box-shadow 90ms var(--ease-btn-step);
    }

    .win80-close-btn:hover {
      background-color: var(--danger-hover);
      transform: translate3d(-1px, -1px, 0);
      box-shadow: 2px 2px 0px var(--btn-shadow);
    }

    .win80-close-btn:active {
      transform: translate3d(1px, 1px, 0);
      box-shadow: none;
    }

    /* Uniform Small Square Action Button */
    .win80-icon-btn {
      width: 22px;
      height: 22px;
      background-color: var(--win-surface);
      color: var(--text-primary);
      border: 2px solid var(--win-border);
      box-shadow: 1px 1px 0px var(--btn-shadow);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
      line-height: 1;
      transition:
        background-color 90ms var(--ease-btn-step),
        transform 90ms var(--ease-btn-step),
        box-shadow 90ms var(--ease-btn-step);
    }

    .win80-icon-btn:hover {
      background-color: var(--btn-hover-bg);
      transform: translate3d(-1px, -1px, 0);
      box-shadow: 2px 2px 0px var(--btn-shadow);
    }

    .win80-icon-btn:active {
      transform: translate3d(1px, 1px, 0);
      box-shadow: none;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body class="flex flex-col min-h-screen">

  <!-- SIMPLE TOP MENU BAR (No Bottom Taskbar) -->
  <header class="top-menubar px-3 py-1.5 flex flex-wrap items-center justify-between gap-1.5">
    <div class="flex flex-wrap items-center gap-1.5">
      <!-- Settings Dropdown Container -->
      <div class="relative" id="settings-menu-container">
        <button id="settings-dropdown-btn" type="button" class="win80-btn">
          <span>Settings ▾</span>
        </button>

        <!-- Clean Dropdown Menu -->
        <div
          id="settings-dropdown-panel"
          class="dropdown-panel hidden absolute left-0 mt-2 w-80 p-4 z-[10000] space-y-3"
        >
          <div class="border-b-2 border-[var(--win-border)] pb-1">
            PREFERENCES
          </div>

          <!-- Color Theme -->
          <div>
            <label for="quick-theme-select" class="block mb-1 text-[var(--text-secondary)]">
              Color Theme
            </label>
            <select id="quick-theme-select" class="win80-input w-full py-1.5 px-2">
              <option value="classic">1987 Windows Teal</option>
              <option value="warm-putty">IBM Warm Putty</option>
              <option value="ega-dark">IBM EGA Midnight</option>
              <option value="borland-blue">Borland Turbo Blue</option>
              <option value="dos-classic">MS-DOS Phosphor Green</option>
              <option value="amber-crt">Zenith Amber CRT</option>
            </select>
          </div>

          <!-- Font Style -->
          <div>
            <label for="quick-font-select" class="block mb-1 text-[var(--text-secondary)]">
              Font
            </label>
            <select id="quick-font-select" class="win80-input w-full py-1.5 px-2">
              <option value="dos-vga">IBM PC DOS VGA (8x16)</option>
              <option value="pixel-sans">MS Sans Serif (98)</option>
              <option value="pixel-sans-bold">MS Sans Bold (System)</option>
              <option value="courier-bios">Classic Courier Terminal</option>
            </select>
          </div>

          <!-- Search Engine -->
          <div>
            <label for="quick-engine-select" class="block mb-1 text-[var(--text-secondary)]">
              Search Engine
            </label>
            <select id="quick-engine-select" class="win80-input w-full py-1.5 px-2">
              <option value="ddg">DuckDuckGo</option>
              <option value="google">Google</option>
              <option value="brave">Brave Search</option>
              <option value="startpage">Startpage</option>
              <option value="wikipedia">Wikipedia</option>
            </select>
          </div>

          <!-- Weather Settings -->
          <div class="pt-2 border-t-2 border-[var(--win-border)] space-y-2">
            <label class="block text-[var(--text-secondary)]">
              Weather Location &amp; Unit
            </label>
            <div class="flex gap-1.5">
              <input
                id="weather-city-input"
                type="text"
                placeholder="City (e.g. Chicago)"
                class="win80-input flex-1 py-1 px-2"
              />
              <button id="weather-city-save-btn" type="button" class="win80-btn win80-btn-primary py-1 px-2.5">
                Set
              </button>
            </div>
            <div class="flex items-center justify-between">
              <span>Temperature Unit</span>
              <select id="weather-unit-select" class="win80-input py-1 px-2">
                <option value="fahrenheit">Fahrenheit (°F)</option>
                <option value="celsius">Celsius (°C)</option>
              </select>
            </div>
          </div>

          <!-- Checkboxes -->
          <div class="space-y-2 pt-2 border-t-2 border-[var(--win-border)]">
            <label class="flex items-center justify-between cursor-pointer">
              <span>Snap Windows to Grid</span>
              <input type="checkbox" id="toggle-snap-grid" class="w-4 h-4 accent-[var(--accent)]" />
            </label>
            <label class="flex items-center justify-between cursor-pointer">
              <span>24-Hour Clock</span>
              <input type="checkbox" id="toggle-24h" class="w-4 h-4 accent-[var(--accent)]" />
            </label>
            <label class="flex items-center justify-between cursor-pointer">
              <span>Open Links in New Tab</span>
              <input type="checkbox" id="toggle-newtab" class="w-4 h-4 accent-[var(--accent)]" />
            </label>
            <label class="flex items-center justify-between cursor-pointer">
              <span>Show Site Icons (Favicons)</span>
              <input type="checkbox" id="toggle-favicons" class="w-4 h-4 accent-[var(--accent)]" />
            </label>
            <label class="flex items-center justify-between cursor-pointer">
              <span>Press [/] to Focus Search</span>
              <input type="checkbox" id="toggle-slash-search" class="w-4 h-4 accent-[var(--accent)]" />
            </label>
          </div>

          <div class="pt-2 border-t-2 border-[var(--win-border)] grid grid-cols-2 gap-2">
            <button id="reset-layout-btn" type="button" class="win80-btn">
              Reset Layout
            </button>
            <button id="open-backup-win-btn" type="button" class="win80-btn win80-btn-primary">
              Import / JSON
            </button>
          </div>
        </div>
      </div>

      <!-- Simple Grid Toggle Button -->
      <button
        id="topbar-grid-toggle-btn"
        type="button"
        class="win80-btn"
      >
        Grid: ON
      </button>

      <!-- Quick Window Toggles -->
      <div class="flex flex-wrap items-center gap-1.5 pl-1.5 border-l-2 border-[var(--win-border)]">
        <button type="button" data-toggle-win="win-weather" class="win80-btn">Weather</button>
        <button type="button" data-toggle-win="win-calendar" class="win80-btn">Calendar</button>
        <button type="button" data-toggle-win="win-calc" class="win80-btn">Calc</button>
        <button type="button" data-toggle-win="win-sticky" class="win80-btn">Sticky</button>
      </div>
    </div>
  </header>

  <!-- DESKTOP WORKSPACE -->
  <main id="desktop-canvas" class="relative flex-1 w-full overflow-auto p-6 min-h-[calc(100vh-52px)]">

    <!-- Snap Ghost Preview when dragging -->
    <div id="grid-snap-ghost" class="hidden"></div>

    <!-- ==========================================
         WINDOW 1: SEARCH
         ========================================== -->
    <section
      id="win-search"
      class="win80-window is-active workspace-window absolute"
      style="left: 24px; top: 24px; width: 624px; z-index: 20;"
    >
      <div class="win80-titlebar" data-drag-handle="win-search">
        <span>SEARCH</span>
        <div class="titlebar-lines"></div>
        <button
          id="search-engine-badge"
          type="button"
          class="win80-bar-btn"
        >
          DDG
        </button>
      </div>

      <div class="p-4">
        <form id="search-form" class="relative" autocomplete="off">
          <div class="flex gap-2">
            <div class="relative flex-1 flex items-center bg-[var(--win-surface)]">
              <div id="search-ghost" class="search-ghost-layer" aria-hidden="true">
                <span id="search-ghost-typed" class=" opacity-0"></span><span id="search-ghost-Rest" class="text-[var(--text-secondary)] opacity-55"></span>
              </div>
              <input
                id="search-input"
                type="text"
                placeholder="Search Google, type a URL, or press [/]..."

                  <path d="M0 0h1v1H0zM4 0h1v1H4zM1 1h1v1H1zM3 1h1v1H3zM2 2h1v1H2zM1 3h1v1H1zM3 3h1v1H3zM0 4h1v1H0zM4 4h1v1H4z" fill="#ffffff"/>
                </svg>
              </button>
            </div>
            <button type="submit" class="win80-btn win80-btn-primary px-4">
              GO
            </button>
          </div>

          <!-- Safe Debounced Predictive Dropdown -->
          <div
            id="search-suggestions"
            class="dropdown-panel hidden absolute left-0 right-0 mt-1 z-[800] max-h-72 overflow-y-auto divide-y divide-[var(--win-muted)]"
          ></div>
        </form>
      </div>
    </section>

    <!-- ==========================================
         WINDOW 2: CLOCK (WITH SECONDS)
         ========================================== -->
    <section
      id="win-clock"
      class="win80-window workspace-window absolute"
      style="left: 672px; top: 24px; width: 312px; z-index: 19;"
    >
      <div class="win80-titlebar" data-drag-handle="win-clock">
        <span>CLOCK</span>
        <div class="titlebar-lines"></div>
      </div>

      <div class="p-4 text-center space-y-1">

        <button

    <!-- ==========================================
         WINDOW 3: QUICKLINKS & GROUPS

      <div class="win80-titlebar" data-drag-handle="win-quicklinks">

          <button id="cancel-new-group-btn" type="button" class="win80-close-btn">

      <!-- Bottom Status & Resize Grip Bar -->

        <div
          id="quicklinks-resize-grip"
          class="win80-resize-grip"
        >
          <svg width="12" height="12" viewBox="0 0 6 6" shape-rendering="crispEdges" aria-hidden="true">
            <path d="M5 1h1v1H5zM3 3h1v1H3zM5 3h1v1H5zM1 5h1v1H1zM3 5h1v1H3zM5 5h1v1H5z" fill="currentColor"/>
          </svg>

    </section>

    <!-- ==========================================
         WINDOW 4: WEATHER
         ========================================== -->
    <section
      id="win-weather"
      class="win80-window workspace-window absolute"
      style="left: 672px; top: 168px; width: 312px; z-index: 17;"
    >
      <div class="win80-titlebar" data-drag-handle="win-weather">
        <span>WEATHER</span>
        <div class="titlebar-lines"></div>
        <div class="flex items-center gap-1.5">
          <button
            id="weather-refresh-btn"
            type="button"
            class="win80-icon-btn"
          >
            ↻
          </button>
          <button
            type="button"
            data-hide-win="win-weather"
            class="win80-close-btn"

      const DEFAULT_WINDOW_LAYOUT = {

      const DEFAULT_STATE = {

        },

      const CAL_MARKER_TYPES = {
        urgent: { code: 'urgent', symbol: '!', label: 'Urgent', color: '#dc2626', lightBg: '#f8b4b4' },
        event: { code: 'event', symbol: '*', label: 'Event', color: '#2563eb', lightBg: '#93c5fd' },
        goal: { code: 'goal', symbol: '$', label: 'Goal / Pay', color: '#059669', lightBg: '#86efac' },

      };

      const GROUP_COLOR_PRESETS = {
        default: { label: 'Default', swatch: '#8a94a6', bg: '', border: '' },
        blue:    { label: 'Cobalt',  swatch: '#3b82f6', bg: 'rgba(59, 130, 246, 0.14)', border: '#2e6fd9' },
        teal:    { label: 'Teal',    swatch: '#14b8a6', bg: 'rgba(20, 184, 166, 0.14)', border: '#118f80' },
        green:   { label: 'Phosphor',swatch: '#22c55e', bg: 'rgba(34, 197, 94, 0.14)',  border: '#1b9e4b' },
        amber:   { label: 'Amber',   swatch: '#f59e0b', bg: 'rgba(245, 158, 11, 0.16)', border: '#c97a10' },
        red:     { label: 'Crimson', swatch: '#ef4444', bg: 'rgba(239, 68, 68, 0.14)',  border: '#c93434' },
        purple:  { label: 'Magenta', swatch: '#a855f7', bg: 'rgba(168, 85, 247, 0.14)', border: '#873dd1' }
      };

      let draggedQuicklinkId = null;
      let draggedGroupName = null;

      function moveGroupByOffset(groupName, offset) {
        const idx = state.groups.findIndex(g => g.toLowerCase() === groupName.toLowerCase());
        if (idx === -1) return;
        const targetIdx = idx + offset;
        if (targetIdx < 0 || targetIdx >= state.groups.length) return;
        const [moved] = state.groups.splice(idx, 1);
        state.groups.splice(targetIdx, 0, moved);
        saveState('GROUP REORDERED ✓');
        renderQuicklinks();
      }

      function reorderGroupByDrop(sourceGroup, targetGroup) {
        if (!sourceGroup || !targetGroup || sourceGroup.toLowerCase() === targetGroup.toLowerCase()) return;
        const fromIdx = state.groups.findIndex(g => g.toLowerCase() === sourceGroup.toLowerCase());
        const toIdx = state.groups.findIndex(g => g.toLowerCase() === targetGroup.toLowerCase());
        if (fromIdx === -1 || toIdx === -1) return;
        const [moved] = state.groups.splice(fromIdx, 1);
        state.groups.splice(toIdx, 0, moved);
        saveState('GROUP REORDERED ✓');
        renderQuicklinks();
      }

      function formatDateKey(dateObj) {
        const y = dateObj.getFullYear();
        const m = String(dateObj.getMonth() + 1).padStart(2, '0');
        const d = String(dateObj.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      }

      let state = loadState();
      let editLinksMode = false;
      let renamingGroupName = null;
      let topZIndex = 30;
      let popupZIndex = 1000;
      let activeWindowEl = document.getElementById('win-search');
      let deferredSaveTimer = null;
      let resizeClampTimer = null;
      let calendarViewDate = new Date();
      let selectedCalDateKey = formatDateKey(new Date());
      let activeCalMarkerType = 'urgent';
      let calcExpr = '0';

      function normalizeStickyNotes(notes) {
        if (!Array.isArray(notes) || notes.length === 0) {
          return JSON.parse(JSON.stringify(DEFAULT_STATE.stickyNotes));
        }
        const num = notes.map((n, idx) => ({
          id: n.id || 'sticky_' + (Date.now() + idx),
          text: typeof n.text === 'string' ? n.text : '',
          left: Number.isFinite(n.left) ? n.left : 24 + (idx * 48) % 240,
          top: Number.isFinite(n.top) ? n.top : 432 + (idx * 24) % 144,
          zIndex: Number.isFinite(n.zIndex) ? n.zIndex : 21 + idx
        }));
        return num;
      }

      function normalizeWorkspaceZIndices(windowPositions, stickyNotes) {
        const entries = [];
        Object.entries(windowPositions || {}).forEach(([id, pos]) => {
          if (!id.startsWith('popup-') && pos && typeof pos === 'object') {
            entries.push({ type: 'win', ref: pos, z: Number(pos.zIndex) || 20 });
          }
        });
        (stickyNotes || []).forEach((note) => {
          if (note && typeof note === 'object') {
            entries.push({ type: 'sticky', ref: note, z: Number(note.zIndex) || 21 });
          }
        });
        entries.sort((a, b) => a.z - b.z);
        entries.forEach((entry, idx) => {
          entry.ref.zIndex = 15 + idx;
        });
      }

      function normalizeGroups(groups, quicklinks) {
        const list = [];
        if (Array.isArray(groups)) {
          groups.forEach(g => {
            const clean = String(g || '').trim();
            if (clean && !list.some(x => x.toLowerCase() === clean.toLowerCase())) {
              list.push(clean);
            }
          });
        }
        if (Array.isArray(quicklinks)) {
          quicklinks.forEach(item => {
            const cat = String(item.category || '').trim();
            if (cat && !list.some(x => x.toLowerCase() === cat.toLowerCase())) {
              list.push(cat);
            }
          });
        }
        return list;
      }

      function loadState() {
        try {
          let raw = localStorage.getItem(STORAGE_KEY);
          if (!raw && window.name && window.name.startsWith('WIN87_STATE:')) {
            raw = window.name.slice('WIN87_STATE:'.length);
          }
          if (!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));

          const parsed = JSON.parse(raw);
          const quicklinks = Array.isArray(parsed.quicklinks) ? parsed.quicklinks : [];
          const stickyNotes = normalizeStickyNotes(parsed.stickyNotes);
          const windowPositions = {
            ...JSON.parse(JSON.stringify(DEFAULT_WINDOW_LAYOUT)),
            ...(parsed.windowPositions || {})
          };
          normalizeWorkspaceZIndices(windowPositions, stickyNotes);
          const hasExplicitGroupsArray = Array.isArray(parsed.groups);

          return {
            ...JSON.parse(JSON.stringify(DEFAULT_STATE)),
            ...parsed,
            groups: hasExplicitGroupsArray
              ? normalizeGroups(parsed.groups, quicklinks)
              : DEFAULT_STATE.groups.slice(),
            quicklinksSize: {
              ...DEFAULT_STATE.quicklinksSize,
              ...(parsed.quicklinksSize || {})
            },
            groupColors:
              parsed.groupColors && typeof parsed.groupColors === 'object'
                ? parsed.groupColors
                : {},
            collapsedGroups:
              parsed.collapsedGroups && typeof parsed.collapsedGroups === 'object'
                ? parsed.collapsedGroups
                : {},
            shadedWindows:
              parsed.shadedWindows && typeof parsed.shadedWindows === 'object'
                ? parsed.shadedWindows
                : {},
            quicklinks,
            searchHistory: Array.isArray(parsed.searchHistory)
              ? parsed.searchHistory.filter(x => typeof x === 'string' && x.trim()).slice(0, 30)
              : [],
            weather: {
              ...DEFAULT_STATE.weather,
              ...(parsed.weather || {})
            },
            stickyNotes,
            calendarMarkers:
              parsed.calendarMarkers && typeof parsed.calendarMarkers === 'object'
                ? parsed.calendarMarkers
                : {},
            visibleWindows: {
              ...DEFAULT_STATE.visibleWindows,
              ...(parsed.visibleWindows || {})
            },
            windowPositions
          };
        } catch {
          return JSON.parse(JSON.stringify(DEFAULT_STATE));
        }
      }

      function saveState() {
        try {
          state.groups = normalizeGroups(state.groups, state.quicklinks);
          const serialized = JSON.stringify(state);
          try {
            localStorage.setItem(STORAGE_KEY, serialized);
          } catch {
            try {
              window.name = 'WIN87_STATE:' + serialized;
            } catch {}
          }
        } catch {}
      }

      function saveStateDebounced() {
        if (deferredSaveTimer) clearTimeout(deferredSaveTimer);
        deferredSaveTimer = setTimeout(() => saveState(), 180);
      }

      function applyPreferencesToDOM() {
        if (state.theme === 'classic') {
          document.documentElement.removeAttribute('data-theme');
        } else {
          document.documentElement.setAttribute('data-theme', state.theme);
        }

        const validFonts = ['dos-vga', 'pixel-sans', 'pixel-sans-bold', 'courier-bios'];
        const chosenFont = validFonts.includes(state.fontStyle) ? state.fontStyle : 'dos-vga';
        document.documentElement.setAttribute('data-font', chosenFont);

        const step = Number(state.gridSize) || 24;
        document.documentElement.style.setProperty('--grid-size', `${step}px`);
