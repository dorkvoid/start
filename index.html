<!DOCTYPE html>
<html lang="en" data-font="dos-vga">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Tab</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* True 1980s IBM PC DOS VGA 437 (8x16) & Pixelated Bitmap Fonts (Zero Google Fonts, Not VT323) */
    @font-face {
      font-family: 'Perfect_DOS_VGA';
      src:
        url('https://cdn.jsdelivr.net/npm/tuicss@2.1.2/dist/fonts/Perfect%20DOS%20VGA%20437%20Win.ttf') format('truetype'),
        url('https://cdn.jsdelivr.net/npm/tuicss@2.1.2/dist/fonts/Perfect%20DOS%20VGA%20437.ttf') format('truetype'),
        url('https://cdn.jsdelivr.net/gh/kaixinol/linux-bsod/Web437_IBM_VGA_8x16.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Pixel_MS_Sans';
      src:
        url('https://cdn.jsdelivr.net/npm/98.css@0.1.20/dist/ms_sans_serif.woff2') format('woff2'),
        url('https://cdn.jsdelivr.net/npm/98.css@0.1.20/dist/ms_sans_serif.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Fixedsys_87';
      src: url('https://cdn.jsdelivr.net/gh/okaeli/fixedsys-web@master/FSEX300.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      /* 1987 Windows Executive Teal & Cream */
      --bg-desktop: #2d5a68;
      --bg-pattern: rgba(0, 0, 0, 0.18);
      --win-bg: #f3f2ed;
      --win-surface: #ffffff;
      --win-muted: #e4e2da;
      --win-border: #111418;
      --win-shadow: rgba(0, 0, 0, 0.45);
      --title-active-bg: #002855;
      --title-active-text: #ffffff;
      --title-inactive-bg: #6e7780;
      --title-inactive-text: #f3f2ed;
      --text-primary: #111418;
      --text-secondary: #4a525d;
      --accent: #0047ab;
      --accent-soft: #dce8fa;
      --font-main: 'Perfect_DOS_VGA', 'Fixedsys_87', 'Fixedsys', 'Terminal', monospace;

      /* Theme-adaptive yellow sticky palette (Classic Canary Yellow) */
      --sticky-bg: #fff475;
      --sticky-header: #f5e050;
      --sticky-rule: #c7b122;
      --sticky-border: #111418;
      --sticky-text: #111418;
      --sticky-placeholder: #6b5e12;
      --sticky-btn-bg: #fff9a6;
      --sticky-btn-hover: #ffffff;
    }

    [data-font="dos-vga"] {
      --font-main: 'Perfect_DOS_VGA', 'Fixedsys_87', 'Fixedsys', 'Terminal', monospace;
    }

    [data-font="pixel-sans"] {
      --font-main: 'Pixel_MS_Sans', 'Perfect_DOS_VGA', 'Fixedsys', monospace;
    }

    [data-font="fixedsys"] {
      --font-main: 'Fixedsys_87', 'Perfect_DOS_VGA', 'Fixedsys', monospace;
    }

    [data-theme="ega-dark"] {
      --bg-desktop: #101520;
      --bg-pattern: rgba(255, 255, 255, 0.08);
      --win-bg: #1b2232;
      --win-surface: #232c40;
      --win-muted: #141a26;
      --win-border: #64748b;
      --win-shadow: rgba(0, 0, 0, 0.7);
      --title-active-bg: #005f87;
      --title-active-text: #ffffff;
      --title-inactive-bg: #2a3449;
      --title-inactive-text: #94a3b8;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --accent: #38bdf8;
      --accent-soft: #1e3a5f;

      /* EGA Dark: Warm EGA Ochre/Mustard Yellow */
      --sticky-bg: #d9b83c;
      --sticky-header: #c4a32b;
      --sticky-rule: #8f7414;
      --sticky-border: #64748b;
      --sticky-text: #101520;
      --sticky-placeholder: #4f410b;
      --sticky-btn-bg: #ebd060;
      --sticky-btn-hover: #f7e282;
    }

    [data-theme="dos-classic"] {
      --bg-desktop: #000000;
      --bg-pattern: rgba(0, 255, 102, 0.14);
      --win-bg: #080c09;
      --win-surface: #0d140f;
      --win-muted: #050806;
      --win-border: #00e65c;
      --win-shadow: rgba(0, 230, 92, 0.22);
      --title-active-bg: #00e65c;
      --title-active-text: #000000;
      --title-inactive-bg: #0f2919;
      --title-inactive-text: #00e65c;
      --text-primary: #00ff66;
      --text-secondary: #00b347;
      --accent: #00ff66;
      --accent-soft: #0f2e1b;

      /* MS-DOS Green: Phosphor Chartreuse-Yellow */
      --sticky-bg: #c8d632;
      --sticky-header: #b3c221;
      --sticky-rule: #78820f;
      --sticky-border: #00e65c;
      --sticky-text: #080c09;
      --sticky-placeholder: #464d09;
      --sticky-btn-bg: #dce856;
      --sticky-btn-hover: #eef77e;
    }

    [data-theme="amber-crt"] {
      --bg-desktop: #140f07;
      --bg-pattern: rgba(255, 176, 0, 0.12);
      --win-bg: #1f170b;
      --win-surface: #291f10;
      --win-muted: #161007;
      --win-border: #ffb000;
      --win-shadow: rgba(0, 0, 0, 0.8);
      --title-active-bg: #ffb000;
      --title-active-text: #140f07;
      --title-inactive-bg: #3d2e17;
      --title-inactive-text: #ffb000;
      --text-primary: #ffc13b;
      --text-secondary: #c48b1b;
      --accent: #ffb000;
      --accent-soft: #3d2c0e;

      /* Amber CRT: Golden Amber-Yellow */
      --sticky-bg: #e6ac27;
      --sticky-header: #cf9615;
      --sticky-rule: #8f6406;
      --sticky-border: #ffb000;
      --sticky-text: #140f07;
      --sticky-placeholder: #593e04;
      --sticky-btn-bg: #f5c249;
      --sticky-btn-hover: #ffd46b;
    }

    /* Force strict 1-bit pixelation: no anti-aliasing and no synthetic bold smearing */
    * {
      box-sizing: border-box;
      font-family: var(--font-main);
      font-synthesis: none;
      -webkit-font-smoothing: none;
      -moz-osx-font-smoothing: unset;
      font-smooth: never;
      text-rendering: optimizeSpeed;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-size: 16px;
      line-height: 1.25;
      background-color: var(--bg-desktop);
      color: var(--text-primary);
      overflow-x: hidden;
      user-select: none;
    }

    /* Alignment grid dots when Grid Snap is active */
    #desktop-canvas.snap-grid-overlay {
      background-image: radial-gradient(var(--bg-pattern) 2px, transparent 0);
      background-size: var(--grid-size, 24px) var(--grid-size, 24px);
    }

    /* Dashed preview box while dragging a window */
    #grid-snap-ghost {
      position: absolute;
      border: 2px dashed var(--accent);
      background-color: var(--accent-soft);
      opacity: 0.45;
      pointer-events: none;
      z-index: 10;
    }

    /* Clean 1980s Window Frame */
    .win80-window {
      background-color: var(--win-bg);
      border: 2px solid var(--win-border);
      box-shadow: 4px 4px 0px var(--win-shadow);
      display: flex;
      flex-direction: column;
      contain: layout style;
    }

    .win80-window.is-dragging,
    .sticky-widget.is-dragging {
      will-change: transform;
      user-select: none;
    }

    .win80-titlebar {
      background-color: var(--title-inactive-bg);
      color: var(--title-inactive-text);
      border-bottom: 2px solid var(--win-border);
      padding: 6px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: grab;
      font-size: 16px;
      line-height: 1;
      touch-action: none;
    }

    .win80-window.is-active .win80-titlebar {
      background-color: var(--title-active-bg);
      color: var(--title-active-text);
    }

    .win80-titlebar:active {
      cursor: grabbing;
    }

    .titlebar-lines {
      flex: 1;
      height: 8px;
      margin: 0 10px;
      opacity: 0.4;
      background: repeating-linear-gradient(
        to bottom,
        currentColor,
        currentColor 1px,
        transparent 1px,
        transparent 3px
      );
    }

    .win80-btn {
      background-color: var(--win-surface);
      color: var(--text-primary);
      border: 2px solid var(--win-border);
      box-shadow: 2px 2px 0px var(--win-border);
      font-size: 16px;
      line-height: 1;
      padding: 6px 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .win80-btn:hover {
      background-color: var(--accent-soft);
    }

    .win80-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px var(--win-border);
    }

    .win80-btn-primary {
      background-color: var(--accent);
      color: #ffffff;
    }

    [data-theme="dos-classic"] .win80-btn-primary,
    [data-theme="amber-crt"] .win80-btn-primary,
    [data-theme="ega-dark"] .win80-btn-primary {
      color: #000000;
    }

    .win80-input {
      background-color: var(--win-surface);
      color: var(--text-primary);
      border: 2px solid var(--win-border);
      padding: 8px 10px;
      font-size: 16px;
      line-height: 1.2;
      outline: none;
      user-select: text;
    }

    .win80-input:focus {
      box-shadow: inset 0 0 0 2px var(--accent);
    }

    /* Quicklink Tile & + Button Tile */
    .quicklink-tile {
      background-color: var(--win-surface);
      border: 2px solid var(--win-border);
      box-shadow: 2px 2px 0px var(--win-border);
      font-size: 16px;
    }

    .quicklink-tile:hover {
      background-color: var(--accent-soft);
    }

    .quicklink-add-tile {
      background-color: var(--win-muted);
      border: 2px dashed var(--win-border);
      font-size: 16px;
    }

    .quicklink-add-tile:hover {
      background-color: var(--accent-soft);
      border-style: solid;
    }

    .group-box {
      background-color: var(--win-muted);
      border: 2px solid var(--win-border);
      padding: 10px;
    }

    .top-menubar {
      background-color: var(--win-bg);
      border-bottom: 2px solid var(--win-border);
    }

    .dropdown-panel {
      background-color: var(--win-bg);
      border: 2px solid var(--win-border);
      box-shadow: 4px 4px 0px var(--win-shadow);
    }

    .suggestion-row.is-highlighted {
      background-color: var(--accent-soft);
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    /**/
    /* Theme-Adaptive Yellow Sticky Widget */
    .sticky-widget {
      background-color: var(--sticky-bg);
      color: var(--sticky-text);
      border: 2px solid var(--sticky-border);
      box-shadow: 4px 4px 0px var(--win-shadow);
      display: flex;
      flex-direction: column;
      width: min(240px, calc(100vw - 48px));
      min-height: 216px;
      contain: layout style;
    }

    .sticky-widget.is-active {
      box-shadow: 6px 6px 0px var(--win-shadow);
    }

    .sticky-pinbar {
      background-color: var(--sticky-header);
      border-bottom: 2px dashed var(--sticky-rule);
      padding: 6px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: grab;
      color: var(--sticky-text);
      touch-action: none;
    }

    .sticky-pinbar:active {
      cursor: grabbing;
    }

    .sticky-note-btn {
      width: 22px;
      height: 22px;
      background-color: var(--sticky-btn-bg);
      color: var(--sticky-text);
      border: 2px solid var(--sticky-border);
      box-shadow: 1px 1px 0px var(--sticky-border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      line-height: 1;
    }

    .sticky-note-btn:hover {
      background-color: var(--sticky-btn-hover);
    }

    .sticky-note-btn:active {
      transform: translate(1px, 1px);
      box-shadow: none;
    }

    .sticky-paper-input {
      background: transparent;
      color: var(--sticky-text);
      border: none;
      outline: none;
      resize: none;
      width: 100%;
      flex: 1;
      min-height: 172px;
      padding: 10px;
      font-size: 16px;
      line-height: 1.25;
      user-select: text;
    }

    .sticky-paper-input::placeholder {
      color: var(--sticky-placeholder);
    }

    /* Interactive Calendar Day Cells & Full-Box Light Marker Fills */
    .cal-cell {
      position: relative;
      min-height: 28px;
      padding: 2px;
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      line-height: 1;
      background-color: transparent;
      color: var(--text-primary);
    }

    .cal-cell:hover {
      background-color: var(--accent-soft);
      border-color: var(--win-border);
    }

    .cal-cell.is-today {
      background-color: var(--accent);
      color: #ffffff;
    }

    [data-theme="dos-classic"] .cal-cell.is-today,
    [data-theme="amber-crt"] .cal-cell.is-today,
    [data-theme="ega-dark"] .cal-cell.is-today {
      color: #000000;
    }

    .cal-cell.has-marker {
      color: #111418 !important;
      border-color: var(--win-border);
    }

    .cal-cell.is-selected {
      outline: 2px solid var(--win-border);
      outline-offset: -2px;
      background-color: var(--accent-soft);
    }

    .cal-cell.is-today.is-selected {
      background-color: var(--accent);
      outline: 2px dashed #ffffff;
    }

    .marker-stamp-btn {
      border: 2px solid var(--win-border);
      background-color: var(--win-surface);
      padding: 3px 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      line-height: 1;
    }

    .marker-stamp-btn:hover,
    .marker-stamp-btn.is-selected {
      background-color: var(--accent-soft);
      box-shadow: inset 0 0 0 1px var(--accent);
    }

    /* Rolled-up / Shaded Window State */
    .win80-window.is-shaded > :not(.win80-titlebar) {
      display: none !important;
    }

    .win80-window.is-shaded .win80-titlebar {
      border-bottom: none;
    }

    /* Uniform Red X Close / Delete Button */
    .win80-close-btn {
      width: 22px;
      height: 22px;
      background-color: #dc2626;
      color: #ffffff;
      border: 2px solid #111418;
      box-shadow: 1px 1px 0px #111418;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
    }

    .win80-close-btn:hover {
      background-color: #ef4444;
    }

    .win80-close-btn:active {
      transform: translate(1px, 1px);
      box-shadow: none;
    }

    /* Uniform Small Square Action Button */
    .win80-icon-btn {
      width: 22px;
      height: 22px;
      background-color: var(--win-surface);
      color: var(--text-primary);
      border: 2px solid var(--win-border);
      box-shadow: 1px 1px 0px var(--win-border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
      line-height: 1;
    }

    .win80-icon-btn:hover {
      background-color: var(--accent-soft);
    }

    .win80-icon-btn:active {
      transform: translate(1px, 1px);
      box-shadow: none;
    }

    @media (max-width: 900px) {
      .workspace-window {
        position: relative !important;
        left: auto !important;
        top: auto !important;
        width: 100% !important;
        margin-bottom: 16px;
        transform: none !important;
      }
    }
  </style>
</head>

<body class="flex flex-col min-h-screen">

  <!-- SIMPLE TOP MENU BAR (No Bottom Taskbar) -->
  <header class="top-menubar sticky top-0 z-[500] px-4 py-2 flex flex-wrap items-center justify-between gap-2">
    <div class="flex flex-wrap items-center gap-2">
      <!-- Settings Dropdown Container -->
      <div class="relative" id="settings-menu-container">
        <button id="settings-dropdown-btn" type="button" class="win80-btn">
          <span>Settings ▾</span>
        </button>

        <!-- Clean Dropdown Menu -->
        <div
          id="settings-dropdown-panel"
          class="dropdown-panel hidden absolute left-0 mt-2 w-80 p-4 z-[600] space-y-3"
        >
          <div class="border-b-2 border-[var(--win-border)] pb-1">
            PREFERENCES
          </div>

          <!-- Color Theme -->
          <div>
            <label for="quick-theme-select" class="block mb-1 text-[var(--text-secondary)]">
              Color Theme
            </label>
            <select id="quick-theme-select" class="win80-input w-full py-1.5 px-2">
              <option value="classic">1987 Windows Teal</option>
              <option value="ega-dark">IBM EGA Dark</option>
              <option value="dos-classic">MS-DOS Classic Green</option>
              <option value="amber-crt">Amber CRT</option>
            </select>
          </div>

          <!-- Pixel Font Style -->
          <div>
            <label for="quick-font-select" class="block mb-1 text-[var(--text-secondary)]">
              Pixel Font
            </label>
            <select id="quick-font-select" class="win80-input w-full py-1.5 px-2">
              <option value="dos-vga">IBM PC DOS VGA (8x16)</option>
              <option value="pixel-sans">MS Sans Serif (Pixel)</option>
              <option value="fixedsys">Fixedsys 87</option>
            </select>
          </div>

          <!-- Search Engine -->
          <div>
            <label for="quick-engine-select" class="block mb-1 text-[var(--text-secondary)]">
              Search Engine (or Tab in Search)
            </label>
            <select id="quick-engine-select" class="win80-input w-full py-1.5 px-2">
              <option value="ddg">DuckDuckGo</option>
              <option value="google">Google</option>
              <option value="brave">Brave Search</option>
              <option value="startpage">Startpage</option>
              <option value="wikipedia">Wikipedia</option>
            </select>
          </div>

          <!-- Weather Settings -->
          <div class="pt-2 border-t-2 border-[var(--win-border)] space-y-2">
            <label class="block text-[var(--text-secondary)]">
              Weather Location &amp; Unit
            </label>
            <div class="flex gap-1.5">
              <input
                id="weather-city-input"
                type="text"
                placeholder="City (e.g. Chicago)"
                class="win80-input flex-1 py-1 px-2"
              />
              <button id="weather-city-save-btn" type="button" class="win80-btn win80-btn-primary py-1 px-2.5">
                Set
              </button>
            </div>
            <div class="flex items-center justify-between">
              <span>Temperature Unit</span>
              <select id="weather-unit-select" class="win80-input py-1 px-2">
                <option value="fahrenheit">Fahrenheit (°F)</option>
                <option value="celsius">Celsius (°C)</option>
              </select>
            </div>
          </div>

          <!-- Checkboxes -->
          <div class="space-y-2 pt-2 border-t-2 border-[var(--win-border)]">
            <label class="flex items-center justify-between cursor-pointer">
              <span>Snap Windows to Grid</span>
              <input type="checkbox" id="toggle-snap-grid" class="w-4 h-4 accent-[var(--accent)]" />
            </label>
            <label class="flex items-center justify-between cursor-pointer">
              <span>24-Hour Clock</span>
              <input type="checkbox" id="toggle-24h" class="w-4 h-4 accent-[var(--accent)]" />
            </label>
            <label class="flex items-center justify-between cursor-pointer">
              <span>Open Links in New Tab</span>
              <input type="checkbox" id="toggle-newtab" class="w-4 h-4 accent-[var(--accent)]" />
            </label>
            <label class="flex items-center justify-between cursor-pointer">
              <span>Show Site Icons (Favicons)</span>
              <input type="checkbox" id="toggle-favicons" class="w-4 h-4 accent-[var(--accent)]" />
            </label>
            <label class="flex items-center justify-between cursor-pointer">
              <span>Press [/] to Focus Search</span>
              <input type="checkbox" id="toggle-slash-search" class="w-4 h-4 accent-[var(--accent)]" />
            </label>
            <label class="flex items-center justify-between cursor-pointer">
              <span>Keys [1-9] Launch Links</span>
              <input type="checkbox" id="toggle-num-hotkeys" class="w-4 h-4 accent-[var(--accent)]" />
            </label>
          </div>

          <div class="pt-2 border-t-2 border-[var(--win-border)] grid grid-cols-2 gap-2">
            <button id="reset-layout-btn" type="button" class="win80-btn">
              Reset Layout
            </button>
            <button id="open-backup-win-btn" type="button" class="win80-btn win80-btn-primary">
              Import / JSON
            </button>
          </div>
        </div>
      </div>

      <!-- Simple Grid Toggle Button -->
      <button
        id="topbar-grid-toggle-btn"
        type="button"
        class="win80-btn"
        title="Toggle uniform grid snapping when moving windows"
      >
        Grid: ON
      </button>

      <!-- Quick Window Toggles -->
      <div class="flex flex-wrap items-center gap-1.5 pl-1 border-l-2 border-[var(--win-border)]">
        <button type="button" data-toggle-win="win-weather" class="win80-btn">Weather</button>
        <button type="button" data-toggle-win="win-calendar" class="win80-btn">Calendar</button>
        <button type="button" data-toggle-win="win-calc" class="win80-btn">Calc</button>
        <button type="button" data-toggle-win="win-sticky" class="win80-btn">Sticky</button>
        <button
          id="topbar-add-sticky-btn"
          type="button"
          class="win80-btn"
          title="Pin a new yellow Sticky widget to the screen"
        >
          + Sticky
        </button>
      </div>
    </div>

    <!-- Simple Save Status -->
    <div id="save-status-text" class="text-[var(--text-secondary)]">
      SAVED ✓
    </div>
  </header>

  <!-- DESKTOP WORKSPACE -->
  <main id="desktop-canvas" class="relative flex-1 w-full overflow-hidden p-6 min-h-[calc(100vh-52px)]">

    <!-- Snap Ghost Preview when dragging -->
    <div id="grid-snap-ghost" class="hidden"></div>

    <!-- ==========================================
         WINDOW 1: SEARCH
         ========================================== -->
    <section
      id="win-search"

        quicklinks: [],
        weather: {

        },

          'win-weather': true,

      function formatDateKey(dateObj) {
        const y = dateObj.getFullYear();
        const m = String(dateObj.getMonth() + 1).padStart(2, '0');
        const d = String(dateObj.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      }

      let state = loadState();
      let editLinksMode = false;
      let renamingGroupName = null;
      let topZIndex = 30;
      let activeWindowEl = document.getElementById('win-search');
      let saveStatusTimer = null;
      let deferredSaveTimer = null;
      let resizeClampTimer = null;
      let calendarViewDate = new Date();
      let selectedCalDateKey = formatDateKey(new Date());
      let activeCalMarkerType = 'urgent';
      let calcExpr = '0';

      function normalizeStickyNotes(notes) {
        if (!Array.isArray(notes)) {
          return JSON.parse(JSON.stringify(DEFAULT_STATE.stickyNotes));
        }
        return notes.map((n, idx) => ({
          id: n.id || 'sticky_' + (Date.now() + idx),
          text: typeof n.text === 'string' ? n.text : '',
          left: Number.isFinite(n.left) ? n.left : 24 + (idx * 48) % 240,
          top: Number.isFinite(n.top) ? n.top : 432 + (idx * 24) % 144,
          zIndex: Number.isFinite(n.zIndex) ? n.zIndex : 15 + idx
        }));
      }

      function normalizeGroups(groups, quicklinks) {
        const list = [];
        if (Array.isArray(groups)) {
          groups.forEach(g => {
            const clean = String(g || '').trim();
            if (clean && !list.some(x => x.toLowerCase() === clean.toLowerCase())) {
              list.push(clean);
            }
          });
        }
        if (Array.isArray(quicklinks)) {
          quicklinks.forEach(item => {
            const cat = String(item.category || '').trim();
            if (cat && !list.some(x => x.toLowerCase() === cat.toLowerCase())) {
              list.push(cat);
            }
          });
        }
        return list.length ? list : ['General'];
      }

      function loadState() {
        try {
          let raw = localStorage.getItem(STORAGE_KEY);
          if (!raw && window.name && window.name.startsWith('WIN87_STATE:')) {
            raw = window.name.slice('WIN87_STATE:'.length);
          }
          if (!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));

          const parsed = JSON.parse(raw);
          const quicklinks = Array.isArray(parsed.quicklinks) ? parsed.quicklinks : [];
          const stickyNotes = normalizeStickyNotes(parsed.stickyNotes);

          return {
            ...JSON.parse(JSON.stringify(DEFAULT_STATE)),
            ...parsed,
            groups: normalizeGroups(parsed.groups, quicklinks),
            collapsedGroups:
              parsed.collapsedGroups && typeof parsed.collapsedGroups === 'object'
                ? parsed.collapsedGroups
                : {},
            shadedWindows:
              parsed.shadedWindows && typeof parsed.shadedWindows === 'object'
                ? parsed.shadedWindows
                : {},
            quicklinks,
            weather: {
              ...DEFAULT_STATE.weather,
              ...(parsed.weather || {})
            },
            stickyNotes,
            calendarMarkers:
              parsed.calendarMarkers && typeof parsed.calendarMarkers === 'object'
                ? parsed.calendarMarkers
                : {},
            visibleWindows: {
              ...DEFAULT_STATE.visibleWindows,
              ...(parsed.visibleWindows || {})
            },
            windowPositions: {
              ...JSON.parse(JSON.stringify(DEFAULT_WINDOW_LAYOUT)),
              ...(parsed.windowPositions || {})
            }
          };
        } catch {
          return JSON.parse(JSON.stringify(DEFAULT_STATE));
        }
      }

      function saveState(label) {
        try {
          state.groups = normalizeGroups(state.groups, state.quicklinks);
          const serialized = JSON.stringify(state);
          localStorage.setItem(STORAGE_KEY, serialized);
          try {
            window.name = 'WIN87_STATE:' + serialized;
          } catch {}

          const statusEl = document.getElementById('save-status-text');
          if (statusEl) {
            statusEl.textContent = label || 'SAVED ✓';
            if (saveStatusTimer) clearTimeout(saveStatusTimer);
            saveStatusTimer = setTimeout(() => {
              statusEl.textContent = 'SAVED ✓';
            }, 1400);
          }
        } catch {}
      }

      function saveStateDebounced(label) {
        if (deferredSaveTimer) clearTimeout(deferredSaveTimer);
        deferredSaveTimer = setTimeout(() => saveState(label), 180);
      }

      function applyPreferencesToDOM() {
        if (state.theme === 'classic') {
          document.documentElement.removeAttribute('data-theme');
        } else {
          document.documentElement.setAttribute('data-theme', state.theme);
        }

        const validFonts = ['dos-vga', 'pixel-sans', 'fixedsys'];
        const chosenFont = validFonts.includes(state.fontStyle) ? state.fontStyle : 'dos-vga';
        document.documentElement.setAttribute('data-font', chosenFont);

        const step = Number(state.gridSize) || 24;
        document.documentElement.style.setProperty('--grid-size', `${step}px`);

        const canvas = document.getElementById('desktop-canvas');
        if (canvas) {
          canvas.classList.toggle('snap-grid-overlay', !!state.snapToGrid);
        }

        const gridBtn = document.getElementById('topbar-grid-toggle-btn');
        if (gridBtn) {
          gridBtn.textContent = state.snapToGrid ? 'Grid: ON' : 'Grid: OFF';
          gridBtn.classList.toggle('win80-btn-primary', !!state.snapToGrid);
        }

        document.getElementById('quick-theme-select').value = state.theme;
        document.getElementById('quick-font-select').value = chosenFont;
        document.getElementById('quick-engine-select').value = state.searchEngine;
        document.getElementById('toggle-snap-grid').checked = !!state.snapToGrid;
        document.getElementById('toggle-24h').checked = !!state.clock24h;
        document.getElementById('toggle-newtab').checked = !!state.openInNewTab;
        const favToggle = document.getElementById('toggle-favicons');
        if (favToggle) favToggle.checked = !!state.showFavicons;
        const slashToggle = document.getElementById('toggle-slash-search');
        if (slashToggle) slashToggle.checked = state.slashFocusSearch !== false;
        const numHotkeyToggle = document.getElementById('toggle-num-hotkeys');
        if (numHotkeyToggle) numHotkeyToggle.checked = state.numberHotkeys !== false;
        document.getElementById('weather-city-input').value = state.weather?.city || '';
        document.getElementById('weather-unit-select').value = state.weather?.unit || 'fahrenheit';

        Object.entries(state.visibleWindows || {}).forEach(([winId, isVisible]) => {
          if (winId === 'win-sticky') {
            const stickyContainer = document.getElementById('stickies-container');
            if (stickyContainer) stickyContainer.classList.toggle('hidden', !isVisible);
          } else {
            const el = document.getElementById(winId);
            if (el) el.classList.toggle('hidden', !isVisible);
          }
          const btn = document.querySelector(`[data-toggle-win="${winId}"]`);
          if (btn) btn.classList.toggle('win80-btn-primary', !!isVisible);
        });

        // Apply shaded (rolled-up) window states
        document.querySelectorAll('.workspace-window').forEach(winEl => {
          if (winEl.id) {
            winEl.classList.toggle('is-shaded', !!(state.shadedWindows && state.shadedWindows[winEl.id]));
          }
        });

        const engine = SEARCH_ENGINES[state.searchEngine] || SEARCH_ENGINES.ddg;
        document.getElementById('search-engine-badge').textContent = engine.code;
        const slashHint = state.slashFocusSearch !== false ? ', [/] focus' : '';
        document.getElementById('search-input').placeholder = `Search ${engine.name}, type ! / math / URL${slashHint}...`;
      }

      function snapToGridVal(val) {
        const step = Number(state.gridSize) || 24;
        return Math.round(val / step) * step;
      }

      function snapAllWindowsToGrid() {
        document.querySelectorAll('.workspace-window').forEach(winEl => {
          const left = Math.max(24, snapToGridVal(parseInt(winEl.style.left, 10) || 24));
          const top = Math.max(24, snapToGridVal(parseInt(winEl.style.top, 10) || 24));
          winEl.style.left = `${left}px`;
          winEl.style.top = `${top}px`;

          const stickyId = winEl.getAttribute('data-sticky-id');
          if (stickyId) {
            const note = state.stickyNotes.find(n => n.id === stickyId);
            if (note) {
              note.left = left;
              note.top = top;
              note.zIndex = parseInt(winEl.style.zIndex, 10) || 20;
            }
          } else {
            state.windowPositions[winEl.id] = {
              left,
              top,
              zIndex: parseInt(winEl.style.zIndex, 10) || 20
            };
          }
        });
        saveState('ALIGNED ✓');
      }

      function bringWindowToFront(winEl) {
        if (!winEl) return;
        if (activeWindowEl && activeWindowEl !== winEl) {
          activeWindowEl.classList.remove('is-active');
        } else {
          document.querySelectorAll('.win80-window.is-active, .sticky-widget.is-active').forEach(w => {
            if (w !== winEl) w.classList.remove('is-active');
          });
        }
        winEl.classList.add('is-active');
        activeWindowEl = winEl;
        topZIndex += 1;
        const isPopup = winEl.id && winEl.id.startsWith('popup-');
        winEl.style.zIndex = String(isPopup ? 600 + topZIndex : topZIndex);
      }

      function restoreWindowPositions() {
        const maxW = Math.max(24, window.innerWidth - 140);
        const maxH = Math.max(24, window.innerHeight - 80);
        Object.entries(state.windowPositions || {}).forEach(([id, pos]) => {
          const el = document.getElementById(id);
          if (!el || !pos) return;
          const clampedLeft = Math.min(Math.max(8, pos.left), maxW);
          const clampedTop = Math.min(Math.max(8, pos.top), maxH);
          el.style.left = `${clampedLeft}px`;
          el.style.top = `${clampedTop}px`;
          el.style.transform = '';
          if (pos.zIndex) {
            el.style.zIndex = String(pos.zIndex);
            topZIndex = Math.max(topZIndex, Number(pos.zIndex) || 20);
          }
        });
      }

      function attachDragBehavior(targetWin, handle, onSavePosition) {
        const ghost = document.getElementById('grid-snap-ghost');
        let dragging = false;
        let startX = 0;
        let startY = 0;
        let startLeft = 0;
        let startTop = 0;
        let winWidth = 0;
        let winHeight = 0;
        let maxLeft = 0;
        let maxTop = 0;
        let rafId = null;
        let pendingLeft = 0;
        let pendingTop = 0;

        targetWin.addEventListener('pointerdown', () => bringWindowToFront(targetWin), { passive: true });

        // Double-click titlebar to shade/unshade (roll up) standard workspace windows
        if (targetWin.id && targetWin.classList.contains('win80-window') && targetWin.classList.contains('workspace-window')) {
          handle.addEventListener('dblclick', (e) => {
            if (e.target.closest('button')) return;
            if (!state.shadedWindows) state.shadedWindows = {};
            const nextShaded = !targetWin.classList.contains('is-shaded');
            targetWin.classList.toggle('is-shaded', nextShaded);
            state.shadedWindows[targetWin.id] = nextShaded;
            saveState(nextShaded ? 'SHADED ✓' : 'EXPANDED ✓');
          });
        }

        handle.addEventListener('pointerdown', (e) => {
          if (e.button !== undefined && e.button !== 0) return;
          if (e.target.closest('button')) return;
          if (targetWin.classList.contains('workspace-window') && window.innerWidth <= 900) return;

          dragging = true;
          targetWin.classList.add('is-dragging');
          bringWindowToFront(targetWin);
          startX = e.clientX;
          startY = e.clientY;
          startLeft = parseInt(targetWin.style.left, 10) || targetWin.offsetLeft || 0;
          startTop = parseInt(targetWin.style.top, 10) || targetWin.offsetTop || 0;
          winWidth = targetWin.offsetWidth;
          winHeight = targetWin.offsetHeight;
          maxLeft = Math.max(24, window.innerWidth - 120);
          maxTop = Math.max(24, window.innerHeight - 60);
          pendingLeft = startLeft;
          pendingTop = startTop;

          if (ghost && state.snapToGrid && targetWin.classList.contains('workspace-window')) {
            ghost.style.left = '0px';
            ghost.style.top = '0px';
            ghost.style.width = `${winWidth}px`;
            ghost.style.height = `${winHeight}px`;
            ghost.style.transform = `translate3d(${startLeft}px, ${startTop}px, 0)`;
          }

          handle.setPointerCapture(e.pointerId);
        });

        handle.addEventListener('pointermove', (e) => {
          if (!dragging) return;
          let nextLeft = Math.max(8, Math.min(maxLeft, startLeft + (e.clientX - startX)));
          let nextTop = Math.max(8, Math.min(maxTop, startTop + (e.clientY - startY)));

          if (state.snapToGrid && !e.shiftKey) {
            nextLeft = snapToGridVal(nextLeft);
            nextTop = snapToGridVal(nextTop);
          }

          pendingLeft = nextLeft;
          pendingTop = nextTop;

          if (!rafId) {
            rafId = requestAnimationFrame(() => {
              rafId = null;
              if (!dragging) return;
              const dx = pendingLeft - startLeft;
              const dy = pendingTop - startTop;
              targetWin.style.transform = `translate3d(${dx}px, ${dy}px, 0)`;

              if (ghost && state.snapToGrid && targetWin.classList.contains('workspace-window')) {
                ghost.classList.remove('hidden');
                ghost.style.transform = `translate3d(${pendingLeft}px, ${pendingTop}px, 0)`;
              }
            });
          }
        });

        const endDrag = () => {
          if (!dragging) return;
          dragging = false;
          targetWin.classList.remove('is-dragging');
          if (rafId) {
            cancelAnimationFrame(rafId);
            rafId = null;
          }
          targetWin.style.transform = '';
          targetWin.style.left = `${pendingLeft}px`;
          targetWin.style.top = `${pendingTop}px`;
          if (ghost) {
            ghost.classList.add('hidden');
            ghost.style.transform = '';
          }
          const finalZ = parseInt(targetWin.style.zIndex, 10) || 20;
          onSavePosition(pendingLeft, pendingTop, finalZ);
          saveState('SAVED ✓');
        };

        handle.addEventListener('pointerup', endDrag);
        handle.addEventListener('pointercancel', endDrag);
      }

      function initDraggableWindows() {
        document.querySelectorAll('[data-close-win]').forEach(btn => {
          btn.addEventListener('click', () => {
            const el = document.getElementById(btn.getAttribute('data-close-win'));
            if (el) el.classList.add('hidden');
          });
        });

        document.querySelectorAll('[data-drag-handle]').forEach(handle => {
          const targetWin = document.getElementById(handle.getAttribute('data-drag-handle'));
          if (!targetWin) return;
          attachDragBehavior(targetWin, handle, (left, top, zIndex) => {
            state.windowPositions[targetWin.id] = { left, top, zIndex };
          });
        });
      }

      function updateClock() {
        const now = new Date();
        const h24 = now.getHours();
        const mins = String(now.getMinutes()).padStart(2, '0');
        const secs = String(now.getSeconds()).padStart(2, '0');
        const ampmEl = document.getElementById('clock-ampm');

        if (state.clock24h) {
          document.getElementById('clock-hm').textContent = `${String(h24).padStart(2, '0')}:${mins}`;
          ampmEl.textContent = '24H';
        } else {
          const h12 = h24 % 12 || 12;
          document.getElementById('clock-hm').textContent = `${String(h12).padStart(2, '0')}:${mins}`;
          ampmEl.textContent = h24 >= 12 ? 'PM' : 'AM';
        }

        document.getElementById('clock-sec').textContent = `:${secs}`;
        document.getElementById('clock-date').textContent = now
          .toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' })
          .toUpperCase();
      }

      function normalizeUrl(raw) {
        const trimmed = String(raw || '').trim();
        if (!trimmed) return '';
        return /^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(trimmed) ? trimmed : `https://${trimmed}`;
      }

      function deriveDomainTitle(rawUrl) {
        try {
          const u = new URL(normalizeUrl(rawUrl));
          const host = u.hostname.replace(/^www\./i, '');
          const base = host.split('.')[0] || host;
          return base.charAt(0).toUpperCase() + base.slice(1);
        } catch {
          return 'Link';
        }
      }

      function getFaviconUrl(linkUrl) {
        try {
          const u = new URL(linkUrl);
          return `https://www.google.com/s2/favicons?domain=${encodeURIComponent(u.hostname)}&sz=32`;
        } catch {
          return '';
        }
      }

      function moveQuicklink(linkId, delta) {
        const idx = state.quicklinks.findIndex(q => q.id === linkId);
        if (idx === -1) return;
        const current = state.quicklinks[idx];
        const groupName = (current.category || state.groups[0]).toLowerCase();

        const sameGroupIndices = [];
        state.quicklinks.forEach((item, i) => {
          if ((item.category || state.groups[0]).toLowerCase() === groupName) {
            sameGroupIndices.push(i);
          }
        });

        const posInGroup = sameGroupIndices.indexOf(idx);
        const targetPosInGroup = posInGroup + delta;
        if (targetPosInGroup < 0 || targetPosInGroup >= sameGroupIndices.length) return;

        const swapIdx = sameGroupIndices[targetPosInGroup];
        const temp = state.quicklinks[idx];
        state.quicklinks[idx] = state.quicklinks[swapIdx];
        state.quicklinks[swapIdx] = temp;
        saveState('REORDERED ✓');
        renderQuicklinks();
      }

      function renderQuicklinks() {
        const container = document.getElementById('quicklinks-grid');
        const editBtn = document.getElementById('toggle-edit-mode-btn');
        state.groups = normalizeGroups(state.groups, state.quicklinks);

        if (!editLinksMode) {
          renamingGroupName = null;
        }

        editBtn.textContent = editLinksMode ? 'Done' : 'Edit';
        editBtn.classList.toggle('win80-btn-primary', editLinksMode);

        const fragment = document.createDocumentFragment();
        let globalHotkeyIndex = 0;

        state.groups.forEach((groupName) => {
          const groupLinks = state.quicklinks.filter(
            q => (q.category || state.groups[0]).toLowerCase() === groupName.toLowerCase()
          );
          const isCollapsed = !editLinksMode && !!(state.collapsedGroups && state.collapsedGroups[groupName]);

          const box = document.createElement('div');
          box.className = 'group-box space-y-2.5';

          const header = document.createElement('div');
          header.className =
            'flex flex-wrap items-center justify-between gap-2' +
            (isCollapsed ? '' : ' border-b-2 border-[var(--win-border)] pb-1.5');

          if (editLinksMode && renamingGroupName === groupName) {
            const renameForm = document.createElement('form');
            renameForm.className = 'flex items-center gap-1.5 w-full';

            const renameInput = document.createElement('input');
            renameInput.type = 'text';
            renameInput.maxLength = 24;
            renameInput.value = groupName;
            renameInput.className = 'win80-input flex-1 py-0.5 px-2';

            const saveRenameBtn = document.createElement('button');
            saveRenameBtn.type = 'submit';
            saveRenameBtn.className = 'px-2 py-0.5 border border-[var(--win-border)] bg-[var(--accent)] text-white';
            saveRenameBtn.textContent = 'Save';

            const cancelRenameBtn = document.createElement('button');
            cancelRenameBtn.type = 'button';
            cancelRenameBtn.className = 'px-2 py-0.5 border border-[var(--win-border)] bg-[var(--win-surface)]';
            cancelRenameBtn.textContent = 'Cancel';
            cancelRenameBtn.addEventListener('click', () => {
              renamingGroupName = null;
              renderQuicklinks();
            });

            renameForm.addEventListener('submit', (e) => {
              e.preventDefault();
              const nextName = renameInput.value.trim();
              if (!nextName) return;

              const duplicate = state.groups.some(
                g => g.toLowerCase() === nextName.toLowerCase() && g.toLowerCase() !== groupName.toLowerCase()
              );
              if (duplicate) return;

              state.groups = state.groups.map(g => (g === groupName ? nextName : g));
              state.quicklinks.forEach(item => {
                if ((item.category || '').toLowerCase() === groupName.toLowerCase()) {
                  item.category = nextName;
                }
              });

              renamingGroupName = null;
              saveState('GROUP RENAMED ✓');
              renderQuicklinks();
            });

            renameForm.appendChild(renameInput);
            renameForm.appendChild(saveRenameBtn);
            renameForm.appendChild(cancelRenameBtn);
            header.appendChild(renameForm);
            setTimeout(() => {
              renameInput.focus();
              renameInput.select();
            }, 20);
          } else {
            const titleBtn = document.createElement('button');
            titleBtn.type = 'button';
            titleBtn.className = 'flex items-center gap-1.5 text-left hover:underline cursor-pointer';
            titleBtn.title = 'Click to collapse / expand group';
            titleBtn.innerHTML = `<span>${isCollapsed ? '▸' : '▾'}</span><span>${escapeHtml(groupName.toUpperCase())} (${groupLinks.length})</span>`;
            titleBtn.addEventListener('click', () => {
              if (editLinksMode) return;
              if (!state.collapsedGroups) state.collapsedGroups = {};
              state.collapsedGroups[groupName] = !state.collapsedGroups[groupName];
              saveState();
              renderQuicklinks();
            });
            header.appendChild(titleBtn);

            if (editLinksMode) {
              const groupActions = document.createElement('div');
              groupActions.className = 'flex items-center gap-1.5';

              const renameGrpBtn = document.createElement('button');
              renameGrpBtn.type = 'button';
              renameGrpBtn.className = 'px-2 py-0.5 border border-[var(--win-border)] bg-[var(--win-surface)]';
              renameGrpBtn.textContent = 'Rename';
              renameGrpBtn.addEventListener('click', () => {
                renamingGroupName = groupName;
                renderQuicklinks();
              });
              groupActions.appendChild(renameGrpBtn);

              if (state.groups.length > 1) {
                const delGrpBtn = document.createElement('button');
                delGrpBtn.type = 'button';
                delGrpBtn.className = 'px-2 py-0.5 border border-[var(--win-border)] bg-[var(--win-surface)] text-red-700';
                delGrpBtn.textContent = 'Delete Group';
                delGrpBtn.addEventListener('click', () => {
                  state.groups = state.groups.filter(g => g.toLowerCase() !== groupName.toLowerCase());
                  const fallback = state.groups[0] || 'General';
                  state.quicklinks.forEach(item => {
                    if ((item.category || '').toLowerCase() === groupName.toLowerCase()) {
                      item.category = fallback;
                    }
                  });
                  saveState();
                  renderQuicklinks();
                });
                groupActions.appendChild(delGrpBtn);
              }

              header.appendChild(groupActions);
            }
          }

          box.appendChild(header);

          if (!isCollapsed) {
            const grid = document.createElement('div');
            grid.className = 'grid grid-cols-2 sm:grid-cols-3 gap-2.5';

            groupLinks.forEach((item, linkIdx) => {
              globalHotkeyIndex += 1;
              const hotkeyNum = globalHotkeyIndex <= 9 ? globalHotkeyIndex : null;

              const tile = document.createElement('div');
              tile.className = 'quicklink-tile p-2.5 flex items-center justify-between gap-2';

              const a = document.createElement('a');
              a.href = item.url;
              if (state.openInNewTab) {
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
              }
              a.title = hotkeyNum && state.numberHotkeys !== false
                ? `${item.title} (${item.url}) — Press [${hotkeyNum}]`
                : `${item.title} (${item.url})`;
              a.className = 'truncate flex-1 flex items-center gap-2 hover:underline';

              if (state.showFavicons) {
                const favUrl = getFaviconUrl(item.url);
                if (favUrl) {
                  const img = document.createElement('img');
                  img.src = favUrl;
                  img.alt = '';
                  img.loading = 'lazy';

      /* Universal Startpage Quicklinks JSON Extractor */
      function extractQuicklinksFromAnyJSON(parsed) {
        const extractedLinks = [];
        const extractedGroups = [];

        const addGroup = (g) => {
          const clean = String(g || '').trim();
          if (clean && !extractedGroups.some(x => x.toLowerCase() === clean.toLowerCase())) {
            extractedGroups.push(clean);
          }
        };

        const addLinkObj = (rawItem, fallbackGroup) => {
          if (!rawItem || typeof rawItem !== 'object') return;
          const rawUrl =
            rawItem.url ||
            rawItem.href ||
            rawItem.link ||
            rawItem.uri ||
            rawItem.address ||
            (rawItem.display && rawItem.display.url);
          if (!rawUrl || typeof rawUrl !== 'string') return;
          if (rawUrl.startsWith('place:') || rawUrl.startsWith('javascript:')) return;

          const url = normalizeUrl(rawUrl);
          if (!url) return;

          let title =
            rawItem.title ||
            rawItem.name ||
            rawItem.label ||
            (rawItem.display && (rawItem.display.name || rawItem.display.title)) ||
            '';
          title = String(title).trim();
          if (!title) {
            try {
              title = new URL(url).hostname.replace(/^www\./, '');
            } catch {
              title = url;
            }
          }

          const category =
            String(
              rawItem.category ||
              rawItem.group ||
              rawItem.folder ||
              rawItem.section ||
              fallbackGroup ||
              'General'
            ).trim() || 'General';

          addGroup(category);
          extractedLinks.push({
            id: 'ql_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
            title,
            url,
            category
          });
        };

        const walkNode = (node, currentGroup) => {
          if (!node) return;
          if (Array.isArray(node)) {
            node.forEach(item => walkNode(item, currentGroup));
            return;
          }
          if (typeof node === 'object') {
            // Direct link object
            if (node.url || node.href || node.link || node.uri || (node.display && node.display.url)) {
              addLinkObj(node, currentGroup);
            }
            // Group / Folder container with children/links/items/bookmarks
            const groupLabel = node.title || node.name || node.category || node.group || node.header || currentGroup;
            const childArrays = [
              node.quicklinks,
              node.links,
              node.bookmarks,
              node.items,
              node.children,
              node.shortcuts,
              node.tiles
            ];
            let foundChildArray = false;
            childArrays.forEach(arr => {
              if (Array.isArray(arr)) {
                foundChildArray = true;
                walkNode(arr, groupLabel);
              }
            });

            // Object map of { "GroupName": [ ...links ] }
            if (!foundChildArray && !node.url && !node.href && !node.link && !node.uri) {
              Object.entries(node).forEach(([key, val]) => {
                if (
                  key !== 'windowPositions' &&
                  key !== 'visibleWindows' &&
                  key !== 'stickyNotes' &&
                  key !== 'calendarMarkers' &&
                  key !== 'weather' &&
                  Array.isArray(val)
                ) {
                  walkNode(val, key === 'groups' ? currentGroup : key);
                }
              });
            }
          }
        };

        if (parsed && Array.isArray(parsed.groups)) {
          parsed.groups.forEach(g => {
            if (typeof g === 'string') addGroup(g);
            else if (g && typeof g === 'object') {
              if (g.name || g.title) addGroup(g.name || g.title);
              walkNode(g, g.name || g.title || 'General');
            }
          });
        }

        walkNode(parsed, 'General');
        return { links: extractedLinks, groups: extractedGroups };
      }

      function getPixelXSVG() {
        return `
          <svg width="10" height="10" viewBox="0 0 5 5" shape-rendering="crispEdges" aria-hidden="true">
            <path d="M0 0h1v1H0zM4 0h1v1H4zM1 1h1v1H1zM3 1h1v1H3zM2 2h1v1H2zM1 3h1v1H1zM3 3h1v1H3zM0 4h1v1H0zM4 4h1v1H4z" fill="#ffffff"/>
          </svg>
        `;
      }

      function addStickyWidget(referenceNote) {
        if (!state.visibleWindows) state.visibleWindows = {};
        state.visibleWindows['win-sticky'] = true;

        const step = Number(state.gridSize) || 24;
        const count = state.stickyNotes.length;
        const baseLeft = referenceNote
          ? referenceNote.left + step * 2
          : 24 + ((count * step * 2) % 240);
        const baseTop = referenceNote
          ? referenceNote.top + step
          : 432 + ((count * step) % 144);

        const left = Math.min(Math.max(24, snapToGridVal(baseLeft)), Math.max(24, window.innerWidth - 264));
        const top = Math.min(Math.max(24, snapToGridVal(baseTop)), Math.max(24, window.innerHeight - 240));
        topZIndex += 1;

        const newNote = {
          id: 'sticky_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
          text: '',
          left,
          top,
          zIndex: topZIndex
        };

        state.stickyNotes.push(newNote);
        saveState('STICKY ADDED ✓');
        applyPreferencesToDOM();
        renderStickyNotes(newNote.id);
      }

      function renderStickyNotes(focusId) {
        const container = document.getElementById('stickies-container');
        if (!container) return;

        state.stickyNotes = normalizeStickyNotes(state.stickyNotes);
        const fragment = document.createDocumentFragment();
        let widgetToFocus = null;
        let textareaToFocus = null;

        state.stickyNotes.forEach((note) => {
          const widget = document.createElement('section');
          widget.id = `sticky-widget-${note.id}`;
          widget.setAttribute('data-sticky-id', note.id);
          widget.className = 'sticky-widget workspace-window md:absolute';

          const clampedLeft = Math.min(Math.max(8, note.left), Math.max(24, window.innerWidth - 160));
          const clampedTop = Math.min(Math.max(8, note.top), Math.max(24, window.innerHeight - 100));
          widget.style.left = `${clampedLeft}px`;
          widget.style.top = `${clampedTop}px`;
          widget.style.zIndex = String(note.zIndex || 15);
          topZIndex = Math.max(topZIndex, Number(note.zIndex) || 15);

          const pinbar = document.createElement('div');
          pinbar.className = 'sticky-pinbar';
          pinbar.innerHTML = `
            <span class="tracking-wide">STICKY</span>
            <div class="flex items-center gap-1.5">
              <button type="button" class="sticky-note-btn" data-action="add" title="New Sticky">+</button>
              <button type="button" class="win80-close-btn" data-action="delete" title="Remove Sticky">${getPixelXSVG()}</button>
            </div>
          `;

          const textarea = document.createElement('textarea');
          textarea.className = 'sticky-paper-input';
          textarea.placeholder = 'Write a note...';
          textarea.value = note.text || '';

          textarea.addEventListener('input', () => {
            note.text = textarea.value;
            saveStateDebounced('SAVED ✓');
          });

          pinbar.querySelector('[data-action="add"]').addEventListener('click', (e) => {
            e.stopPropagation();
            addStickyWidget(note);
          });

          pinbar.querySelector('[data-action="delete"]').addEventListener('click', (e) => {
            e.stopPropagation();
            state.stickyNotes = state.stickyNotes.filter(n => n.id !== note.id);
            if (state.stickyNotes.length === 0) {
              state.visibleWindows['win-sticky'] = false;
            }
            saveState('STICKY REMOVED ✓');
            applyPreferencesToDOM();
            renderStickyNotes();
          });

          widget.appendChild(pinbar);
          widget.appendChild(textarea);
          fragment.appendChild(widget);

          attachDragBehavior(widget, pinbar, (left, top, zIndex) => {
            note.left = left;
            note.top = top;
            note.zIndex = zIndex;
          });

          if (focusId && note.id === focusId) {
            widgetToFocus = widget;
            textareaToFocus = textarea;
          }
        });

        container.replaceChildren(fragment);

        if (widgetToFocus && textareaToFocus) {
          bringWindowToFront(widgetToFocus);
          setTimeout(() => textareaToFocus.focus(), 20);
        }
      }

      function getMarkersForDate(dateKey) {
        if (!state.calendarMarkers || typeof state.calendarMarkers !== 'object') {
          state.calendarMarkers = {};
        }
        const list = state.calendarMarkers[dateKey];
        return Array.isArray(list) ? list : [];
      }

      function toggleQuickStampOnSelectedDate(typeKey) {
        const meta = CAL_MARKER_TYPES[typeKey] || CAL_MARKER_TYPES.urgent;
        activeCalMarkerType = meta.code;

        const list = getMarkersForDate(selectedCalDateKey);
        const existingQuickIdx = list.findIndex(m => m.type === meta.code && !m.customText);

        if (existingQuickIdx !== -1) {
          list.splice(existingQuickIdx, 1);
        } else {
          list.push({
            id: 'mk_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
            type: meta.code,
            text: meta.label,
            customText: false
          });
        }

        if (list.length > 0) {
          state.calendarMarkers[selectedCalDateKey] = list;
        } else {
          delete state.calendarMarkers[selectedCalDateKey];
        }

        saveState('CALENDAR SAVED ✓');
        renderCalendar();
      }

      function addCustomMarkerToSelectedDate(rawText) {
        const text = String(rawText || '').trim();
        if (!text) return;
        const meta = CAL_MARKER_TYPES[activeCalMarkerType] || CAL_MARKER_TYPES.urgent;
        const list = getMarkersForDate(selectedCalDateKey);

        list.push({
          id: 'mk_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          type: meta.code,
          text,
          customText: true
        });

        state.calendarMarkers[selectedCalDateKey] = list;
        saveState('MARKER ADDED ✓');
        renderCalendar();
      }

      function removeMarkerFromDate(dateKey, markerId) {
        const list = getMarkersForDate(dateKey).filter(m => m.id !== markerId);
        if (list.length > 0) {
          state.calendarMarkers[dateKey] = list;
        } else {
          delete state.calendarMarkers[dateKey];
        }
        saveState('MARKER REMOVED ✓');
        renderCalendar();
      }

      function renderCalendarSelectedDayTray() {
        const dateLabel = document.getElementById('cal-selected-date-label');
        const clearBtn = document.getElementById('cal-clear-day-btn');
        const listEl = document.getElementById('cal-day-markers-list');
        const drawerEl = document.getElementById('cal-markers-drawer');

        if (drawerEl) drawerEl.classList.toggle('hidden', !isOpen);
        if (arrowEl) arrowEl.textContent = isOpen ? '▾' : '▸';

        const [yStr, mStr, dStr] = selectedCalDateKey.split('-');
        const selDateObj = new Date(Number(yStr), Number(mStr) - 1, Number(dStr));
        const todayKey = formatDateKey(new Date());

        const formatted = selDateObj
          .toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
          .toUpperCase();
        const markers = getMarkersForDate(selectedCalDateKey);
        const countBadge = markers.length > 0 ? ` (${markers.length})` : '';
        dateLabel.textContent =
          (selectedCalDateKey === todayKey ? `${formatted} [TODAY]` : formatted) + countBadge;

        // Highlight active marker stamp button
        document.querySelectorAll('[data-marker-stamp]').forEach(btn => {
          const code = btn.getAttribute('data-marker-stamp');

        });

        if (clearBtn) {
          clearBtn.classList.toggle('hidden', markers.length === 0);
        }

        listEl.innerHTML = '';
        if (markers.length === 0) {
          return;
        }

        markers.forEach(item => {
          const meta = CAL_MARKER_TYPES[item.type] || CAL_MARKER_TYPES.urgent;
          const row = document.createElement('div');
          row.className = 'flex items-center justify-between gap-2 px-2 py-1 bg-[var(--win-surface)] border border-[var(--win-border)]';

          const left = document.createElement('div');

          const badge = document.createElement('span');
          badge.className = 'inline-flex items-center justify-center w-4 h-4 border border-black text-black shrink-0';
          badge.style.backgroundColor = meta.lightBg;
          badge.textContent = meta.symbol;

          const textSpan = document.createElement('span');
          textSpan.className = 'truncate';
          textSpan.textContent = item.text || meta.label;

          left.appendChild(badge);

          delBtn.type = 'button';
          delBtn.className = 'win80-close-btn';

          delBtn.addEventListener('click', () => removeMarkerFromDate(selectedCalDateKey, item.id));

          row.appendChild(delBtn);

      function renderCalendar() {
        const grid = document.getElementById('cal-days-grid');
        const label = document.getElementById('cal-month-label');
        if (!grid || !label) return;

        const year = calendarViewDate.getFullYear();
        const month = calendarViewDate.getMonth();
        const todayKey = formatDateKey(new Date());

        label.textContent = calendarViewDate
          .toLocaleDateString('en-US', { month: 'short', year: 'numeric' })
          .toUpperCase();

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        const fragment = document.createDocumentFragment();

        for (let i = 0; i < firstDay; i++) {
          const empty = document.createElement('div');
          empty.className = 'p-1';
          fragment.appendChild(empty);
        }

        for (let d = 1; d <= daysInMonth; d++) {
          const cellDate = new Date(year, month, d);
          const dateKey = formatDateKey(cellDate);
          const isToday = dateKey === todayKey;
          const isSelected = dateKey === selectedCalDateKey;
          const dayMarkers = getMarkersForDate(dateKey);
          const hasMarker = dayMarkers.length > 0;

          const cell = document.createElement('button');
          cell.type = 'button';
          cell.className =
            'cal-cell' +
            (hasMarker ? ' has-marker' : '') +
            (isToday && !hasMarker ? ' is-today' : '') +
            (isSelected ? ' is-selected' : '');

          if (hasMarker) {
            const primaryMeta = CAL_MARKER_TYPES[dayMarkers[0].type] || CAL_MARKER_TYPES.urgent;
            cell.style.backgroundColor = primaryMeta.lightBg;
            if (isToday) {
              cell.style.boxShadow = 'inset 0 0 0 2px var(--accent)';
            }
            cell.title = dayMarkers
              .map(m => `${(CAL_MARKER_TYPES[m.type] || CAL_MARKER_TYPES.urgent).symbol} ${m.text}`)
              .join(' | ');
          } else {
            cell.title = `Select ${dateKey}`;
          }

          const numSpan = document.createElement('span');
          numSpan.textContent = String(d);
          cell.appendChild(numSpan);

          cell.addEventListener('click', () => {
            selectedCalDateKey = dateKey;
            renderCalendar();
          });

          // Double-click any day to immediately stamp/toggle the active marker
          cell.addEventListener('dblclick', () => {
            selectedCalDateKey = dateKey;
            toggleQuickStampOnSelectedDate(activeCalMarkerType);
          });

          fragment.appendChild(cell);
        }

        grid.replaceChildren(fragment);
        renderCalendarSelectedDayTray();
      }
