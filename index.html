        if (canvas) {
          canvas.classList.toggle('snap-grid-overlay', !!state.snapToGrid);
        }

        const gridBtn = document.getElementById('topbar-grid-toggle-btn');
        if (gridBtn) {
          gridBtn.textContent = state.snapToGrid ? 'Grid: ON' : 'Grid: OFF';
          gridBtn.classList.toggle('win80-btn-primary', !!state.snapToGrid);
        }

        document.getElementById('quick-theme-select').value = state.theme;
        document.getElementById('quick-font-select').value = chosenFont;
        document.getElementById('quick-engine-select').value = state.searchEngine;
        document.getElementById('toggle-snap-grid').checked = !!state.snapToGrid;
        document.getElementById('toggle-24h').checked = !!state.clock24h;
        document.getElementById('toggle-newtab').checked = !!state.openInNewTab;
        const favToggle = document.getElementById('toggle-favicons');
        if (favToggle) favToggle.checked = !!state.showFavicons;
        const slashToggle = document.getElementById('toggle-slash-search');
        if (slashToggle) slashToggle.checked = state.slashFocusSearch !== false;
        document.getElementById('weather-city-input').value = state.weather?.city || '';
        document.getElementById('weather-unit-select').value = state.weather?.unit || 'fahrenheit';

        Object.entries(state.visibleWindows || {}).forEach(([winId, isVisible]) => {
          if (winId === 'win-sticky') {
            const stickyContainer = document.getElementById('stickies-container');
            if (stickyContainer) stickyContainer.classList.toggle('hidden', !isVisible);
          } else {
            const el = document.getElementById(winId);
            if (el) el.classList.toggle('hidden', !isVisible);
          }
          const btn = document.querySelector(`[data-toggle-win="${winId}"]`);
          if (btn) btn.classList.toggle('win80-btn-primary', !!isVisible);
        });

        // Apply shaded (rolled-up) window states
        document.querySelectorAll('.workspace-window').forEach(winEl => {
          if (winEl.id) {
            winEl.classList.toggle('is-shaded', !!(state.shadedWindows && state.shadedWindows[winEl.id]));
          }
        });

        // Apply Quicklinks Compact Mode & Saved Window Width/Height
        const qlWin = document.getElementById('win-quicklinks');
        const qlBody = document.getElementById('quicklinks-body');
        const compactBtn = document.getElementById('toggle-compact-links-btn');
        if (qlWin && state.quicklinksSize) {
          const w = Math.max(320, Number(state.quicklinksSize.width) || 624);
          const mh = Math.max(168, Number(state.quicklinksSize.maxHeight) || 456);
          qlWin.style.width = `${w}px`;
          qlWin.style.setProperty('--ql-max-h', `${mh}px`);
        }
        if (qlBody) {
          qlBody.classList.toggle('quicklinks-compact', !!state.compactQuicklinks);
        }
        if (compactBtn) {
          compactBtn.classList.toggle('is-active', !!state.compactQuicklinks);
          compactBtn.textContent = 'Compact';
        }

        const engine = SEARCH_ENGINES[state.searchEngine] || SEARCH_ENGINES.ddg;
        document.getElementById('search-engine-badge').textContent = engine.code;
        const slashHint = state.slashFocusSearch !== false ? ' or press [/]' : '';
        document.getElementById('search-input').placeholder = `Search ${engine.name} or type a URL${slashHint}...`;
      }

      function snapToGridVal(val) {
        const step = Number(state.gridSize) || 24;
        return Math.round(val / step) * step;
      }

      function getContainerMetrics() {
        const canvas = document.getElementById('desktop-canvas');
        const topBarH = canvas ? canvas.offsetTop || 52 : 52;
        const canvasW = canvas ? canvas.clientWidth : window.innerWidth;
        const canvasH = Math.max(
          window.innerHeight - topBarH,
          canvas ? canvas.clientHeight : window.innerHeight - 52
        );
        return {
          winW: window.innerWidth,
          winH: window.innerHeight,
          canvasW,
          canvasH
        };
      }

      function getWindowClampBounds(winEl, cachedMetrics) {
        const isFixedPopup = winEl.classList.contains('fixed') || (winEl.id && winEl.id.startsWith('popup-'));
        const margin = 8;
        const m = cachedMetrics || getContainerMetrics();

        const containerW = isFixedPopup ? m.winW : m.canvasW;
        const containerH = isFixedPopup ? m.winH : m.canvasH;

        const elW = winEl.offsetWidth || 260;
        const elH = winEl.offsetHeight || 120;

        const minLeft = margin;
        const minTop = margin;
        const maxLeft = Math.max(minLeft, containerW - elW - margin);
        const maxTop = Math.max(minTop, containerH - Math.min(elH, containerH - margin * 2) - margin);

        return { minLeft, minTop, maxLeft, maxTop };
      }

      function clampCoordsWithBounds(left, top, bounds, useGrid = false) {
        const { minLeft, minTop, maxLeft, maxTop } = bounds;
        const step = Number(state.gridSize) || 24;

        let nextLeft = Math.min(Math.max(minLeft, left), maxLeft);
        let nextTop = Math.min(Math.max(minTop, top), maxTop);

        if (useGrid) {
          nextLeft = Math.round(nextLeft / step) * step;
          nextTop = Math.round(nextTop / step) * step;

          if (nextLeft > maxLeft) {
            nextLeft = Math.max(minLeft, Math.floor(maxLeft / step) * step);
          }
          if (nextTop > maxTop) {
            nextTop = Math.max(minTop, Math.floor(maxTop / step) * step);
          }
          nextLeft = Math.min(Math.max(minLeft, nextLeft), maxLeft);
          nextTop = Math.min(Math.max(minTop, nextTop), maxTop);
        }

        return { left: nextLeft, top: nextTop };
      }

      function clampWindowCoords(winEl, left, top, useGrid = false, cachedMetrics = null) {
        const bounds = getWindowClampBounds(winEl, cachedMetrics);
        return clampCoordsWithBounds(left, top, bounds, useGrid);
      }

      function snapAllWindowsToGrid() {
        const metrics = getContainerMetrics();
        const updates = [];

        // Read phase: batch all DOM measurements before mutating styles
        document.querySelectorAll('.workspace-window').forEach(winEl => {
          const rawLeft = parseInt(winEl.style.left, 10) || 24;
          const rawTop = parseInt(winEl.style.top, 10) || 24;
          const { left, top } = clampWindowCoords(winEl, rawLeft, rawTop, true, metrics);
          updates.push({ winEl, left, top });
        });

        // Write phase: apply all style mutations in a single pass
        updates.forEach(({ winEl, left, top }) => {
          winEl.classList.add('is-settling');
          winEl.style.left = `${left}px`;
          winEl.style.top = `${top}px`;
          setTimeout(() => winEl.classList.remove('is-settling'), 260);

          const stickyId = winEl.getAttribute('data-sticky-id');
          if (stickyId) {
            const note = state.stickyNotes.find(n => n.id === stickyId);
            if (note) {
              note.left = left;
              note.top = top;
              note.zIndex = parseInt(winEl.style.zIndex, 10) || 20;
            }
          } else {
            state.windowPositions[winEl.id] = {
              left,
              top,
              zIndex: parseInt(winEl.style.zIndex, 10) || 20
            };
          }
        });
        saveState('ALIGNED ✓');
      }

      function getNextTopZIndex() {
        document.querySelectorAll('.workspace-window').forEach(el => {
          const z = parseInt(el.style.zIndex, 10);
          if (Number.isFinite(z) && z < 600 && z > topZIndex) {
            topZIndex = z;
          }
        });
        topZIndex += 1;
        return topZIndex;
      }

      function bringWindowToFront(winEl) {
        if (!winEl) return;
        const isPopup = winEl.id && winEl.id.startsWith('popup-');
        const currentZ = parseInt(winEl.style.zIndex, 10) || 0;

        let maxOtherZ = 0;
        if (!isPopup) {
          document.querySelectorAll('.workspace-window').forEach(w => {
            if (w !== winEl) {
              const wz = parseInt(w.style.zIndex, 10) || 0;
              if (wz < 600 && wz > maxOtherZ) maxOtherZ = wz;
            }
          });
        }

        if (activeWindowEl === winEl && (isPopup || currentZ > maxOtherZ)) {
          return;
        }

        document.querySelectorAll('.win80-window.is-active, .sticky-widget.is-active').forEach(w => {
          if (w !== winEl) w.classList.remove('is-active');
        });

        winEl.classList.add('is-active');
        activeWindowEl = winEl;

        let appliedZ;
        if (isPopup) {
          popupZIndex += 1;
          appliedZ = popupZIndex;
        } else {
          appliedZ = getNextTopZIndex();
        }
        winEl.style.zIndex = String(appliedZ);

        // Persist updated zIndex so re-rendering stickies or windows never drops them behind others
        const stickyId = winEl.getAttribute('data-sticky-id');
        if (stickyId) {
          const targetNote = state.stickyNotes.find(n => n.id === stickyId);
          if (targetNote) {
            targetNote.zIndex = appliedZ;
            saveStateDebounced();
          }
        } else if (!isPopup && winEl.id && state.windowPositions) {
          const prevPos = state.windowPositions[winEl.id] || {};
          state.windowPositions[winEl.id] = {
            left: parseInt(winEl.style.left, 10) || prevPos.left || 24,
            top: parseInt(winEl.style.top, 10) || prevPos.top || 24,
            zIndex: appliedZ
          };
          saveStateDebounced();
        }
      }

      function restoreWindowPositions(animate = false) {
        const entries = Object.entries(state.windowPositions || {});

        entries.forEach(([id, pos]) => {
          const el = document.getElementById(id);
          if (!el || !pos) return;
          const safeLeft = Math.max(8, Number(pos.left) || 24);
          const safeTop = Math.max(8, Number(pos.top) || 24);

          if (animate) {
            el.classList.add('is-settling');
            setTimeout(() => el.classList.remove('is-settling'), 260);
          }
          el.style.left = `${safeLeft}px`;
          el.style.top = `${safeTop}px`;
          el.style.transform = '';
          if (pos.zIndex) {
            const isPopup = el.id && el.id.startsWith('popup-');
            el.style.zIndex = String(pos.zIndex);
            if (!isPopup) {
              topZIndex = Math.max(topZIndex, Number(pos.zIndex) || 20);
            }
          }
        });
      }

      function attachDragBehavior(targetWin, handle, onSavePosition) {
        const ghost = document.getElementById('grid-snap-ghost');
        let dragging = false;
        let startX = 0;
        let startY = 0;
        let startLeft = 0;
        let startTop = 0;
        let winWidth = 0;
        let winHeight = 0;
        let cachedBounds = { minLeft: 8, minTop: 8, maxLeft: 0, maxTop: 0 };
        let isWorkspaceWin = false;
        let ghostVisible = false;
        let rafId = null;
        let settleTimer = null;
        let rawLeft = 0;
        let rawTop = 0;
        let pendingLeft = 0;
        let pendingTop = 0;

        targetWin.addEventListener('pointerdown', () => bringWindowToFront(targetWin), { passive: true });

        // Double-click titlebar to shade/unshade (roll up) standard workspace windows
        if (targetWin.id && targetWin.classList.contains('win80-window') && targetWin.classList.contains('workspace-window')) {
          handle.addEventListener('dblclick', (e) => {
            if (e.target.closest('button')) return;
            if (!state.shadedWindows) state.shadedWindows = {};
            const nextShaded = !targetWin.classList.contains('is-shaded');
            targetWin.classList.toggle('is-shaded', nextShaded);
            state.shadedWindows[targetWin.id] = nextShaded;
            saveState(nextShaded ? 'SHADED ✓' : 'EXPANDED ✓');
          });
        }

        handle.addEventListener('pointerdown', (e) => {
          if (e.button !== undefined && e.button !== 0) return;
          if (e.target.closest('button')) return;
          isWorkspaceWin = targetWin.classList.contains('workspace-window');

          if (settleTimer) {
            clearTimeout(settleTimer);
            settleTimer = null;
          }
          targetWin.classList.remove('is-settling');

          dragging = true;
          ghostVisible = false;
          targetWin.classList.add('is-dragging');
          bringWindowToFront(targetWin);
          startX = e.clientX;
          startY = e.clientY;
          startLeft = parseInt(targetWin.style.left, 10) || targetWin.offsetLeft || 0;
          startTop = parseInt(targetWin.style.top, 10) || targetWin.offsetTop || 0;
          winWidth = targetWin.offsetWidth;
          winHeight = targetWin.offsetHeight;

          cachedBounds = getWindowClampBounds(targetWin);

          rawLeft = Math.min(Math.max(cachedBounds.minLeft, startLeft), cachedBounds.maxLeft);
          rawTop = Math.min(Math.max(cachedBounds.minTop, startTop), cachedBounds.maxTop);
          pendingLeft = rawLeft;
          pendingTop = rawTop;

          if (ghost && state.snapToGrid && isWorkspaceWin) {
            ghost.style.left = '0px';
            ghost.style.top = '0px';
            ghost.style.width = `${winWidth}px`;
            ghost.style.height = `${winHeight}px`;
            ghost.style.transform = `translate3d(${pendingLeft}px, ${pendingTop}px, 0)`;
          }

          handle.setPointerCapture(e.pointerId);
        });

        handle.addEventListener('pointermove', (e) => {
          if (!dragging) return;
          rawLeft = Math.max(cachedBounds.minLeft, Math.min(cachedBounds.maxLeft, startLeft + (e.clientX - startX)));
          rawTop = Math.max(cachedBounds.minTop, Math.min(cachedBounds.maxTop, startTop + (e.clientY - startY)));

          const shouldSnap = state.snapToGrid && !e.shiftKey;
          const clamped = clampCoordsWithBounds(rawLeft, rawTop, cachedBounds, shouldSnap);

          pendingLeft = clamped.left;
          pendingTop = clamped.top;

          if (!rafId) {
            rafId = requestAnimationFrame(() => {
              rafId = null;
              if (!dragging) return;
              const dx = rawLeft - startLeft;
              const dy = rawTop - startTop;
              targetWin.style.transform = `translate3d(${dx}px, ${dy}px, 0)`;

              if (ghost && state.snapToGrid && isWorkspaceWin) {
                if (!ghostVisible) {
                  ghost.classList.remove('hidden');
                  ghostVisible = true;
                }
                ghost.style.transform = `translate3d(${pendingLeft}px, ${pendingTop}px, 0)`;
              }
            });
          }
        });

        const endDrag = () => {
          if (!dragging) return;
          dragging = false;
          targetWin.classList.remove('is-dragging');
          if (rafId) {
            cancelAnimationFrame(rafId);
            rafId = null;
          }

          if (ghost && ghostVisible) {
            ghost.classList.add('hidden');
            ghost.style.transform = '';
            ghostVisible = false;
          }

          // Smoothly glide from the release cursor position into the snapped grid slot
          const settleDx = pendingLeft - startLeft;
          const settleDy = pendingTop - startTop;
          const needsGlide = Math.abs(rawLeft - pendingLeft) > 1 || Math.abs(rawTop - pendingTop) > 1;

          if (needsGlide) {
            targetWin.classList.add('is-settling');
            targetWin.style.transform = `translate3d(${settleDx}px, ${settleDy}px, 0)`;
            settleTimer = setTimeout(() => {
              targetWin.classList.remove('is-settling');
              targetWin.style.transform = '';
              targetWin.style.left = `${pendingLeft}px`;
              targetWin.style.top = `${pendingTop}px`;
              settleTimer = null;
            }, 185);
          } else {
            targetWin.style.transform = '';
            targetWin.style.left = `${pendingLeft}px`;
            targetWin.style.top = `${pendingTop}px`;
          }

          const finalZ = parseInt(targetWin.style.zIndex, 10) || 20;
          onSavePosition(pendingLeft, pendingTop, finalZ);
          saveState('SAVED ✓');
        };

        handle.addEventListener('pointerup', endDrag);
        handle.addEventListener('pointercancel', endDrag);
      }

      function initDraggableWindows() {
        document.querySelectorAll('[data-close-win]').forEach(btn => {
          btn.addEventListener('click', () => {
            const el = document.getElementById(btn.getAttribute('data-close-win'));
            if (el) el.classList.add('hidden');
          });
        });

        document.querySelectorAll('[data-drag-handle]').forEach(handle => {
          const targetWin = document.getElementById(handle.getAttribute('data-drag-handle'));
          if (!targetWin) return;
          attachDragBehavior(targetWin, handle, (left, top, zIndex) => {
            state.windowPositions[targetWin.id] = { left, top, zIndex };
          });
        });
      }

      let clockDom = null;
      let lastClockHm = '';
      let lastClockSec = '';
      let lastClockAmPm = '';
      let lastClock24h = null;
      let lastClockDate = '';

      function updateClock() {
        if (!clockDom) {
          clockDom = {
            hm: document.getElementById('clock-hm'),
            sec: document.getElementById('clock-sec'),
            ampm: document.getElementById('clock-ampm'),
            date: document.getElementById('clock-date')
          };
        }
        const now = new Date();
        const h24 = now.getHours();
        const mins = String(now.getMinutes()).padStart(2, '0');
        const secs = `:${String(now.getSeconds()).padStart(2, '0')}`;

        if (state.clock24h) {
          const hmStr = `${String(h24).padStart(2, '0')}:${mins}`;
          if (hmStr !== lastClockHm) {
            clockDom.hm.textContent = hmStr;
            lastClockHm = hmStr;
          }
          if (lastClock24h !== true) {
            clockDom.ampm.classList.add('hidden');
            lastClock24h = true;
          }
        } else {
          const h12 = h24 % 12 || 12;
          const hmStr = `${String(h12).padStart(2, '0')}:${mins}`;
          const ampmStr = h24 >= 12 ? 'PM' : 'AM';
          if (hmStr !== lastClockHm) {
            clockDom.hm.textContent = hmStr;
            lastClockHm = hmStr;
          }
          if (ampmStr !== lastClockAmPm) {
            clockDom.ampm.textContent = ampmStr;
            lastClockAmPm = ampmStr;
          }
          if (lastClock24h !== false) {
            clockDom.ampm.classList.remove('hidden');
            lastClock24h = false;
          }
        }

        if (secs !== lastClockSec) {
          clockDom.sec.textContent = secs;
          lastClockSec = secs;
        }

        const dateStr = now
          .toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' })
          .toUpperCase();
        if (dateStr !== lastClockDate) {
          clockDom.date.textContent = dateStr;
          lastClockDate = dateStr;
        }
      }

      function normalizeUrl(raw) {
        const trimmed = (raw || '').trim();
        if (!trimmed) return '';
        if (/^[a-zA-Z][a-zA-Z\d+\-.]*:\/\//.test(trimmed)) return trimmed;
        return `https://${trimmed}`;
      }

      const hostCache = new Map();
      function getCachedHostname(rawUrl) {
        if (!rawUrl) return '';
        if (hostCache.has(rawUrl)) return hostCache.get(rawUrl);
        try {
          const host = new URL(normalizeUrl(rawUrl)).hostname.replace(/^www\./i, '').toLowerCase();
          if (hostCache.size > 400) hostCache.clear();
          hostCache.set(rawUrl, host);
          return host;
        } catch {
          return '';
        }
      }

      function deriveDomainTitle(rawUrl) {
        const host = getCachedHostname(rawUrl);
        if (!host) return '';
        const base = host.split('.')[0] || host;
        return base.charAt(0).toUpperCase() + base.slice(1);
      }

      /* Anti-Bot Favicon Cache: Deduplicates by hostname and caches loaded DOM nodes */
      const faviconTemplateCache = new Map();
      const failedFaviconHosts = new Set();

      function getFaviconNode(linkUrl) {
        try {
          const u = new URL(linkUrl);
          const host = u.hostname.toLowerCase();
          if (!host || failedFaviconHosts.has(host)) return null;

          if (faviconTemplateCache.has(host)) {
            const cachedImg = faviconTemplateCache.get(host).cloneNode(false);
            cachedImg.setAttribute('draggable', 'false');
            return cachedImg;
          }

          const img = document.createElement('img');
          // Use privacy-respecting static icon service once per unique domain
          img.src = `https://icons.duckduckgo.com/ip3/${encodeURIComponent(host)}.ico`;
          img.alt = '';
          img.loading = 'lazy';
          img.decoding = 'async';
          img.referrerPolicy = 'no-referrer';
          img.setAttribute('draggable', 'false');
          img.className = 'w-4 h-4 shrink-0 select-none pointer-events-none';
          img.style.imageRendering = 'pixelated';
          img.onerror = () => {
            failedFaviconHosts.add(host);
            faviconTemplateCache.delete(host);
            img.remove();
          };

          faviconTemplateCache.set(host, img);
          return img.cloneNode(false);
        } catch {
          return null;
        }
      }

      function relocateQuicklinkByDrop(draggedId, targetLinkId, targetGroupName) {
        if (!draggedId || draggedId === targetLinkId) return;
        const fromIdx = state.quicklinks.findIndex(q => q.id === draggedId);
        if (fromIdx === -1) return;

        const [movedItem] = state.quicklinks.splice(fromIdx, 1);
        if (typeof targetGroupName === 'string') {
          movedItem.category = targetGroupName;
        }

        if (targetLinkId) {
          const toIdx = state.quicklinks.findIndex(q => q.id === targetLinkId);
          if (toIdx !== -1) {
            movedItem.category =
              typeof targetGroupName === 'string'
                ? targetGroupName
                : (state.quicklinks[toIdx].category || '');
            state.quicklinks.splice(toIdx, 0, movedItem);
          } else {
            state.quicklinks.push(movedItem);
          }
        } else {
          state.quicklinks.push(movedItem);
        }

        saveState('MOVED ✓');
        renderQuicklinks();
      }

      function createQuicklinkTileElement(item, groupName) {
        const tile = document.createElement('div');
        tile.className = 'quicklink-tile p-2.5 flex items-center justify-between gap-2';
        tile.setAttribute('data-link-id', item.id);

        if (editLinksMode) {
          tile.setAttribute('draggable', 'true');

          tile.addEventListener('dragstart', (e) => {
            e.stopPropagation();
            draggedGroupName = null;
            draggedQuicklinkId = item.id;
            tile.classList.add('is-being-dragged');
            if (e.dataTransfer) {
              e.dataTransfer.effectAllowed = 'move';
              e.dataTransfer.setData('text/plain', item.id);
            }
          });

          tile.addEventListener('dragend', () => {
            draggedQuicklinkId = null;
            tile.classList.remove('is-being-dragged');
            document.querySelectorAll('.is-drop-target, .is-group-drop-target').forEach(el => {
              el.classList.remove('is-drop-target', 'is-group-drop-target');
            });
          });

          tile.addEventListener('dragover', (e) => {
            if (!draggedQuicklinkId || draggedQuicklinkId === item.id) return;
            e.preventDefault();
            e.stopPropagation();
            e.dataTransfer.dropEffect = 'move';
            tile.classList.add('is-drop-target');
          });

          tile.addEventListener('dragleave', () => {
            tile.classList.remove('is-drop-target');
          });

          tile.addEventListener('drop', (e) => {
            if (!draggedQuicklinkId || draggedQuicklinkId === item.id) return;
            e.preventDefault();
            e.stopPropagation();
            tile.classList.remove('is-drop-target');
            document.querySelectorAll('.is-group-drop-target').forEach(el => el.classList.remove('is-group-drop-target'));
            relocateQuicklinkByDrop(draggedQuicklinkId, item.id, groupName);
            draggedQuicklinkId = null;
          });
        } else {
          tile.setAttribute('draggable', 'false');
          tile.addEventListener('dragstart', (e) => e.preventDefault());
        }

        const a = document.createElement('a');
        a.href = item.url;
        a.setAttribute('draggable', 'false');
        if (state.openInNewTab) {
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
        }
        if (editLinksMode) {
          a.addEventListener('click', (e) => e.preventDefault());
        } else {
          a.addEventListener('dragstart', (e) => e.preventDefault());
        }
        a.className = 'min-w-0 flex-1 flex items-center gap-1.5 hover:underline';

        if (editLinksMode) {
          const dragGrip = document.createElement('span');
          dragGrip.className = 'text-[var(--text-secondary)] shrink-0 cursor-grab';
          dragGrip.textContent = '::';
          a.appendChild(dragGrip);
        } else if (state.showFavicons) {
          const favImg = getFaviconNode(item.url);
          if (favImg) {
            favImg.onerror = () => favImg.remove();
            a.appendChild(favImg);
          }
        }

        const labelSpan = document.createElement('span');
        labelSpan.className = editLinksMode
          ? 'flex-1 break-words text-[var(--text-primary)]'
          : 'truncate flex-1 text-[var(--text-primary)]';
        labelSpan.textContent = (state.showFavicons || editLinksMode || state.compactQuicklinks)
          ? item.title
          : `> ${item.title}`;
        a.appendChild(labelSpan);

        tile.appendChild(a);

        if (editLinksMode) {
          const actions = document.createElement('div');
          actions.className = 'flex items-center gap-1 shrink-0';

          const editItemBtn = document.createElement('button');
          editItemBtn.type = 'button';
          editItemBtn.className = 'win80-icon-btn';
          editItemBtn.textContent = '✎';
          editItemBtn.addEventListener('click', () => openLinkEditor(item.id));

          const delItemBtn = document.createElement('button');
          delItemBtn.type = 'button';
          delItemBtn.className = 'win80-close-btn';
          delItemBtn.innerHTML = getPixelXSVG();
          delItemBtn.addEventListener('click', () => {
            state.quicklinks = state.quicklinks.filter(q => q.id !== item.id);
            saveState();
            renderQuicklinks();
          });

          actions.appendChild(editItemBtn);
          actions.appendChild(delItemBtn);
          tile.appendChild(actions);
        }

        return tile;
      }

      function renderQuicklinks() {
        const container = document.getElementById('quicklinks-grid');
        const editBtn = document.getElementById('toggle-edit-mode-btn');
        const addGroupBtn = document.getElementById('header-add-group-btn');
        const newGroupForm = document.getElementById('new-group-form');
        const filterBar = document.getElementById('quicklinks-filter-bar');
        const groupTabsEl = document.getElementById('quicklinks-group-tabs');
        const toggleAllGroupsBtn = document.getElementById('toggle-all-groups-btn');
        const countLabel = document.getElementById('quicklinks-count-label');

        state.groups = normalizeGroups(state.groups, state.quicklinks);
        if (!state.groupColors || typeof state.groupColors !== 'object') {
          state.groupColors = {};
        }

        if (!editLinksMode) {
          renamingGroupName = null;
          if (newGroupForm) {
            newGroupForm.classList.add('hidden');
            newGroupForm.classList.remove('flex');
          }
        }

        if (addGroupBtn) {
          addGroupBtn.classList.toggle('hidden', !editLinksMode);
        }

        editBtn.textContent = editLinksMode ? 'Done' : 'Edit';
        editBtn.classList.toggle('win80-btn-yellow', editLinksMode);

        if (countLabel) {
          const totalLinks = state.quicklinks.length;
          const totalGroups = state.groups.length;
          countLabel.textContent = totalGroups > 0
            ? `${totalLinks} LINK${totalLinks === 1 ? '' : 'S'} IN ${totalGroups} GROUP${totalGroups === 1 ? '' : 'S'}`
            : `${totalLinks} LINK${totalLinks === 1 ? '' : 'S'} (UNGROUPED)`;
        }

        // Validate activeGroupFilter
        if (
          state.activeGroupFilter &&
          state.activeGroupFilter !== 'ALL' &&
          !state.groups.some(g => g.toLowerCase() === state.activeGroupFilter.toLowerCase())
        ) {
          state.activeGroupFilter = 'ALL';
        }

        // Render Group Filter Bar & Collapse All Button only when 2+ groups exist
        if (filterBar && groupTabsEl) {
          if (state.groups.length > 1) {
            filterBar.classList.remove('hidden');
            filterBar.classList.add('flex');
            groupTabsEl.innerHTML = '';

            const allTab = document.createElement('button');
            allTab.type = 'button';
            allTab.className = 'group-filter-tab' + ((state.activeGroupFilter || 'ALL') === 'ALL' ? ' is-active' : '');
            allTab.textContent = `ALL (${state.quicklinks.length})`;
            allTab.addEventListener('click', () => {
              state.activeGroupFilter = 'ALL';
              saveState();
              renderQuicklinks();
            });
            groupTabsEl.appendChild(allTab);

            state.groups.forEach(gName => {
              const gCount = state.quicklinks.filter(
                q => (q.category || state.groups[0] || '').toLowerCase() === gName.toLowerCase()
              ).length;
              const tab = document.createElement('button');
              tab.type = 'button';
              const isAct = (state.activeGroupFilter || 'ALL').toLowerCase() === gName.toLowerCase();
              tab.className = 'group-filter-tab' + (isAct ? ' is-active' : '');
              tab.textContent = `${gName.toUpperCase()} (${gCount})`;
              tab.addEventListener('click', () => {
                state.activeGroupFilter = isAct ? 'ALL' : gName;
                saveState();
                renderQuicklinks();
              });
              groupTabsEl.appendChild(tab);
            });

            if (toggleAllGroupsBtn) {
              const allCollapsed = state.groups.every(g => state.collapsedGroups && state.collapsedGroups[g]);
              toggleAllGroupsBtn.textContent = allCollapsed ? 'Expand All' : 'Collapse All';
              toggleAllGroupsBtn.classList.toggle('hidden', editLinksMode);
            }
          } else {
            filterBar.classList.add('hidden');
            filterBar.classList.remove('flex');
          }
        }

        const gridColsClass = editLinksMode
          ? 'grid grid-cols-1 sm:grid-cols-2 gap-2'
          : state.compactQuicklinks
          ? 'grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-1.5'
          : 'grid grid-cols-2 sm:grid-cols-3 gap-2.5';

        const fragment = document.createDocumentFragment();

        // Zero-Group (Flat Ungrouped) Mode when user deletes all groups
        if (state.groups.length === 0) {
          const flatGrid = document.createElement('div');
          flatGrid.className = gridColsClass;

          state.quicklinks.forEach((item) => {
            flatGrid.appendChild(createQuicklinkTileElement(item, ''));
          });

          if (editLinksMode) {
            const addBtn = document.createElement('button');
            addBtn.type = 'button';
            addBtn.className = 'quicklink-add-tile p-2.5 flex items-center justify-center gap-2 cursor-pointer';
            addBtn.innerHTML = `<span>[ + ]</span><span>Add</span>`;
            addBtn.addEventListener('click', () => openLinkEditor(null, ''));
            flatGrid.appendChild(addBtn);
          }

          fragment.appendChild(flatGrid);
          container.replaceChildren(fragment);
          return;
        }

        state.groups.forEach((groupName, groupIdx) => {
          const groupLinks = state.quicklinks.filter(
            q => (q.category || state.groups[0]).toLowerCase() === groupName.toLowerCase()
          );

          // If a specific group tab filter is active, hide other groups (unless in Edit mode)
          if (
            !editLinksMode &&
            state.activeGroupFilter &&
            state.activeGroupFilter !== 'ALL' &&
            state.activeGroupFilter.toLowerCase() !== groupName.toLowerCase()
          ) {
            return;
          }

          const isCollapsed = !editLinksMode && !!(state.collapsedGroups && state.collapsedGroups[groupName]);
          const colorKey = state.groupColors[groupName] || 'default';
          const colorPreset = GROUP_COLOR_PRESETS[colorKey] || GROUP_COLOR_PRESETS.default;

          const box = document.createElement('div');
          box.className = 'group-box space-y-2';
          if (colorPreset.bg) {
            box.style.setProperty('--group-bg', colorPreset.bg);
          }
          if (colorPreset.border) {
            box.style.setProperty('--group-border', colorPreset.border);
          }

          if (editLinksMode) {
            box.addEventListener('dragover', (e) => {
              if (!draggedQuicklinkId && !draggedGroupName) return;
              if (draggedGroupName && draggedGroupName.toLowerCase() === groupName.toLowerCase()) return;
              e.preventDefault();
              e.dataTransfer.dropEffect = 'move';
              box.classList.add('is-group-drop-target');
            });
            box.addEventListener('dragleave', (e) => {
              if (!box.contains(e.relatedTarget)) {
                box.classList.remove('is-group-drop-target');
              }
            });
            box.addEventListener('drop', (e) => {
              box.classList.remove('is-group-drop-target');
              if (draggedGroupName) {
                e.preventDefault();
                e.stopPropagation();
                const sourceGroup = draggedGroupName;
                draggedGroupName = null;
                reorderGroupByDrop(sourceGroup, groupName);
                return;
              }
              if (!draggedQuicklinkId) return;
              e.preventDefault();
              if (e.target.closest('.quicklink-tile')) return;
              relocateQuicklinkByDrop(draggedQuicklinkId, null, groupName);
              draggedQuicklinkId = null;
            });
          }

          const header = document.createElement('div');
          header.className =
            'flex flex-wrap items-center justify-between gap-2' +
            (isCollapsed ? '' : ' border-b-2 border-[var(--win-border)] pb-1.5');

          if (editLinksMode && state.groups.length > 1 && renamingGroupName !== groupName) {
            header.setAttribute('draggable', 'true');
            header.classList.add('cursor-grab');
            header.addEventListener('dragstart', (e) => {
              if (e.target.closest('button, input')) return;
              draggedQuicklinkId = null;
              draggedGroupName = groupName;
              box.classList.add('opacity-60');
              if (e.dataTransfer) {
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', groupName);
              }
            });
            header.addEventListener('dragend', () => {
              draggedGroupName = null;
              box.classList.remove('opacity-60');
              document.querySelectorAll('.is-group-drop-target').forEach(el => el.classList.remove('is-group-drop-target'));
            });
          }

          if (editLinksMode && renamingGroupName === groupName) {
            const renameForm = document.createElement('form');
            renameForm.className = 'flex items-center gap-1.5 w-full';

            const renameInput = document.createElement('input');
            renameInput.type = 'text';
            renameInput.maxLength = 24;
            renameInput.value = groupName;
            renameInput.className = 'win80-input flex-1 py-0.5 px-2';

            const saveRenameBtn = document.createElement('button');
            saveRenameBtn.type = 'submit';
            saveRenameBtn.className = 'win80-bar-btn is-active';
            saveRenameBtn.textContent = 'Save';

            const cancelRenameBtn = document.createElement('button');
            cancelRenameBtn.type = 'button';
            cancelRenameBtn.className = 'win80-bar-btn';
            cancelRenameBtn.textContent = 'Cancel';
            cancelRenameBtn.addEventListener('click', () => {
              renamingGroupName = null;
              renderQuicklinks();
            });

            renameForm.addEventListener('submit', (e) => {
              e.preventDefault();
              const nextName = renameInput.value.trim();
              if (!nextName) return;

              const duplicate = state.groups.some(
                g => g.toLowerCase() === nextName.toLowerCase() && g.toLowerCase() !== groupName.toLowerCase()
              );
              if (duplicate) return;

              const wasFirstGroup = state.groups[0] && state.groups[0].toLowerCase() === groupName.toLowerCase();
              state.groups = state.groups.map(g => (g.toLowerCase() === groupName.toLowerCase() ? nextName : g));

              if (state.groupColors && state.groupColors[groupName]) {
                state.groupColors[nextName] = state.groupColors[groupName];
                if (nextName !== groupName) delete state.groupColors[groupName];
              }
              if (state.collapsedGroups && state.collapsedGroups[groupName]) {
                state.collapsedGroups[nextName] = state.collapsedGroups[groupName];
                if (nextName !== groupName) delete state.collapsedGroups[groupName];
              }
              if (state.activeGroupFilter && state.activeGroupFilter.toLowerCase() === groupName.toLowerCase()) {
                state.activeGroupFilter = nextName;
              }

              state.quicklinks.forEach(item => {
                const currentCat = String(item.category || '').trim();
                if (
                  currentCat.toLowerCase() === groupName.toLowerCase() ||
                  (!currentCat && wasFirstGroup)
                ) {
                  item.category = nextName;
                }
              });

              renamingGroupName = null;
              saveState('GROUP RENAMED ✓');
              renderQuicklinks();
            });

            renameForm.appendChild(renameInput);
            renameForm.appendChild(saveRenameBtn);
            renameForm.appendChild(cancelRenameBtn);
            header.appendChild(renameForm);
            setTimeout(() => {
              renameInput.focus();
              renameInput.select();
            }, 20);
          } else {
            const titleBtn = document.createElement('button');
            titleBtn.type = 'button';
            titleBtn.className = 'flex items-center gap-1.5 text-left hover:underline cursor-pointer min-w-0';
            const dotHtml =
              colorKey !== 'default'
                ? `<span class="inline-block w-2.5 h-2.5 border border-black shrink-0" style="background-color:${colorPreset.swatch}"></span>`
                : '';
            const dragGripHtml =
              editLinksMode && state.groups.length > 1
                ? `<span class="text-[var(--text-secondary)] cursor-grab shrink-0">::</span>`
                : '';
            const editPencilHtml = editLinksMode ? `<span class="text-[var(--text-secondary)] shrink-0">✎</span>` : '';
            titleBtn.innerHTML = `${dragGripHtml}<span>${isCollapsed ? '▸' : '▾'}</span>${dotHtml}<span class="truncate">${escapeHtml(groupName.toUpperCase())} (${groupLinks.length})</span>${editPencilHtml}`;
            titleBtn.addEventListener('click', () => {
              if (editLinksMode) {
                renamingGroupName = groupName;
                renderQuicklinks();
                return;
              }
              if (!state.collapsedGroups) state.collapsedGroups = {};
              state.collapsedGroups[groupName] = !state.collapsedGroups[groupName];
              saveState();
              renderQuicklinks();
            });
            header.appendChild(titleBtn);

            if (editLinksMode) {
              const groupActions = document.createElement('div');
              groupActions.className = 'flex flex-wrap items-center gap-1';

              // Reorder Group Up / Down Buttons when multiple groups exist
              if (state.groups.length > 1) {
                const moveUpBtn = document.createElement('button');
                moveUpBtn.type = 'button';
                moveUpBtn.className = 'win80-bar-btn' + (groupIdx === 0 ? ' opacity-40 pointer-events-none' : '');
                moveUpBtn.textContent = '↑';
                moveUpBtn.addEventListener('click', () => moveGroupByOffset(groupName, -1));
                groupActions.appendChild(moveUpBtn);

                const moveDownBtn = document.createElement('button');
                moveDownBtn.type = 'button';
                moveDownBtn.className = 'win80-bar-btn' + (groupIdx === state.groups.length - 1 ? ' opacity-40 pointer-events-none' : '');
                moveDownBtn.textContent = '↓';
                moveDownBtn.addEventListener('click', () => moveGroupByOffset(groupName, 1));
                groupActions.appendChild(moveDownBtn);
              }

              // Group Color Swatches in Edit Mode
              const swatchBar = document.createElement('div');
              swatchBar.className = 'flex items-center gap-1 mr-0.5';
              Object.entries(GROUP_COLOR_PRESETS).forEach(([key, preset]) => {
                const sw = document.createElement('button');
                sw.type = 'button';
                sw.className = 'group-color-swatch' + (colorKey === key ? ' is-selected' : '');
                sw.style.backgroundColor = preset.swatch;
                sw.addEventListener('click', () => {
                  if (!state.groupColors) state.groupColors = {};
                  if (key === 'default') {
                    delete state.groupColors[groupName];
                  } else {
                    state.groupColors[groupName] = key;
                  }
                  saveState('COLOR SAVED ✓');
                  renderQuicklinks();
                });
                swatchBar.appendChild(sw);
              });
              groupActions.appendChild(swatchBar);

              const delGrpBtn = document.createElement('button');
              delGrpBtn.type = 'button';
              delGrpBtn.className = state.groups.length === 1 ? 'win80-bar-btn text-red-700' : 'win80-close-btn';
              if (state.groups.length === 1) {
                delGrpBtn.textContent = 'Ungroup';
              } else {
                delGrpBtn.innerHTML = getPixelXSVG();
              }
              delGrpBtn.addEventListener('click', () => {
                state.groups = state.groups.filter(g => g.toLowerCase() !== groupName.toLowerCase());
                if (state.groupColors) delete state.groupColors[groupName];
                if (state.collapsedGroups) delete state.collapsedGroups[groupName];
                const fallback = state.groups[0] || '';
                state.quicklinks.forEach(item => {
                  if ((item.category || '').toLowerCase() === groupName.toLowerCase() || !fallback) {
                    item.category = fallback;
                  }
                });
                saveState(fallback ? 'GROUP DELETED ✓' : 'UNGROUPED ✓');
                renderQuicklinks();
              });
              groupActions.appendChild(delGrpBtn);

              header.appendChild(groupActions);
            }
          }

          box.appendChild(header);

          if (!isCollapsed) {
            const grid = document.createElement('div');
            grid.className = gridColsClass;

            groupLinks.forEach((item) => {
              grid.appendChild(createQuicklinkTileElement(item, groupName));
            });

            if (editLinksMode) {
              const addBtn = document.createElement('button');
              addBtn.type = 'button';
              addBtn.className = 'quicklink-add-tile p-2.5 flex items-center justify-center gap-2 cursor-pointer';
              addBtn.innerHTML = `<span>[ + ]</span><span>Add</span>`;
              addBtn.addEventListener('click', () => openLinkEditor(null, groupName));
              grid.appendChild(addBtn);
            }

            box.appendChild(grid);
          }

          fragment.appendChild(box);
        });

        container.replaceChildren(fragment);
      }

      /* Universal Startpage Quicklinks JSON Extractor */
      function extractQuicklinksFromAnyJSON(parsed) {
        const extractedLinks = [];
        const extractedGroups = [];

        const addGroup = (g) => {
          const clean = String(g || '').trim();
          if (clean && !extractedGroups.some(x => x.toLowerCase() === clean.toLowerCase())) {
            extractedGroups.push(clean);
          }
        };

        const addLinkObj = (rawItem, fallbackGroup) => {
          if (!rawItem || typeof rawItem !== 'object') return;
          const rawUrl =
            rawItem.url ||
            rawItem.href ||
            rawItem.link ||
            rawItem.uri ||
            rawItem.address ||
            (rawItem.display && rawItem.display.url);
          if (!rawUrl || typeof rawUrl !== 'string') return;
          if (rawUrl.startsWith('place:') || rawUrl.startsWith('javascript:')) return;

          const url = normalizeUrl(rawUrl);
          if (!url) return;

          let title =
            rawItem.title ||
            rawItem.name ||
            rawItem.label ||
            (rawItem.display && (rawItem.display.name || rawItem.display.title)) ||
            '';
          title = String(title).trim();
          if (!title) {
            try {
              title = new URL(url).hostname.replace(/^www\./, '');
            } catch {
              title = url;
            }
          }

          const category =
            String(
              rawItem.category ||
              rawItem.group ||
              rawItem.folder ||
              rawItem.section ||
              fallbackGroup ||
              'General'
            ).trim() || 'General';

          addGroup(category);
          extractedLinks.push({
            id: 'ql_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
            title,
            url,
            category
          });
        };

        const walkNode = (node, currentGroup) => {
          if (!node) return;
          if (Array.isArray(node)) {
            node.forEach(item => walkNode(item, currentGroup));
            return;
          }
          if (typeof node === 'object') {
            // Direct link object
            if (node.url || node.href || node.link || node.uri || (node.display && node.display.url)) {
              addLinkObj(node, currentGroup);
            }
            // Group / Folder container with children/links/items/bookmarks
            const groupLabel = node.title || node.name || node.category || node.group || node.header || currentGroup;
            const childArrays = [
              node.quicklinks,
              node.links,
              node.bookmarks,
              node.items,
              node.children,
              node.shortcuts,
              node.tiles
            ];
            let foundChildArray = false;
            childArrays.forEach(arr => {
              if (Array.isArray(arr)) {
                foundChildArray = true;
                walkNode(arr, groupLabel);
              }
            });

            // Object map of { "GroupName": [ ...links ] }
            if (!foundChildArray && !node.url && !node.href && !node.link && !node.uri) {
              Object.entries(node).forEach(([key, val]) => {
                if (
                  key !== 'windowPositions' &&
                  key !== 'visibleWindows' &&
                  key !== 'stickyNotes' &&
                  key !== 'calendarMarkers' &&
                  key !== 'weather' &&
                  Array.isArray(val)
                ) {
                  walkNode(val, key === 'groups' ? currentGroup : key);
                }
              });
            }
          }
        };

        if (parsed && Array.isArray(parsed.groups)) {
          parsed.groups.forEach(g => {
            if (typeof g === 'string') addGroup(g);
            else if (g && typeof g === 'object') {
              if (g.name || g.title) addGroup(g.name || g.title);
              walkNode(g, g.name || g.title || 'General');
            }
          });
        }

        walkNode(parsed, 'General');
        return { links: extractedLinks, groups: extractedGroups };
      }

      function getPixelXSVG() {
        return `
          <svg width="10" height="10" viewBox="0 0 5 5" shape-rendering="crispEdges" aria-hidden="true">
            <path d="M0 0h1v1H0zM4 0h1v1H4zM1 1h1v1H1zM3 1h1v1H3zM2 2h1v1H2zM1 3h1v1H1zM3 3h1v1H3zM0 4h1v1H0zM4 4h1v1H4z" fill="#ffffff"/>
          </svg>
        `;
      }

      function addStickyWidget(referenceNote) {
        if (!state.visibleWindows) state.visibleWindows = {};
        state.visibleWindows['win-sticky'] = true;

        if (referenceNote) {
          referenceNote.zIndex = getNextTopZIndex();
        }

        const step = Number(state.gridSize) || 24;
        const count = state.stickyNotes.length;
        const baseLeft = referenceNote
          ? referenceNote.left + step * 2
          : 24 + ((count * step * 2) % 240);
        const baseTop = referenceNote
          ? referenceNote.top + step
          : 432 + ((count * step) % 144);

        const left = Math.min(Math.max(24, snapToGridVal(baseLeft)), Math.max(24, window.innerWidth - 264));
        const top = Math.min(Math.max(24, snapToGridVal(baseTop)), Math.max(24, window.innerHeight - 240));
        const nextZ = getNextTopZIndex();

        const newNote = {
          id: 'sticky_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
          text: '',
          left,
          top,
          zIndex: nextZ
        };

        state.stickyNotes.push(newNote);
        applyPreferencesToDOM();
        renderStickyNotes(newNote.id, newNote.id);
        saveState();
      }

      function createStickyWidgetElement(note, animateIn) {
        const widget = document.createElement('section');
        widget.id = `sticky-widget-${note.id}`;
        widget.setAttribute('data-sticky-id', note.id);
        widget.className = 'sticky-widget workspace-window absolute' + (animateIn ? ' is-entering' : '');

        if (animateIn) {
          widget.addEventListener(
            'animationend',
            () => widget.classList.remove('is-entering'),
            { once: true }
          );
        }

        const pinbar = document.createElement('div');
        pinbar.className = 'sticky-pinbar';
        pinbar.innerHTML = `
          <span class="tracking-wide">STICKY</span>
          <div class="flex items-center gap-1.5">
            <button type="button" class="sticky-note-btn" data-action="add">+</button>

          saveStateDebounced('SAVED ✓');
        });

        pinbar.querySelector('[data-action="add"]').addEventListener('click', (e) => {
          e.stopPropagation();
          const currentNote = state.stickyNotes.find(n => n.id === note.id) || note;
          addStickyWidget(currentNote);
        });

        pinbar.querySelector('[data-action="delete"]').addEventListener('click', (e) => {
          e.stopPropagation();
          if (widget.classList.contains('is-closing')) return;
          widget.classList.add('is-closing');

          const finalizeRemove = () => {
            state.stickyNotes = state.stickyNotes.filter(n => n.id !== note.id);
            widget.remove();
            if (state.stickyNotes.length === 0) {
              state.visibleWindows['win-sticky'] = false;
              applyPreferencesToDOM();
            }
            saveState('STICKY REMOVED ✓');
          };

          setTimeout(finalizeRemove, 130);
        });

        widget.appendChild(pinbar);
        widget.appendChild(textarea);

        attachDragBehavior(widget, pinbar, (left, top, zIndex) => {
          const targetNote = state.stickyNotes.find(n => n.id === note.id);
          if (targetNote) {
            targetNote.left = left;
            targetNote.top = top;
            targetNote.zIndex = zIndex;
          }
        });

        return widget;
      }

      function renderStickyNotes(focusId, animateNewId) {
        const container = document.getElementById('stickies-container');
        if (!container) return;

        state.stickyNotes = normalizeStickyNotes(state.stickyNotes);

        // Remove any DOM stickies that no longer exist in state
        const validIds = new Set(state.stickyNotes.map(n => n.id));
        container.querySelectorAll('.sticky-widget').forEach(el => {
          const id = el.getAttribute('data-sticky-id');
          if (!validIds.has(id) && !el.classList.contains('is-closing')) {
            el.remove();
          }
        });

        let widgetToFocus = null;
        let textareaToFocus = null;

        state.stickyNotes.forEach((note) => {
          let widget = container.querySelector(`.sticky-widget[data-sticky-id="${note.id}"]`);
          const isNew = !widget;

          if (isNew) {
            widget = createStickyWidgetElement(note, animateNewId === note.id);
            container.appendChild(widget);
          }

          const safeLeft = Math.max(8, Number(note.left) || 24);
          const safeTop = Math.max(8, Number(note.top) || 432);
          note.left = safeLeft;
          note.top = safeTop;
          widget.style.left = `${safeLeft}px`;
          widget.style.top = `${safeTop}px`;
          widget.style.zIndex = String(note.zIndex || 21);
          topZIndex = Math.max(topZIndex, Number(note.zIndex) || 21);

          const textarea = widget.querySelector('.sticky-paper-input');
          if (textarea && document.activeElement !== textarea && textarea.value !== (note.text || '')) {
            textarea.value = note.text || '';
          }

          if (focusId && note.id === focusId) {
            widgetToFocus = widget;
            textareaToFocus = textarea;
          }
        });

        if (widgetToFocus) {
          bringWindowToFront(widgetToFocus);
          if (textareaToFocus) {
            textareaToFocus.focus({ preventScroll: true });
          }
        }
      }

        activeCalMarkerType = meta.code;

        const list = getMarkersForDate(selectedCalDateKey);
        const existingQuickIdx = list.findIndex(m => m.type === meta.code && !m.customText);

        if (existingQuickIdx !== -1) {
          list.splice(existingQuickIdx, 1);

            id: 'mk_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
            type: meta.code,
            text: meta.label,
            customText: false
          });

      function renderCalendar() {
        const grid = document.getElementById('cal-days-grid');
        const label = document.getElementById('cal-month-label');
        if (!grid || !label) return;

        const year = calendarViewDate.getFullYear();
        const month = calendarViewDate.getMonth();
        const todayKey = formatDateKey(new Date());

        label.textContent = calendarViewDate
          .toLocaleDateString('en-US', { month: 'short', year: 'numeric' })
          .toUpperCase();

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        const fragment = document.createDocumentFragment();

        for (let i = 0; i < firstDay; i++) {
          const empty = document.createElement('div');
          empty.className = 'p-1';
          fragment.appendChild(empty);
        }

        for (let d = 1; d <= daysInMonth; d++) {
          const cellDate = new Date(year, month, d);
          const dateKey = formatDateKey(cellDate);
          const isToday = dateKey === todayKey;
          const isSelected = dateKey === selectedCalDateKey;
          const dayMarkers = getMarkersForDate(dateKey);
          const hasMarker = dayMarkers.length > 0;

          const cell = document.createElement('button');
          cell.type = 'button';
          cell.setAttribute('data-date-key', dateKey);
          cell.className =
            'cal-cell' +
            (hasMarker ? ' has-marker' : '') +
            (isToday && !hasMarker ? ' is-today' : '') +
            (isSelected ? ' is-selected' : '');

          if (hasMarker) {
            const primaryMeta = CAL_MARKER_TYPES[dayMarkers[0].type] || CAL_MARKER_TYPES.urgent;
            cell.style.backgroundColor = primaryMeta.lightBg;
            if (isToday) {
              cell.style.boxShadow = 'inset 0 0 0 2px var(--accent)';
            }
          }

          const numSpan = document.createElement('span');
          numSpan.textContent = String(d);
          cell.appendChild(numSpan);

          cell.addEventListener('click', () => {
            if (selectedCalDateKey === dateKey) return;
            const prevSelected = grid.querySelector('.cal-cell.is-selected');
            if (prevSelected) prevSelected.classList.remove('is-selected');
            selectedCalDateKey = dateKey;
            cell.classList.add('is-selected');
            renderCalendarSelectedDayTray();
          });

          // Double-click any day to immediately stamp/toggle the active marker
          cell.addEventListener('dblclick', () => {
            selectedCalDateKey = dateKey;
            toggleQuickStampOnSelectedDate(activeCalMarkerType);
          });

          fragment.appendChild(cell);
        }

        grid.replaceChildren(fragment);
        renderCalendarSelectedDayTray();
      }

      async function fetchWeather(forceRefresh = false) {
        const locLabel = document.getElementById('weather-location-label');
        const tempEl = document.getElementById('weather-temp');
        const descEl = document.getElementById('weather-desc');
        if (!tempEl) return;

        const w = state.weather || DEFAULT_STATE.weather;
        locLabel.textContent = (w.city || 'RICHARDSON, TX').toUpperCase();

        // Render cached weather immediately (0ms) so opening a new tab is instantaneous
        const cache = w.cache;
        const CACHE_TTL_MS = 15 * 60 * 1000;
        if (
          cache &&
          cache.unit === w.unit &&
          cache.lat === w.lat &&
          cache.lon === w.lon &&
          typeof cache.currentTemp === 'number'
        ) {
          renderWeatherData(cache.currentTemp, cache.code, cache.wind, cache.hi, cache.lo, w.unit);
          if (!forceRefresh && Date.now() - (cache.ts || 0) < CACHE_TTL_MS) {
            return;
          }
        }

        try {
          const url = `https://api.open-meteo.com/v1/forecast?latitude=${encodeURIComponent(
            w.lat
          )}&longitude=${encodeURIComponent(
            w.lon
          )}&current=temperature_2m,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min&temperature_unit=${
            w.unit === 'celsius' ? 'celsius' : 'fahrenheit'
          }&wind_speed_unit=${w.unit === 'celsius' ? 'kmh' : 'mph'}&timezone=auto`;

          const res = await fetch(url);
          if (!res.ok) throw new Error('Weather fetch failed');
          const data = await res.json();

          const currentTemp = Math.round(data.current?.temperature_2m ?? 0);
          const code = data.current?.weather_code ?? 0;
          const wind = Math.round(data.current?.wind_speed_10m ?? 0);
          const hi = Math.round(data.daily?.temperature_2m_max?.[0] ?? currentTemp);
          const lo = Math.round(data.daily?.temperature_2m_min?.[0] ?? currentTemp);

          renderWeatherData(currentTemp, code, wind, hi, lo, w.unit);
          state.weather.cache = {
            currentTemp,
            code,
            wind,
            hi,
            lo,
            unit: w.unit,
            lat: w.lat,
            lon: w.lon,
            ts: Date.now()
          };
          saveStateDebounced();
        } catch {
          if (!w.cache) descEl.textContent = 'OFFLINE';
        }
      }

        } else if (val === '=') {

              calcExpr = Number.isFinite(res) ? String(Math.round(res * 1e8) / 1e8) : 'ERR';

          } else {

      function scoreFuzzyMatch(query, target) {
        const q = String(query || '').toLowerCase().trim();
        const t = String(target || '').toLowerCase().trim();
        if (!q || !t) return 0;
        if (t === q) return 100;
        if (t.startsWith(q)) return 92;

        const words = t.split(/[\s\-_./]+/).filter(Boolean);
        if (words.some(w => w.startsWith(q))) return 80;

        const initials = words.map(w => w[0]).join('');
        if (initials.length > 1 && initials.startsWith(q)) return 75;

        const subIdx = t.indexOf(q);
        if (subIdx !== -1) return Math.max(50, 70 - subIdx);

        return 0;
      }

      function tryEvaluateMathOrUnit(expr) {
        const trimmed = String(expr || '').trim();
        if (!trimmed) return null;

        const round4 = (n) => Math.round(n * 10000) / 10000;

        const pctOfMatch = trimmed.match(/^(-?\d+(?:\.\d+)?)\s*%\s*of\s*(-?\d+(?:\.\d+)?)$/i);
        if (pctOfMatch) {
          return String(round4((parseFloat(pctOfMatch[1]) / 100) * parseFloat(pctOfMatch[2])));
        }

        const baseMatch = trimmed.match(/^(0x[0-9a-f]+|0b[01]+|\d+)\s+(?:to|in)\s+(hex|dec|bin|binary|decimal)$/i);
        if (baseMatch) {
          const rawVal = baseMatch[1].toLowerCase();
          const target = baseMatch[2].toLowerCase();
          const num = rawVal.startsWith('0x')
            ? parseInt(rawVal.slice(2), 16)
            : rawVal.startsWith('0b')
            ? parseInt(rawVal.slice(2), 2)
            : parseInt(rawVal, 10);
          if (Number.isFinite(num)) {
            if (target === 'hex') return '0x' + num.toString(16).toUpperCase();
            if (target === 'bin' || target === 'binary') return '0b' + num.toString(2);
            return String(num);
          }
        }

        const unitMatch = trimmed.match(/^(-?\d+(?:\.\d+)?)\s*([a-zA-Z°]+)\s+(?:to|in)\s+([a-zA-Z°]+)$/i);
        if (unitMatch) {
          const val = parseFloat(unitMatch[1]);
          const from = unitMatch[2].toLowerCase().replace('°', '');
          const to = unitMatch[3].toLowerCase().replace('°', '');
          const round2 = (n) => Math.round(n * 100) / 100;

          if ((from === 'f' || from === 'fahrenheit') && (to === 'c' || to === 'celsius')) {
            return `${round2(((val - 32) * 5) / 9)} °C`;
          }
          if ((from === 'c' || from === 'celsius') && (to === 'f' || to === 'fahrenheit')) {
            return `${round2((val * 9) / 5 + 32)} °F`;
          }
          if ((from === 'km' || from === 'kilometers') && (to === 'mi' || to === 'miles')) {
            return `${round2(val * 0.621371)} mi`;
          }
          if ((from === 'mi' || from === 'miles') && (to === 'km' || to === 'kilometers')) {
            return `${round2(val * 1.60934)} km`;
          }
          if ((from === 'lb' || from === 'lbs') && (to === 'kg' || to === 'kilograms')) {
            return `${round2(val * 0.453592)} kg`;
          }
          if ((from === 'kg' || from === 'kilograms') && (to === 'lb' || to === 'lbs')) {
            return `${round2(val * 2.20462)} lbs`;
          }
          if ((from === 'oz' || from === 'ounces') && (to === 'g' || to === 'grams')) {
            return `${round2(val * 28.3495)} g`;
          }
          if ((from === 'g' || from === 'grams') && (to === 'oz' || to === 'ounces')) {
            return `${round2(val / 28.3495)} oz`;
          }
          if ((from === 'in' || from === 'inch' || from === 'inches') && (to === 'cm')) {
            return `${round2(val * 2.54)} cm`;
          }
          if ((from === 'cm') && (to === 'in' || to === 'inch' || to === 'inches')) {
            return `${round2(val / 2.54)} in`;
          }
          if ((from === 'ft' || from === 'feet') && (to === 'm' || to === 'meters')) {
            return `${round2(val * 0.3048)} m`;
          }
          if ((from === 'm' || from === 'meters') && (to === 'ft' || to === 'feet')) {
            return `${round2(val / 0.3048)} ft`;
          }
        }

        if (!/^[0-9+\-*/().\s%^]+$/.test(trimmed) || !/[+\-*/%^]/.test(trimmed)) return null;
        try {
          const jsExpr = trimmed.replace(/\^/g, '**');
          const res = Function('"use strict"; return (' + jsExpr + ')')();
          if (typeof res === 'number' && Number.isFinite(res)) {
            return String(Math.round(res * 1e8) / 1e8);
          }
        } catch {}
        return null;
      }

      /* Google Suggest JSONP (Natural Google autocomplete phrases, zero CORS block) */
      function fetchGoogleSuggestJSONP(query) {
        return new Promise((resolve) => {
          const cbName = `__win87_ggl_cb_${++jsonpSeq}_${Date.now()}`;
          const script = document.createElement('script');
          let settled = false;

          const cleanup = () => {
            try {
              delete window[cbName];
            } catch {
              window[cbName] = undefined;
            }
            if (script.parentNode) script.parentNode.removeChild(script);
          };

          const timer = setTimeout(() => {
            if (settled) return;
            settled = true;
            cleanup();
            resolve([]);
          }, 1100);

          window[cbName] = (data) => {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            cleanup();
            if (Array.isArray(data) && Array.isArray(data[1])) {
              const phrases = data[1]
                .map(entry => (typeof entry === 'string' ? entry : entry?.[0]))
                .filter(Boolean);
              resolve(phrases);
            } else {
              resolve([]);
            }
          };

          script.onerror = () => {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            cleanup();
            resolve([]);
          };

          script.src = `https://suggestqueries.google.com/complete/search?client=firefox&q=${encodeURIComponent(query)}&jsonp=${cbName}`;
          document.head.appendChild(script);
        });
      }

      /* Safe DuckDuckGo JSONP Autocomplete fallback */
      function fetchDDGAutocompleteJSONP(query) {
        return new Promise((resolve) => {
          const cbName = `__win87_ddg_cb_${++jsonpSeq}_${Date.now()}`;
          const script = document.createElement('script');
          let settled = false;

          const cleanup = () => {
            try {
              delete window[cbName];
            } catch {
              window[cbName] = undefined;
            }
            if (script.parentNode) script.parentNode.removeChild(script);
          };

          const timer = setTimeout(() => {
            if (settled) return;
            settled = true;
            cleanup();
            resolve([]);
          }, 1200);

          window[cbName] = (data) => {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            cleanup();
            if (Array.isArray(data)) {
              const phrases = data
                .map(entry => (typeof entry === 'string' ? entry : entry?.phrase))
                .filter(Boolean);
              resolve(phrases);
            } else {
              resolve([]);
            }
          };

          script.onerror = () => {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            cleanup();
            resolve([]);
          };

          script.src = `https://duckduckgo.com/ac/?q=${encodeURIComponent(query)}&callback=${cbName}`;
          document.head.appendChild(script);
