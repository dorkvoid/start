      /* Anti-bot Google + DuckDuckGo natural search phrase predictor */
      async function fetchPredictions(query) {
        const key = query.toLowerCase().trim();
        if (suggestionCache.has(key)) return suggestionCache.get(key);

        // Cooldown guard so rapid typing never spams external autocomplete servers
        const now = Date.now();
        if (now - lastNetworkFetchTs < 180) {
          await new Promise(r => setTimeout(r, 180 - (now - lastNetworkFetchTs)));
        }
        lastNetworkFetchTs = Date.now();

        try {
          const [googleList, ddgList] = await Promise.all([
            fetchGoogleSuggestJSONP(query),
            fetchDDGAutocompleteJSONP(query)
          ]);

          const seen = new Set([key]);
          const merged = [];

          const pushUnique = (text) => {
            const clean = String(text || '').trim();
            if (!clean) return;
            const lower = clean.toLowerCase();
            if (seen.has(lower)) return;
            seen.add(lower);
            merged.push({ text: clean, icon: '⌕' });
          };

          // Google suggestions first (most intuitive natural query ordering), then DDG
          googleList.forEach(pushUnique);
          ddgList.forEach(pushUnique);

          const finalItems = merged.slice(0, 8);
          if (finalItems.length > 0) {
            if (suggestionCache.size > 150) {
              const oldestKey = suggestionCache.keys().next().value;
              suggestionCache.delete(oldestKey);
            }
            suggestionCache.set(key, finalItems);
            persistPredictionCache();
          }
          return finalItems;
        } catch {
          return [];
        }
      }

      /* Google-style completion highlighting: normal weight for typed prefix, highlighted for the predicted tail */
      function formatGoogleStyleLabel(label, query) {
        const safeLabel = String(label || '');
        const cleanQ = String(query || '').trim();
        if (!cleanQ || cleanQ.startsWith('!')) return escapeHtml(safeLabel);

        const lowerLabel = safeLabel.toLowerCase();
        const lowerQ = cleanQ.toLowerCase();

        if (lowerLabel.startsWith(lowerQ)) {
          const typedPart = safeLabel.slice(0, cleanQ.length);
          const completedPart = safeLabel.slice(cleanQ.length);
          return `${escapeHtml(typedPart)}<span class="suggestion-completion">${escapeHtml(completedPart)}</span>`;
        }

        return escapeHtml(safeLabel);
      }

      function buildLocalImmediateSuggestions(rawQuery) {
        const q = String(rawQuery || '').trim();
        const items = [];
        const seenValues = new Set();

        if (!q) {
          if (Array.isArray(state.searchHistory) && state.searchHistory.length > 0) {
            state.searchHistory.slice(0, 6).forEach(hist => {
              items.push({
                label: hist,
                icon: '◷',
                value: hist,
                historyValue: hist
              });
            });
          }
          return items;
        }

        // 1. Instant Calculator / Unit / Currency / Base Converter (like Google's calculator row)
        const mathResult = tryEvaluateMathOrUnit(q);
        if (mathResult !== null) {
          items.push({
            label: `= ${mathResult}`,
            sublabel: 'Copy result',
            icon: '=',
            copyValue: mathResult,
            value: mathResult
          });
        }

        // 2. Direct URL / Domain detection
        if (
          /^[a-zA-Z0-9-]+(\.[a-zA-Z0-9-]+)+\.[a-zA-Z]{2,}(\/.*)?$/.test(q) &&
          !q.includes(' ')
        ) {
          const directUrl = normalizeUrl(q);
          items.push({
            label: q,
            sublabel: 'Open site',
            icon: '↗',
            url: directUrl,
            value: q
          });
        }

        // 3. Direct Subreddit shortcut (e.g. r/firefox)
        const subMatch = q.match(/^\/?r\/([a-zA-Z0-9_]+)(?:\/(.*))?$/i);
        if (subMatch) {
          const subName = subMatch[1];
          const subRest = subMatch[2] ? `/${subMatch[2]}` : '';
          const subUrl = `https://www.reddit.com/r/${subName}${subRest}`;
          items.push({
            label: `r/${subName}${subRest}`,
            sublabel: 'reddit.com',
            icon: '↗',
            url: subUrl,
            value: q
          });
        }

        // 4. Bang Shortcut Autocomplete
        const firstWord = q.split(/\s+/)[0].toLowerCase();
        if (BANG_SHORTCUTS[firstWord]) {
          const rest = q.slice(firstWord.length).trim();
          items.push({
            label: rest
              ? `${BANG_SHORTCUTS[firstWord].name}: ${rest}`
              : `Open ${BANG_SHORTCUTS[firstWord].name}`,
            sublabel: firstWord,
            icon: '⌕',
            value: q
          });
        } else if (q.startsWith('!') && !q.includes(' ')) {
          Object.entries(BANG_SHORTCUTS)
            .filter(([code, meta]) =>
              code.startsWith(firstWord) ||
              meta.name.toLowerCase().includes(firstWord.slice(1))
            )
            .slice(0, 5)
            .forEach(([code, meta]) => {
              items.push({
                label: `${code}  ${meta.name}`,
                icon: '⌕',
                fillPrefix: `${code} `,
                value: `${code} `
              });
            });
        }

        // 5. Recent Search History Prefix/Fuzzy Matches (shown right at the top like Google)
        if (Array.isArray(state.searchHistory) && !q.startsWith('!')) {
          state.searchHistory
            .map(h => ({ text: h, score: scoreFuzzyMatch(q, h) }))
            .filter(entry => entry.score >= 70 && !seenValues.has(entry.text.toLowerCase()))
            .sort((a, b) => b.score - a.score)
            .slice(0, 2)
            .forEach(({ text }) => {
              seenValues.add(text.toLowerCase());
              items.push({
                label: text,
                icon: '◷',
                value: text,
                historyValue: text
              });
            });
        }

        // 6. Saved Quicklinks Matches
        const scoredLinks = state.quicklinks
          .map(item => {
            const host = getCachedHostname(item.url);
            const sTitle = scoreFuzzyMatch(q, item.title);
            const sHost = scoreFuzzyMatch(q, host) * 0.95;
            return { item, host, score: Math.max(sTitle, sHost) };
          })
          .filter(entry => entry.score >= 65)
          .sort((a, b) => b.score - a.score)
          .slice(0, 2);

        scoredLinks.forEach(({ item, host }) => {
          items.push({
            label: item.title,
            sublabel: host || item.url,
            icon: '↗',
            url: item.url,
            value: item.title
          });
          seenValues.add(item.title.toLowerCase());
        });

        return items;
      }

      function renderSuggestions(items, highlightQuery = '') {
        const box = document.getElementById('search-suggestions');
        const searchInput = document.getElementById('search-input');
        currentSuggestions = items;
        selectedIdx = -1;

        if (!items.length) {
          box.classList.add('hidden');
          box.replaceChildren();
          updateGhostText('', '');
          return;
        }

        // Compute inline ghost completion from the first prefix-matching suggestion
        const rawTyped = searchInput ? searchInput.value : '';
        if (rawTyped && !rawTyped.startsWith('!')) {
          const prefixCandidate = items.find(
            it =>
              it.value &&
              !it.copyValue &&
              it.value.toLowerCase().startsWith(rawTyped.toLowerCase()) &&
              it.value.length > rawTyped.length
          );
          updateGhostText(rawTyped, prefixCandidate ? prefixCandidate.value : '');
        } else {
          updateGhostText('', '');
        }

        const fragment = document.createDocumentFragment();
        items.forEach((item, idx) => {
          const row = document.createElement('div');
          row.setAttribute('data-sug-idx', String(idx));
          row.className =
            'suggestion-row w-full text-left px-3 py-2 flex items-center justify-between gap-2.5 cursor-pointer';

          const leftWrap = document.createElement('div');
          leftWrap.className = 'flex items-center gap-2.5 min-w-0 flex-1';

          const iconSpan = document.createElement('span');
          iconSpan.className = 'suggestion-icon';
          iconSpan.textContent = item.icon || '⌕';
          leftWrap.appendChild(iconSpan);

          const labelSpan = document.createElement('span');
          labelSpan.className = 'truncate flex-1';
          labelSpan.innerHTML = formatGoogleStyleLabel(item.label, highlightQuery);
          leftWrap.appendChild(labelSpan);

          row.appendChild(leftWrap);

          const rightWrap = document.createElement('div');
          rightWrap.className = 'flex items-center gap-1.5 shrink-0';

          if (item.sublabel) {
            const subSpan = document.createElement('span');
            subSpan.className = 'text-[var(--text-secondary)] truncate max-w-[160px]';
            subSpan.textContent = item.sublabel;
            rightWrap.appendChild(subSpan);
          }

          if (item.historyValue) {
            const delHistBtn = document.createElement('button');
            delHistBtn.type = 'button';
            delHistBtn.className = 'suggestion-mini-btn text-red-700';
            delHistBtn.textContent = '×';
            delHistBtn.addEventListener('click', (e) => {
              e.stopPropagation();
              removeSearchHistoryItem(item.historyValue);
              const nextItems = currentSuggestions.filter((_, i) => i !== idx);
              renderSuggestions(nextItems, highlightQuery);
            });
            rightWrap.appendChild(delHistBtn);
          }

          if (rightWrap.childNodes.length > 0) {
            row.appendChild(rightWrap);
          }

          row.addEventListener('mousedown', (e) => {
            // Prevent input blur before click handler fires
            e.preventDefault();
          });

          row.addEventListener('click', (e) => {
            const forceNewTab = e.ctrlKey || e.metaKey || e.altKey;
            if (item.copyValue) {
              const temp = document.getElementById('search-input');
              temp.value = item.copyValue;
              updateGhostText('', '');
              temp.select();
              document.execCommand('copy');
              saveState('COPIED ✓');
              box.classList.add('hidden');
            } else if (item.fillPrefix) {
              const temp = document.getElementById('search-input');
              temp.value = item.fillPrefix;
              originalTypedQuery = temp.value;
              temp.focus();
              temp.dispatchEvent(new Event('input'));
            } else if (item.url) {
              navigateTo(item.url, forceNewTab);
            } else {
              runSearch(item.value, forceNewTab);
            }
          });
          fragment.appendChild(row);
        });

        box.replaceChildren(fragment);
        box.classList.remove('hidden');
      }

      function highlightSuggestionRow(index) {
        const box = document.getElementById('search-suggestions');
        if (!box) return;
        const rows = box.querySelectorAll('.suggestion-row');
        rows.forEach((row, i) => {
          const active = i === index;
          row.classList.toggle('is-highlighted', active);
          if (active) {
            row.scrollIntoView({ block: 'nearest' });
          }
        });
      }

      function navigateTo(url, forceNewTab = false) {
        if (state.openInNewTab || forceNewTab) {
          window.open(url, '_blank', 'noopener,noreferrer');
        } else {
          window.location.href = url;
        }
      }

      function runSearch(raw, forceNewTab = false) {
        const q = (raw || '').trim();
        if (!q) return;

        // Direct subreddit shortcut: r/subreddit
        const subMatch = q.match(/^\/?r\/([a-zA-Z0-9_]+)(?:\/(.*))?$/i);
        if (subMatch) {
          const subRest = subMatch[2] ? `/${subMatch[2]}` : '';
          navigateTo(`https://www.reddit.com/r/${subMatch[1]}${subRest}`, forceNewTab);
          return;
        }

        // Check !bang shortcuts (e.g. "!yt synthwave", "!gh", "!r firefox")
        const parts = q.split(/\s+/);
        const bangKey = parts[0].toLowerCase();
        if (BANG_SHORTCUTS[bangKey]) {
          const rest = parts.slice(1).join(' ');
          if (!rest) {
            const origin = new URL(BANG_SHORTCUTS[bangKey].url).origin;
            navigateTo(origin, forceNewTab);
          } else {
            recordSearchHistory(q);
            navigateTo(BANG_SHORTCUTS[bangKey].url + encodeURIComponent(rest), forceNewTab);
          }
          return;
        }

        // Direct protocol or localhost/IP/domain detection
        if (/^(https?:\/\/)/i.test(q)) {
          navigateTo(q, forceNewTab);
          return;
        }

        if (/^(localhost(:\d+)?(\/.*)?|\d{1,3}(\.\d{1,3}){3}(:\d+)?(\/.*)?)$/i.test(q)) {
          navigateTo(`http://${q}`, forceNewTab);
          return;
        }

        if (/^[a-zA-Z0-9-]+(\.[a-zA-Z0-9-]+)*\.[a-zA-Z]{2,}(:\d+)?(\/.*)?$/.test(q) && !q.includes(' ')) {
          navigateTo(`https://${q}`, forceNewTab);
          return;
        }

        recordSearchHistory(q);
        const engine = SEARCH_ENGINES[state.searchEngine] || SEARCH_ENGINES.ddg;
        navigateTo(engine.url + encodeURIComponent(q), forceNewTab);
      }

      function cycleSearchEngine(direction = 1) {
        const curIdx = ENGINE_ORDER.indexOf(state.searchEngine);
        const nextIdx = (curIdx + direction + ENGINE_ORDER.length) % ENGINE_ORDER.length;
        state.searchEngine = ENGINE_ORDER[nextIdx];
        saveState(`ENGINE: ${SEARCH_ENGINES[state.searchEngine].code}`);
        applyPreferencesToDOM();
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function bindEvents() {
        const settingsBtn = document.getElementById('settings-dropdown-btn');
        const settingsPanel = document.getElementById('settings-dropdown-panel');

        // Clicking empty desktop background returns active focus to Search
        document.getElementById('desktop-canvas').addEventListener('pointerdown', (e) => {
          if (e.target.id === 'desktop-canvas') {
            if (document.activeElement && document.activeElement !== document.body) {
              document.activeElement.blur();
            }
            bringWindowToFront(document.getElementById('win-search'));
          }
        });

        // Global Keyboard Shortcuts & Instinctive Type-to-Search
        document.addEventListener('keydown', (e) => {
          const activeEl = document.activeElement;
          const activeTag = activeEl ? activeEl.tagName : '';
          const isEditableInput =
            activeTag === 'TEXTAREA' ||
            activeTag === 'SELECT' ||
            (activeEl && activeEl.isContentEditable) ||
            (activeTag === 'INPUT' && !activeEl.readOnly && !activeEl.disabled &&
              !['button', 'checkbox', 'radio', 'submit', 'reset', 'file'].includes((activeEl.type || 'text').toLowerCase()));

          if (e.key === 'Escape') {
            const searchInputEl = document.getElementById('search-input');
            const sugBox = document.getElementById('search-suggestions');
            if (activeEl === searchInputEl) {
              if (sugBox && !sugBox.classList.contains('hidden')) {
                e.preventDefault();
                sugBox.classList.add('hidden');
                if (selectedIdx !== -1 && originalTypedQuery) {
                  searchInputEl.value = originalTypedQuery;
                  selectedIdx = -1;
                }
                updateGhostText('', '');
                return;
              }
              if (searchInputEl.value.length > 0) {
                e.preventDefault();
                if (debounceTimer) clearTimeout(debounceTimer);
                searchInputEl.value = '';
                originalTypedQuery = '';
                updateGhostText('', '');
                const clearBtn = document.getElementById('search-clear-btn');
                if (clearBtn) clearBtn.classList.add('hidden');
                renderSuggestions([]);
                return;
              }
            }

            settingsPanel.classList.add('hidden');
            if (sugBox) sugBox.classList.add('hidden');
            document.getElementById('popup-link-editor').classList.add('hidden');
            document.getElementById('popup-backup').classList.add('hidden');
            if (isEditableInput && activeEl) {
              activeEl.blur();
            }
            return;
          }

          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            const searchInputEl = document.getElementById('search-input');
            bringWindowToFront(document.getElementById('win-search'));
            searchInputEl.focus();
            searchInputEl.select();
            return;
          }

          // Do not hijack typing if user is inside any input/textarea (Sticky, Calendar note, Group rename, Modals, etc.)
          if (isEditableInput) return;

          // Do not hijack if a popup modal or settings dropdown is open
          const linkPopupOpen = !document.getElementById('popup-link-editor').classList.contains('hidden');
          const backupPopupOpen = !document.getElementById('popup-backup').classList.contains('hidden');
          const settingsOpen = !settingsPanel.classList.contains('hidden');
          if (linkPopupOpen || backupPopupOpen || settingsOpen) return;

          // If Calculator is the active window, route calculator keys to Calc instead of Search
          const isInsideProtectedWidget =
            (activeEl && activeEl.closest('#win-calc, #win-calendar, .sticky-widget')) ||
            (activeWindowEl && (
              activeWindowEl.id === 'win-calc' ||
              activeWindowEl.id === 'win-calendar' ||
              activeWindowEl.classList.contains('sticky-widget')
            ));

          if (activeWindowEl && activeWindowEl.id === 'win-calc') {
            if (/^[0-9.+\-*/]$/.test(e.key)) {
              e.preventDefault();
              handleCalcInput(e.key);
              return;
            }
            if (e.key === 'Enter' || e.key === '=') {
              e.preventDefault();
              handleCalcInput('=');
              return;
            }
            if (e.key === 'Backspace') {
              e.preventDefault();
              handleCalcInput('BACK');
              return;
            }
            if (e.key.toLowerCase() === 'c') {
              e.preventDefault();
              handleCalcInput('C');
              return;
            }
          }

          if (isInsideProtectedWidget) return;

          const searchInputEl = document.getElementById('search-input');
          if (!searchInputEl) return;

          if (e.key === '/' && state.slashFocusSearch !== false && !e.ctrlKey && !e.metaKey && !e.altKey) {
            e.preventDefault();
            bringWindowToFront(document.getElementById('win-search'));
            searchInputEl.focus();
            searchInputEl.select();
            return;
          }

          // Instinctive type-to-search: any printable character focuses the search bar and types into it
          if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
            e.preventDefault();
            bringWindowToFront(document.getElementById('win-search'));
            searchInputEl.focus();
            const start = searchInputEl.selectionStart ?? searchInputEl.value.length;
            const end = searchInputEl.selectionEnd ?? searchInputEl.value.length;
            searchInputEl.value = searchInputEl.value.slice(0, start) + e.key + searchInputEl.value.slice(end);
            const nextPos = start + e.key.length;
            searchInputEl.setSelectionRange(nextPos, nextPos);
            searchInputEl.dispatchEvent(new Event('input'));
          } else if (e.key === 'Backspace' && searchInputEl.value.length > 0 && !e.ctrlKey && !e.metaKey && !e.altKey) {
            e.preventDefault();
            bringWindowToFront(document.getElementById('win-search'));
            searchInputEl.focus();
            searchInputEl.value = searchInputEl.value.slice(0, -1);
            searchInputEl.setSelectionRange(searchInputEl.value.length, searchInputEl.value.length);
            searchInputEl.dispatchEvent(new Event('input'));
          }
        });

        // Cross-tab synchronization so changes in another startpage tab sync cleanly
        window.addEventListener('storage', (e) => {
          if (e.key === STORAGE_KEY && e.newValue) {
            state = loadState();
            applyPreferencesToDOM();
            restoreWindowPositions();
            renderQuicklinks();
            renderCalendar();
            renderStickyNotes();
            fetchWeather(false);
          }
        });

        settingsBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          settingsPanel.classList.toggle('hidden');
        });

        document.addEventListener('click', (e) => {
          if (!e.target.closest('#settings-menu-container')) {
            settingsPanel.classList.add('hidden');
          }
          if (!e.target.closest('#search-form')) {
            document.getElementById('search-suggestions').classList.add('hidden');
          }
        });

        document.getElementById('quick-theme-select').addEventListener('change', (e) => {
          state.theme = e.target.value;
          saveState();
          applyPreferencesToDOM();
        });

        document.getElementById('quick-font-select').addEventListener('change', (e) => {
          state.fontStyle = e.target.value;
          saveState();
          applyPreferencesToDOM();
        });

        document.getElementById('quick-engine-select').addEventListener('change', (e) => {
          state.searchEngine = e.target.value;
          saveState();
          applyPreferencesToDOM();
        });

        // Click Search Engine Badge to quickly cycle search engines
        document.getElementById('search-engine-badge').addEventListener('click', () => {
          cycleSearchEngine(1);
        });

        const toggleGrid = (enabled) => {
          state.snapToGrid = enabled;
          if (enabled) snapAllWindowsToGrid();
          else saveState();
          applyPreferencesToDOM();
        };

        document.getElementById('topbar-grid-toggle-btn').addEventListener('click', () => {
          toggleGrid(!state.snapToGrid);
        });

        document.getElementById('toggle-snap-grid').addEventListener('change', (e) => {
          toggleGrid(e.target.checked);
        });

        document.getElementById('toggle-24h').addEventListener('change', (e) => {
          state.clock24h = e.target.checked;
          saveState();
          updateClock();
        });

        // 1-Click Clock Time Toggle (12H / 24H) & Date Jump to Calendar Today
        document.getElementById('clock-time-toggle-btn').addEventListener('click', () => {
          state.clock24h = !state.clock24h;
          document.getElementById('toggle-24h').checked = state.clock24h;
          saveState(state.clock24h ? '24H CLOCK ✓' : '12H CLOCK ✓');
          updateClock();
        });

        // Search Input with Clear (X) Button, Inline Ghost Typeahead & Google Suggest JSONP
        const searchInput = document.getElementById('search-input');

        const syncSearchClearBtn = () => {
          if (searchClearBtn) {

        if (searchClearBtn) {
          searchClearBtn.addEventListener('click', () => {

          });
        }

        const mergeLocalAndRemoteSuggestions = (immediateList, remoteList, q) => {
          const existingLower = new Set(immediateList.map(i => (i.value || i.label).toLowerCase()));
          const remoteItems = remoteList
            .filter(r => !existingLower.has(r.text.toLowerCase()))
            .map(r => ({ label: r.text, icon: r.icon || '⌕', value: r.text }));

          // Sort remote items so prefix matches of what the user typed come first (Google behavior)
          const lowerQ = q.toLowerCase();
          remoteItems.sort((a, b) => {
            const aStarts = a.value.toLowerCase().startsWith(lowerQ) ? 1 : 0;
            const bStarts = b.value.toLowerCase().startsWith(lowerQ) ? 1 : 0;
            return bStarts - aStarts;
          });

          return [...immediateList, ...remoteItems].slice(0, 8);
        };

        const updateSearchSuggestions = () => {
          if (debounceTimer) clearTimeout(debounceTimer);
          syncSearchClearBtn();
          const q = searchInput.value.trim();
          originalTypedQuery = searchInput.value;

          if (!q) {
            updateGhostText('', '');
            const recentList = buildLocalImmediateSuggestions('');
            renderSuggestions(recentList, '');
            return;
          }

          const immediateList = buildLocalImmediateSuggestions(q);
          const cacheKey = q.toLowerCase();

          // Instant 0ms display if already cached in session
          if (suggestionCache.has(cacheKey) && !q.startsWith('!')) {
            const cachedRemote = suggestionCache.get(cacheKey);
            renderSuggestions(mergeLocalAndRemoteSuggestions(immediateList, cachedRemote, q), q);
            return;
          }

          // Otherwise show local matches + best cached prefix match immediately while network resolves
          let fallbackRemote = [];
          if (!q.startsWith('!') && cacheKey.length >= 2) {
            for (let len = cacheKey.length - 1; len >= 1; len--) {
              const subKey = cacheKey.slice(0, len);
              if (suggestionCache.has(subKey)) {
                fallbackRemote = suggestionCache
                  .get(subKey)
                  .filter(r => r.text.toLowerCase().startsWith(cacheKey));
                if (fallbackRemote.length) break;
              }
            }
          }

          renderSuggestions(mergeLocalAndRemoteSuggestions(immediateList, fallbackRemote, q), q);

          if (q.length >= 1 && !q.startsWith('!') && tryEvaluateMathOrUnit(q) === null) {
            debounceTimer = setTimeout(async () => {
              const remote = await fetchPredictions(q);
              if (searchInput.value.trim() !== q || selectedIdx !== -1) return;
              renderSuggestions(mergeLocalAndRemoteSuggestions(immediateList, remote, q), q);
            }, 160);
          }
        };

        searchInput.addEventListener('input', updateSearchSuggestions);

        searchInput.addEventListener('focus', () => {

        searchInput.addEventListener('keydown', (e) => {
          const box = document.getElementById('search-suggestions');

          // Press Tab or Right Arrow at the end of input to accept inline ghost completion
          if (
            (e.key === 'Tab' || (e.key === 'ArrowRight' && searchInput.selectionStart === searchInput.value.length)) &&
            !e.altKey &&
            !e.ctrlKey &&
            !e.metaKey

            if (e.key === 'ArrowRight' && currentGhostCompletion && selectedIdx === -1) {

              updateGhostText('', '');

              return;

            if (e.key === 'Tab' && !box.classList.contains('hidden') && currentSuggestions.length > 0) {
              e.preventDefault();
              if (selectedIdx === -1 && currentGhostCompletion && !e.shiftKey) {
                searchInput.value = currentGhostCompletion;
                originalTypedQuery = searchInput.value;
                updateGhostText('', '');
                syncSearchClearBtn();
                updateSearchSuggestions();
                return;
              }
              if (selectedIdx === -1) {
                originalTypedQuery = searchInput.value;
                selectedIdx = e.shiftKey ? currentSuggestions.length - 1 : 0;
              } else {
                selectedIdx = (selectedIdx + (e.shiftKey ? -1 : 1) + currentSuggestions.length) % currentSuggestions.length;

              highlightSuggestionRow(selectedIdx);
              const chosen = currentSuggestions[selectedIdx];
              if (chosen) {
                const fillText = chosen.fillPrefix || chosen.copyValue || chosen.value || '';
                if (fillText) {
                  updateGhostText('', '');
                  searchInput.value = fillText;
                  syncSearchClearBtn();
                }
              }
              return;
            }
          }

          // Alt+Enter or Ctrl/Cmd+Enter forces opening search in a new tab
          if (e.key === 'Enter' && (e.altKey || e.ctrlKey || e.metaKey)) {

          if (box.classList.contains('hidden') || !currentSuggestions.length) return;

          if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (selectedIdx === -1) {
              originalTypedQuery = searchInput.value;
            }
            selectedIdx = selectedIdx + 1;
            if (selectedIdx >= currentSuggestions.length) {

              searchInput.value = originalTypedQuery;
              syncSearchClearBtn();
              return;
            }
            highlightSuggestionRow(selectedIdx);
            const cur = currentSuggestions[selectedIdx];
            if (!cur.copyValue && !cur.url) {
              updateGhostText('', '');
              searchInput.value = cur.value;
              syncSearchClearBtn();
            }
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            if (selectedIdx === -1) {
              originalTypedQuery = searchInput.value;

            if (selectedIdx === -1) {

              searchInput.value = originalTypedQuery;
              syncSearchClearBtn();
              return;

            highlightSuggestionRow(selectedIdx);
            const cur = currentSuggestions[selectedIdx];
            if (!cur.copyValue && !cur.url) {
              updateGhostText('', '');
              searchInput.value = cur.value;
              syncSearchClearBtn();
            }

        const handleUniversalImport = (rawText, mode) => {
          try {
            const parsed = JSON.parse(rawText);
            const extracted = extractQuicklinksFromAnyJSON(parsed);

            // If user clicked "Replace All / Full Restore" and it's a full WIN/87 backup
            if (
              mode === 'replace' &&
              parsed &&
              typeof parsed === 'object' &&
              !Array.isArray(parsed) &&
              (parsed.windowPositions || parsed.theme || parsed.stickyNotes)
            ) {
              state = {
                ...JSON.parse(JSON.stringify(DEFAULT_STATE)),
                ...parsed,
                quicklinks: extracted.links.length ? extracted.links : (parsed.quicklinks || []),
                groups: normalizeGroups(
                  [...(parsed.groups || []), ...extracted.groups],
                  extracted.links.length ? extracted.links : (parsed.quicklinks || [])
                ),
                stickyNotes: normalizeStickyNotes(parsed.stickyNotes)
              };
              saveState('FULL RESTORE ✓');
              applyPreferencesToDOM();
              restoreWindowPositions();
              renderQuicklinks();
              renderStickyNotes();
              renderCalendar();
              updateClock();
              fetchWeather();
              showImportMessage(`Restored full workspace (${state.quicklinks.length} links).`);
              return;
            }

            if (!extracted.links.length) {
              showImportMessage('No quicklinks found in that JSON. Make sure it contains URLs.');
              return;
            }

            if (mode === 'replace') {
              state.quicklinks = extracted.links;
              state.groups = normalizeGroups(extracted.groups, extracted.links);
            } else {
              // Merge without duplicating identical URLs in the same group
              let addedCount = 0;
              extracted.groups.forEach(g => {
                if (!state.groups.some(x => x.toLowerCase() === g.toLowerCase())) {
                  state.groups.push(g);
                }
              });
              extracted.links.forEach(item => {
                const exists = state.quicklinks.some(
                  q => q.url.toLowerCase() === item.url.toLowerCase()
                );
                if (!exists) {
                  state.quicklinks.push(item);
                  addedCount++;
                }
              });
              state.groups = normalizeGroups(state.groups, state.quicklinks);
              saveState(`IMPORTED ${addedCount} LINKS ✓`);
              renderQuicklinks();
              showImportMessage(
                `Imported ${addedCount} new quicklinks across ${extracted.groups.length || 1} group(s)!`
              );
              return;
            }

            saveState(`IMPORTED ${extracted.links.length} LINKS ✓`);
            renderQuicklinks();
            showImportMessage(`Loaded ${extracted.links.length} quicklinks!`);
          } catch {
            showImportMessage('Invalid JSON format. Please check your file or pasted text.');
          }
        };

        document.getElementById('import-json-file-input').addEventListener('change', (e) => {
          const file = e.target.files && e.target.files[0];

          handleUniversalImport(document.getElementById('backup-json-textarea').value, 'replace');
        });

        document.getElementById('export-json-btn').addEventListener('click', () => {
          const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'win87-backup.json';
          a.click();
          URL.revokeObjectURL(url);
        });

        document.getElementById('copy-json-btn').addEventListener('click', () => {
          const ta = document.getElementById('backup-json-textarea');
          ta.value = JSON.stringify(state, null, 2);
          ta.select();
          document.execCommand('copy');
          showImportMessage('Current startpage JSON copied to clipboard.');
        });
      }

      function init() {
        applyPreferencesToDOM();
        restoreWindowPositions();
        initDraggableWindows();
        renderQuicklinks();
        renderCalendar();
        renderStickyNotes();
        fetchWeather();
        updateClock();
        setInterval(updateClock, 1000);
        bindEvents();

        const searchInputEl = document.getElementById('search-input');
        if (searchInputEl) {
          searchInputEl.focus({ preventScroll: true });
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
