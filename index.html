      function renderWeatherData(currentTemp, code, wind, hi, lo, unit) {
        const tempEl = document.getElementById('weather-temp');
        const descEl = document.getElementById('weather-desc');
        const hiLowEl = document.getElementById('weather-hilow');
        const windEl = document.getElementById('weather-wind');
        if (!tempEl) return;

        const unitSymbol = unit === 'celsius' ? '°C' : '°F';
        const windUnit = unit === 'celsius' ? 'km/h' : 'mph';

        tempEl.textContent = `${currentTemp}${unitSymbol}`;
        descEl.textContent = WMO_CODES[code] || 'FAIR';
        hiLowEl.textContent = `H: ${hi}°  L: ${lo}°`;
        windEl.textContent = `WIND: ${wind} ${windUnit}`;
      }

      async function fetchWeather(forceRefresh = false) {
        const locLabel = document.getElementById('weather-location-label');
        const tempEl = document.getElementById('weather-temp');
        const descEl = document.getElementById('weather-desc');
        if (!tempEl) return;

        const w = state.weather || DEFAULT_STATE.weather;
        locLabel.textContent = (w.city || 'RICHARDSON, TX').toUpperCase();

        // Render cached weather immediately (0ms) so opening a new tab is instantaneous
        const cache = w.cache;
        const CACHE_TTL_MS = 15 * 60 * 1000;
        if (
          cache &&
          cache.unit === w.unit &&
          cache.lat === w.lat &&
          cache.lon === w.lon &&
          typeof cache.currentTemp === 'number'
        ) {
          renderWeatherData(cache.currentTemp, cache.code, cache.wind, cache.hi, cache.lo, w.unit);
          if (!forceRefresh && Date.now() - (cache.ts || 0) < CACHE_TTL_MS) {
            return;
          }
        }

        try {
          const url = `https://api.open-meteo.com/v1/forecast?latitude=${encodeURIComponent(
            w.lat
          )}&longitude=${encodeURIComponent(
            w.lon
          )}&current=temperature_2m,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min&temperature_unit=${
            w.unit === 'celsius' ? 'celsius' : 'fahrenheit'
          }&wind_speed_unit=${w.unit === 'celsius' ? 'kmh' : 'mph'}&timezone=auto`;

          const res = await fetch(url);
          if (!res.ok) throw new Error('Weather fetch failed');
          const data = await res.json();

          const currentTemp = Math.round(data.current?.temperature_2m ?? 0);
          const code = data.current?.weather_code ?? 0;
          const wind = Math.round(data.current?.wind_speed_10m ?? 0);
          const hi = Math.round(data.daily?.temperature_2m_max?.[0] ?? currentTemp);
          const lo = Math.round(data.daily?.temperature_2m_min?.[0] ?? currentTemp);

          renderWeatherData(currentTemp, code, wind, hi, lo, w.unit);
          state.weather.cache = {
            currentTemp,
            code,
            wind,
            hi,
            lo,
            unit: w.unit,
            lat: w.lat,
            lon: w.lon,
            ts: Date.now()
          };
          saveStateDebounced();
        } catch {
          if (!w.cache) descEl.textContent = 'OFFLINE';
        }
      }

      async function updateWeatherCity(cityQuery) {
        const clean = String(cityQuery || '').trim();
        if (!clean) return;
        const descEl = document.getElementById('weather-desc');
        if (descEl) descEl.textContent = 'SEARCHING...';

        try {
          const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(
            clean
          )}&count=1&language=en&format=json`;
          const res = await fetch(url);
          const data = await res.json();
          if (data.results && data.results.length > 0) {
            const place = data.results[0];
            const region = place.admin1 ? `, ${place.admin1}` : (place.country_code ? `, ${place.country_code}` : '');
            state.weather.city = `${place.name}${region}`;
            state.weather.lat = place.latitude;
            state.weather.lon = place.longitude;
            state.weather.cache = null;
            document.getElementById('weather-city-input').value = state.weather.city;
            saveState('CITY SAVED ✓');
            fetchWeather(true);
          } else if (descEl) {
            descEl.textContent = 'CITY NOT FOUND';
          }
        } catch {
          if (descEl) descEl.textContent = 'LOOKUP ERR';
        }
      }

      /* Calculator Logic */
      function handleCalcInput(token) {
        const display = document.getElementById('calc-display');
        if (!display) return;

        if (token === 'C') {
          calcExpr = '0';
        } else if (token === 'BACK') {
          calcExpr = calcExpr.length > 1 ? calcExpr.slice(0, -1) : '0';
        } else if (token === '=') {
          try {
            const sanitized = calcExpr.replace(/[^0-9+\-*/.()]/g, '');
            const result = Function('"use strict"; return (' + (sanitized || '0') + ')')();
            calcExpr = Number.isFinite(result) ? String(Math.round(result * 1e8) / 1e8) : 'ERR';
          } catch {
            calcExpr = 'ERR';
          }
        } else {
          if (calcExpr === '0' || calcExpr === 'ERR') {
            calcExpr = /^[+\-*/]$/.test(token) ? '0' + token : token;
          } else {
            calcExpr += token;
          }
        }
        display.value = calcExpr;
      }

      /* Safe Anti-Bot Debounced Predictive Search (450ms pause + cache) */
      const suggestionCache = new Map();
      let debounceTimer = null;
      let activeController = null;
      let currentSuggestions = [];
      let selectedIdx = -1;

      function tryEvaluateMathOrUnit(expr) {
        const trimmed = String(expr || '').trim();
        if (!trimmed) return null;

        const round4 = (n) => Math.round(n * 10000) / 10000;

        // 1. Percentage expression: "15% of 240"
        const pctOfMatch = trimmed.match(/^(-?\d+(?:\.\d+)?)\s*%\s*of\s*(-?\d+(?:\.\d+)?)$/i);
        if (pctOfMatch) {
          return String(round4((parseFloat(pctOfMatch[1]) / 100) * parseFloat(pctOfMatch[2])));
        }

        // 2. Hex / Binary / Decimal quick conversions: "255 to hex", "0xff to dec", "42 to bin"
        const baseMatch = trimmed.match(/^(0x[0-9a-f]+|0b[01]+|\d+)\s+(?:to|in)\s+(hex|dec|bin|binary|decimal)$/i);
        if (baseMatch) {
          const rawVal = baseMatch[1].toLowerCase();
          const target = baseMatch[2].toLowerCase();
          const num = rawVal.startsWith('0x')
            ? parseInt(rawVal.slice(2), 16)
            : rawVal.startsWith('0b')
            ? parseInt(rawVal.slice(2), 2)
            : parseInt(rawVal, 10);
          if (Number.isFinite(num)) {
            if (target === 'hex') return '0x' + num.toString(16).toUpperCase();
            if (target === 'bin' || target === 'binary') return '0b' + num.toString(2);
            return String(num);
          }
        }

        // 3. Quick unit conversions (temp, distance, weight, length, volume)
        const unitMatch = trimmed.match(/^(-?\d+(?:\.\d+)?)\s*([a-zA-Z°]+)\s+(?:to|in)\s+([a-zA-Z°]+)$/i);
        if (unitMatch) {
          const val = parseFloat(unitMatch[1]);
          const from = unitMatch[2].toLowerCase().replace('°', '');
          const to = unitMatch[3].toLowerCase().replace('°', '');
          const round2 = (n) => Math.round(n * 100) / 100;

          if ((from === 'f' || from === 'fahrenheit') && (to === 'c' || to === 'celsius')) {
            return `${round2(((val - 32) * 5) / 9)} °C`;
          }
          if ((from === 'c' || from === 'celsius') && (to === 'f' || to === 'fahrenheit')) {
            return `${round2((val * 9) / 5 + 32)} °F`;
          }
          if ((from === 'km' || from === 'kilometers') && (to === 'mi' || to === 'miles')) {
            return `${round2(val * 0.621371)} mi`;
          }
          if ((from === 'mi' || from === 'miles') && (to === 'km' || to === 'kilometers')) {
            return `${round2(val * 1.60934)} km`;
          }
          if ((from === 'lb' || from === 'lbs') && (to === 'kg' || to === 'kilograms')) {
            return `${round2(val * 0.453592)} kg`;
          }
          if ((from === 'kg' || from === 'kilograms') && (to === 'lb' || to === 'lbs')) {
            return `${round2(val * 2.20462)} lbs`;
          }
          if ((from === 'oz' || from === 'ounces') && (to === 'g' || to === 'grams')) {
            return `${round2(val * 28.3495)} g`;
          }
          if ((from === 'g' || from === 'grams') && (to === 'oz' || to === 'ounces')) {
            return `${round2(val / 28.3495)} oz`;
          }
          if ((from === 'in' || from === 'inch' || from === 'inches') && (to === 'cm')) {
            return `${round2(val * 2.54)} cm`;
          }
          if ((from === 'cm') && (to === 'in' || to === 'inch' || to === 'inches')) {
            return `${round2(val / 2.54)} in`;
          }
          if ((from === 'ft' || from === 'feet') && (to === 'm' || to === 'meters')) {
            return `${round2(val * 0.3048)} m`;
          }
          if ((from === 'm' || from === 'meters') && (to === 'ft' || to === 'feet')) {
            return `${round2(val / 0.3048)} ft`;
          }
        }

        // 4. Standard math expressions (supports +, -, *, /, %, ^)
        if (!/^[0-9+\-*/().\s%^]+$/.test(trimmed) || !/[+\-*/%^]/.test(trimmed)) return null;
        try {
          const jsExpr = trimmed.replace(/\^/g, '**');
          const res = Function('"use strict"; return (' + jsExpr + ')')();
          if (typeof res === 'number' && Number.isFinite(res)) {
            return String(Math.round(res * 1e8) / 1e8);
          }
        } catch {}
        return null;
      }

      async function fetchPredictions(query) {
        const key = query.toLowerCase().trim();
        if (suggestionCache.has(key)) return suggestionCache.get(key);

        if (activeController) activeController.abort();
        activeController = new AbortController();

        try {
          const url = `https://en.wikipedia.org/w/api.php?action=opensearch&search=${encodeURIComponent(
            query
          )}&limit=5&namespace=0&format=json&origin=*`;
          const res = await fetch(url, { signal: activeController.signal });
          if (!res.ok) return [];
          const data = await res.json();
          const list = Array.isArray(data[1]) ? data[1] : [];
          if (suggestionCache.size > 100) {
            const oldestKey = suggestionCache.keys().next().value;
            suggestionCache.delete(oldestKey);
          }
          suggestionCache.set(key, list);
          return list;
        } catch {
          return [];
        }
      }

      function renderSuggestions(items) {
        const box = document.getElementById('search-suggestions');
        currentSuggestions = items;
        selectedIdx = -1;

        if (!items.length) {
          box.classList.add('hidden');
          box.replaceChildren();
          return;
        }

        const fragment = document.createDocumentFragment();
        items.forEach((item, idx) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.setAttribute('data-sug-idx', String(idx));
          btn.className = 'suggestion-row w-full text-left px-3 py-2 flex items-center justify-between hover:bg-[var(--accent-soft)]';
          btn.innerHTML = `
            <span class="truncate">${escapeHtml(item.label)}</span>
            <span class="text-[var(--text-secondary)] ml-2 shrink-0">${escapeHtml(item.tag)}</span>
          `;
          btn.addEventListener('click', (e) => {
            const forceNewTab = e.ctrlKey || e.metaKey || e.altKey;
            if (item.copyValue) {
              const temp = document.getElementById('search-input');
              temp.value = item.copyValue;
              temp.select();
              document.execCommand('copy');
              saveState('COPIED ✓');
              box.classList.add('hidden');
            } else if (item.fillPrefix) {
              const temp = document.getElementById('search-input');
              temp.value = item.fillPrefix;
              temp.focus();
              box.classList.add('hidden');
            } else if (item.url) {
              navigateTo(item.url, forceNewTab);
            } else {
              runSearch(item.value, forceNewTab);
            }
          });
          fragment.appendChild(btn);
        });

        box.replaceChildren(fragment);
        box.classList.remove('hidden');
      }

      function highlightSuggestionRow(index) {
        const box = document.getElementById('search-suggestions');
        if (!box) return;
        const rows = box.querySelectorAll('.suggestion-row');
        rows.forEach((row, i) => {
          const active = i === index;
          row.classList.toggle('is-highlighted', active);
          if (active) {
            row.scrollIntoView({ block: 'nearest' });
          }
        });
      }

      function navigateTo(url, forceNewTab = false) {
        if (state.openInNewTab || forceNewTab) {
          window.open(url, '_blank', 'noopener,noreferrer');
        } else {
          window.location.href = url;
        }
      }

      function runSearch(raw, forceNewTab = false) {
        const q = (raw || '').trim();
        if (!q) return;

        // Check !bang shortcuts (e.g. "!yt synthwave", "!gh", "!r firefox")
        const parts = q.split(/\s+/);
        const bangKey = parts[0].toLowerCase();
        if (BANG_SHORTCUTS[bangKey]) {
          const rest = parts.slice(1).join(' ');
          if (!rest) {
            const origin = new URL(BANG_SHORTCUTS[bangKey].url).origin;
            navigateTo(origin, forceNewTab);
          } else {
            navigateTo(BANG_SHORTCUTS[bangKey].url + encodeURIComponent(rest), forceNewTab);
          }
          return;
        }

        // Direct protocol or localhost/IP/domain detection
        if (/^(https?:\/\/)/i.test(q)) {
          navigateTo(q, forceNewTab);
          return;
        }

        if (/^(localhost(:\d+)?(\/.*)?|\d{1,3}(\.\d{1,3}){3}(:\d+)?(\/.*)?)$/i.test(q)) {
          navigateTo(`http://${q}`, forceNewTab);
          return;
        }

        if (/^[a-zA-Z0-9-]+(\.[a-zA-Z0-9-]+)*\.[a-zA-Z]{2,}(:\d+)?(\/.*)?$/.test(q) && !q.includes(' ')) {
          navigateTo(`https://${q}`, forceNewTab);
          return;
        }

        const engine = SEARCH_ENGINES[state.searchEngine] || SEARCH_ENGINES.ddg;
        navigateTo(engine.url + encodeURIComponent(q), forceNewTab);
      }

      function cycleSearchEngine(direction = 1) {
        const curIdx = ENGINE_ORDER.indexOf(state.searchEngine);
        const nextIdx = (curIdx + direction + ENGINE_ORDER.length) % ENGINE_ORDER.length;
        state.searchEngine = ENGINE_ORDER[nextIdx];
        saveState(`ENGINE: ${SEARCH_ENGINES[state.searchEngine].code}`);
        applyPreferencesToDOM();
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function bindEvents() {
        const settingsBtn = document.getElementById('settings-dropdown-btn');
        const settingsPanel = document.getElementById('settings-dropdown-panel');

        // Keep windows inside viewport when browser window is resized
        window.addEventListener('resize', () => {
          if (resizeClampTimer) clearTimeout(resizeClampTimer);
          resizeClampTimer = setTimeout(() => {
            if (window.innerWidth > 900) {
              restoreWindowPositions();
              renderStickyNotes();
            }
          }, 120);
        }, { passive: true });

        // Global QoL Keyboard Shortcuts:
        // - '/' or 'Ctrl+K' to focus search
        // - 'N' to open Add Link modal when not typing
        // - 'Escape' to close open modals/dropdowns or blur active input
        // - '1'-'9' to launch Quicklinks when not typing
        // - Calculator numpad/keys when Calculator window is active
        document.addEventListener('keydown', (e) => {
          const el = document.activeElement;
          const activeTag = el ? el.tagName : '';
          const isTyping =
            activeTag === 'INPUT' ||
            activeTag === 'TEXTAREA' ||
            activeTag === 'SELECT' ||
            (el && el.isContentEditable);

          if (e.key === 'Escape') {
            const linkPopup = document.getElementById('popup-link-editor');
            const backupPopup = document.getElementById('popup-backup');
            const sugBox = document.getElementById('search-suggestions');

            if (backupPopup && !backupPopup.classList.contains('hidden')) {
              backupPopup.classList.add('hidden');
              return;
            }
            if (linkPopup && !linkPopup.classList.contains('hidden')) {
              linkPopup.classList.add('hidden');
              return;
            }
            if (settingsPanel && !settingsPanel.classList.contains('hidden')) {
              settingsPanel.classList.add('hidden');
              return;
            }
            if (sugBox && !sugBox.classList.contains('hidden')) {
              sugBox.classList.add('hidden');
              selectedIdx = -1;
              return;
            }
            if (isTyping && el) {
              el.blur();
              return;
            }
          }

          const slashAllowed =
            state.slashFocusSearch !== false &&
            (e.key === '/' || e.code === 'Slash') &&
            !isTyping &&
            !e.ctrlKey &&
            !e.metaKey &&
            !e.altKey;
          const ctrlKAllowed = (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k';

          if (slashAllowed || ctrlKAllowed) {
            e.preventDefault();
            const searchInput = document.getElementById('search-input');
            if (searchInput) {
              const searchWin = document.getElementById('win-search');
              if (searchWin && searchWin.classList.contains('is-shaded')) {
                searchWin.classList.remove('is-shaded');
                if (state.shadedWindows) state.shadedWindows['win-search'] = false;
              }
              bringWindowToFront(searchWin);
              searchInput.focus();
              searchInput.select();
            }
            return;
          }

          if (isTyping || e.ctrlKey || e.metaKey || e.altKey) return;

          // Press [N] to quickly add a new Quicklink
          if (e.key.toLowerCase() === 'n') {
            const calcWin = document.getElementById('win-calc');
            const calcActive = calcWin && calcWin.classList.contains('is-active') && !calcWin.classList.contains('hidden');
            if (!calcActive) {
              e.preventDefault();
              openLinkEditor(null, state.groups[0]);
              return;
            }
          }

          // If Calculator window is active & visible, route calculator keys to it
          const calcWin = document.getElementById('win-calc');
          if (
            calcWin &&
            calcWin.classList.contains('is-active') &&
            !calcWin.classList.contains('hidden')
          ) {
            if (/^[0-9+\-*/.]$/.test(e.key)) {
              e.preventDefault();
              handleCalcInput(e.key);
              return;
            }
            if (e.key === 'Enter' || e.key === '=') {
              e.preventDefault();
              handleCalcInput('=');
              return;
            }
            if (e.key === 'Backspace') {
              e.preventDefault();
              handleCalcInput('BACK');
              return;
            }
            if (e.key === 'Delete' || e.key.toLowerCase() === 'c') {
              e.preventDefault();
              handleCalcInput('C');
              return;
            }
          }

          // Number keys [1-9] launch corresponding Quicklink in visual group order
          if (state.numberHotkeys !== false && /^[1-9]$/.test(e.key) && !editLinksMode) {
            const targetIdx = parseInt(e.key, 10) - 1;
            const orderedLinks = [];
            state.groups.forEach(groupName => {
              state.quicklinks.forEach(q => {
                if ((q.category || state.groups[0]).toLowerCase() === groupName.toLowerCase()) {
                  orderedLinks.push(q);
                }
              });
            });
            if (orderedLinks[targetIdx]) {
              e.preventDefault();
              navigateTo(orderedLinks[targetIdx].url);
            }
          }
        });

        // Cross-tab synchronization so changes in another startpage tab sync cleanly
        window.addEventListener('storage', (e) => {
          if (e.key === STORAGE_KEY && e.newValue) {
            state = loadState();
            applyPreferencesToDOM();
            restoreWindowPositions();
            renderQuicklinks();
            renderCalendar();
            renderStickyNotes();
            fetchWeather(false);

          settingsPanel.classList.toggle('hidden');
        });

        document.addEventListener('click', (e) => {
          if (!e.target.closest('#settings-menu-container')) {

          if (!e.target.closest('#search-form')) {

          newGroupForm.classList.remove('flex');
        });

        newGroupForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const name = newGroupInput.value.trim();
          if (name && !state.groups.some(g => g.toLowerCase() === name.toLowerCase())) {
            state.groups.push(name);
            saveState();
            renderQuicklinks();
          }
          newGroupForm.classList.add('hidden');
          newGroupForm.classList.remove('flex');
        });

        document.getElementById('toggle-edit-mode-btn').addEventListener('click', () => {
          editLinksMode = !editLinksMode;
          renderQuicklinks();
        });

        // Auto-fill Quicklink Name from URL if Name is empty on blur/paste
        const linkTitleInput = document.getElementById('link-title-input');
        const linkUrlInput = document.getElementById('link-url-input');
        linkUrlInput.addEventListener('blur', () => {
          if (!linkTitleInput.value.trim() && linkUrlInput.value.trim()) {
            linkTitleInput.value = deriveDomainTitle(linkUrlInput.value);
          }
        });

        document.getElementById('link-editor-form').addEventListener('submit', (e) => {
          e.preventDefault();
          const id = document.getElementById('link-edit-id').value;
          const url = normalizeUrl(linkUrlInput.value);
          const title = linkTitleInput.value.trim() || deriveDomainTitle(url);
          const category = document.getElementById('link-group-select').value || state.groups[0];

          if (id) {
            const idx = state.quicklinks.findIndex(q => q.id === id);
            if (idx !== -1) state.quicklinks[idx] = { ...state.quicklinks[idx], title, url, category };
          } else {
            state.quicklinks.push({
              id: 'ql_' + Date.now(),
              title,
              url,
              category
            });
          }

          saveState();
          renderQuicklinks();
          document.getElementById('popup-link-editor').classList.add('hidden');
        });

        document.getElementById('delete-link-in-modal-btn').addEventListener('click', () => {
          const id = document.getElementById('link-edit-id').value;
          if (!id) return;
          state.quicklinks = state.quicklinks.filter(q => q.id !== id);
          saveState();
          renderQuicklinks();
          document.getElementById('popup-link-editor').classList.add('hidden');
        });

        // Search Input with Instant Local QoL + 450ms Anti-Bot Debounce
        const searchInput = document.getElementById('search-input');
        searchInput.addEventListener('input', () => {
          if (debounceTimer) clearTimeout(debounceTimer);
          const q = searchInput.value.trim();
          if (!q) {
            renderSuggestions([]);
            return;
          }

          const helperItems = [];

          // 1. Instant Math, Percentage & Unit/Base Converter QoL
          const mathResult = tryEvaluateMathOrUnit(q);
          if (mathResult !== null) {
            helperItems.push({
              label: `= ${mathResult} (Enter to copy)`,
              tag: 'CALC',
              copyValue: mathResult,
              value: mathResult
            });
          }

          // 2. Bang Shortcut Autocomplete & Indicator QoL
          const firstWord = q.split(/\s+/)[0].toLowerCase();
          if (BANG_SHORTCUTS[firstWord]) {
            const rest = q.slice(firstWord.length).trim();
            helperItems.push({
              label: rest
                ? `Search ${BANG_SHORTCUTS[firstWord].name} for "${rest}"`
                : `Open ${BANG_SHORTCUTS[firstWord].name} (${firstWord})`,
              tag: 'BANG',
              value: q
            });
          } else if (q.startsWith('!') && !q.includes(' ')) {
            Object.entries(BANG_SHORTCUTS)
              .filter(([code]) => code.startsWith(firstWord))
              .slice(0, 5)
              .forEach(([code, meta]) => {
                helperItems.push({
                  label: `${code} — Search ${meta.name}`,
                  tag: 'BANG',
                  fillPrefix: `${code} `,
                  value: `${code} `
                });
              });
          }

          // 3. Instant Local Quicklinks Match
          const localMatches = state.quicklinks
            .filter(
              item =>
                item.title.toLowerCase().includes(q.toLowerCase()) ||
                item.url.toLowerCase().includes(q.toLowerCase())
            )
            .slice(0, 4)
            .map(item => ({
              label: `${item.title} (${item.category || 'General'})`,
              tag: 'LINK',
              url: item.url,
              value: item.title
            }));

          const immediateList = [...helperItems, ...localMatches];
          renderSuggestions(immediateList);

          if (q.length >= 3 && !q.startsWith('!') && mathResult === null) {
            debounceTimer = setTimeout(async () => {
              const remote = await fetchPredictions(q);
              if (searchInput.value.trim() !== q) return;
              const remoteItems = remote.map(t => ({ label: t, tag: 'WEB', value: t }));
              renderSuggestions([...immediateList, ...remoteItems].slice(0, 6));
            }, 450);
          }
        });

        searchInput.addEventListener('keydown', (e) => {
          // Press Tab inside Search Input to cycle search engines smoothly
          if (e.key === 'Tab' && !e.altKey && !e.ctrlKey && !e.metaKey) {
            e.preventDefault();
            cycleSearchEngine(e.shiftKey ? -1 : 1);
            return;
          }

          // Alt+Enter or Ctrl/Cmd+Enter forces opening search in a new tab
          if (e.key === 'Enter' && (e.altKey || e.ctrlKey || e.metaKey)) {
            e.preventDefault();
            const chosen = selectedIdx >= 0 ? currentSuggestions[selectedIdx] : null;
            if (chosen?.url) {
              navigateTo(chosen.url, true);
            } else {
              runSearch(searchInput.value, true);
            }
            return;
          }

          const box = document.getElementById('search-suggestions');
          if (box.classList.contains('hidden') || !currentSuggestions.length) return;

          if (e.key === 'ArrowDown') {
            e.preventDefault();
            selectedIdx = (selectedIdx + 1) % currentSuggestions.length;
            highlightSuggestionRow(selectedIdx);
            const cur = currentSuggestions[selectedIdx];
            if (!cur.copyValue && !cur.url) {
              searchInput.value = cur.value;
            }
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            selectedIdx = (selectedIdx - 1 + currentSuggestions.length) % currentSuggestions.length;
            highlightSuggestionRow(selectedIdx);
            const cur = currentSuggestions[selectedIdx];
            if (!cur.copyValue && !cur.url) {
              searchInput.value = cur.value;
            }
          }
        });

        document.getElementById('search-form').addEventListener('submit', (e) => {
          e.preventDefault();
          const chosen = selectedIdx >= 0 ? currentSuggestions[selectedIdx] : (currentSuggestions[0]?.copyValue ? currentSuggestions[0] : null);
          if (chosen?.copyValue) {
            searchInput.value = chosen.copyValue;
            searchInput.select();
            document.execCommand('copy');
            saveState('COPIED ✓');
            document.getElementById('search-suggestions').classList.add('hidden');
            return;
          }
          if (chosen?.fillPrefix) {
            searchInput.value = chosen.fillPrefix;
            searchInput.focus();
            document.getElementById('search-suggestions').classList.add('hidden');
            return;
          }
          if (selectedIdx >= 0 && currentSuggestions[selectedIdx]?.url) {
            navigateTo(currentSuggestions[selectedIdx].url);
            return;
          }
          runSearch(searchInput.value);
        });

        // Universal Quicklinks JSON File Upload & Import / Backup Actions
        const showImportMessage = (text) => {
          const msg = document.getElementById('backup-status-msg');
          msg.textContent = text;
          msg.classList.remove('hidden');
        };

        const handleUniversalImport = (rawText, mode) => {
          try {
            const parsed = JSON.parse(rawText);
            const extracted = extractQuicklinksFromAnyJSON(parsed);

            // If user clicked "Replace All / Full Restore" and it's a full WIN/87 backup
            if (
              mode === 'replace' &&
              parsed &&
              typeof parsed === 'object' &&
              !Array.isArray(parsed) &&
              (parsed.windowPositions || parsed.theme || parsed.stickyNotes)
            ) {
              state = {
                ...JSON.parse(JSON.stringify(DEFAULT_STATE)),
                ...parsed,
                quicklinks: extracted.links.length ? extracted.links : (parsed.quicklinks || []),
                groups: normalizeGroups(
                  [...(parsed.groups || []), ...extracted.groups],
                  extracted.links.length ? extracted.links : (parsed.quicklinks || [])
                ),
                stickyNotes: normalizeStickyNotes(parsed.stickyNotes)
              };
              saveState('FULL RESTORE ✓');
              applyPreferencesToDOM();
              restoreWindowPositions();
              renderQuicklinks();
              renderStickyNotes();
              renderCalendar();
              updateClock();
              fetchWeather();
              showImportMessage(`Restored full workspace (${state.quicklinks.length} links).`);
              return;
            }

            if (!extracted.links.length) {
              showImportMessage('No quicklinks found in that JSON. Make sure it contains URLs.');
              return;
            }

            if (mode === 'replace') {
              state.quicklinks = extracted.links;
              state.groups = normalizeGroups(extracted.groups, extracted.links);
            } else {
              // Merge without duplicating identical URLs in the same group
              let addedCount = 0;
              extracted.groups.forEach(g => {
                if (!state.groups.some(x => x.toLowerCase() === g.toLowerCase())) {
                  state.groups.push(g);
                }
              });
              extracted.links.forEach(item => {
                const exists = state.quicklinks.some(
                  q => q.url.toLowerCase() === item.url.toLowerCase()
                );
                if (!exists) {
                  state.quicklinks.push(item);
                  addedCount++;
                }
              });
              state.groups = normalizeGroups(state.groups, state.quicklinks);
              saveState(`IMPORTED ${addedCount} LINKS ✓`);
              renderQuicklinks();
              showImportMessage(
                `Imported ${addedCount} new quicklinks across ${extracted.groups.length || 1} group(s)!`
              );
              return;
            }

            saveState(`IMPORTED ${extracted.links.length} LINKS ✓`);
            renderQuicklinks();
            showImportMessage(`Loaded ${extracted.links.length} quicklinks!`);
          } catch {
            showImportMessage('Invalid JSON format. Please check your file or pasted text.');
          }
        };

        document.getElementById('import-json-file-input').addEventListener('change', (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            const content = String(reader.result || '');
            document.getElementById('backup-json-textarea').value = content;
            handleUniversalImport(content, 'merge');
          };
          reader.readAsText(file);
          e.target.value = '';
        });

        document.getElementById('import-merge-links-btn').addEventListener('click', () => {
          handleUniversalImport(document.getElementById('backup-json-textarea').value, 'merge');
        });

        document.getElementById('apply-import-btn').addEventListener('click', () => {
          handleUniversalImport(document.getElementById('backup-json-textarea').value, 'replace');
        });

        document.getElementById('export-json-btn').addEventListener('click', () => {
          const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'win87-backup.json';
          a.click();
          URL.revokeObjectURL(url);
        });

        document.getElementById('copy-json-btn').addEventListener('click', () => {
          const ta = document.getElementById('backup-json-textarea');
          ta.value = JSON.stringify(state, null, 2);
          ta.select();
          document.execCommand('copy');
          showImportMessage('Current startpage JSON copied to clipboard.');
        });
      }

      function init() {
        applyPreferencesToDOM();
        restoreWindowPositions();
        initDraggableWindows();
        renderQuicklinks();
        renderCalendar();
        renderStickyNotes();
        fetchWeather();
        updateClock();
        setInterval(updateClock, 1000);
        bindEvents();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
